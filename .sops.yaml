# .sops.yaml — sops-nix encryption rules
#
# =============================================================================
# TWO-TIER SECRET ARCHITECTURE
# =============================================================================
#
# This repository has two distinct classes of encrypted secrets, each with a
# different decryption actor and a different point-in-time for decryption:
#
# TIER 1 — NixOS-side secrets  (under secrets/<host>/)
# -------------------------------------------------------
#   Decrypted by: sops-nix at NixOS system activation time
#   How:          the host reads its own age private key from
#                 /var/lib/sops-nix/key.txt, decrypts the secret, and
#                 materialises it under /run/secrets/<name> (tmpfs).
#   Who can decrypt: master key (laptop) + the specific host's age key
#   Examples:
#     secrets/chopper/k3s-token                   → k3s join token for all
#                                                    cluster nodes
#     secrets/chopper/tailscale-operator-oauth    → OAuth creds bootstrapped
#                                                    into the Tailscale k8s
#                                                    operator Secret manifest
#     secrets/chopper/secrets.yaml                → Tailscale auth key,
#                                                    Nextcloud admin pass,
#                                                    Cloudflared tunnel creds
#
# TIER 2 — Cluster-side secrets  (under k8s/clusters/*/secrets/)
# ---------------------------------------------------------------
#   Decrypted by: the operator's laptop, manually, via `just k8s-apply`
#   How:          `sops --decrypt <file> | kubectl apply -f -` or
#                 `helmfile` with the helm-secrets plugin.
#                 Cluster nodes never need to hold these decrypt keys.
#   Who can decrypt: master key only (the laptop)
#   Examples:
#     k8s/clusters/chopper/secrets/cnpg-backup-s3.enc.yaml
#                                                 → Barman Cloud / S3 creds
#                                                    for off-site CNPG backups
#     k8s/apps/*/secrets.yaml                     → Helm chart values with
#                                                    embedded secrets
#
# KEY PRINCIPLE: Plaintext Secret manifests MUST NEVER enter git.
#   Every file matching k8s/**/secrets.yaml and k8s/**/*.enc.yaml is
#   encrypted by the rules below. A .gitattributes diff driver can
#   additionally be used for readability, but encryption is the hard rule.
#
# =============================================================================
# KEY HIERARCHY
# =============================================================================
#
#   - MASTER KEY: generated with `age-keygen` on your primary device.
#     Can decrypt ALL secrets across every host and every k8s context.
#     Private key: keep safe (password manager, encrypted USB, etc.)
#     Public key: listed below as &master
#
#   - HOST KEYS: generated with `age-keygen` on each managed machine.
#     Stored at /var/lib/sops-nix/key.txt on the host.
#     Can ONLY decrypt Tier-1 secrets under secrets/<that-host>/*.
#
# To set up:
#   1. Generate master key:   age-keygen -o master.key
#      (note the public key, store private key safely)
#   2. Generate host key:     age-keygen -o /var/lib/sops-nix/key.txt
#      (note the public key)
#   3. Replace the PLACEHOLDER values below with real public keys
#   4. Encrypt secrets:       sops secrets/<host>/secrets.yaml
#
# To add a new host:
#   1. On the new host: age-keygen -o /var/lib/sops-nix/key.txt
#   2. Add the public key below with a new anchor (e.g. &newhost)
#   3. Add a creation_rule for secrets/<newhost>/* with master + newhost
#   4. Run: sops secrets/<newhost>/secrets.yaml

keys:
  # Master key — lives on your primary device, decrypts everything
  - &master age1a58h6uzrz2pvk03swtjjzd7ekn9fxnyumxffr9ss4emkmgd03grq9v0eye

  # Host keys — each host can only decrypt its own Tier-1 secrets
  - &chopper age1y8v9n2z4y8kp8mfdytvxasud379n44dlrwkn88ynh5u2xnjt2aks8m0xz4
  - &kenobi age1vexywt66s7fzakttu4tw0kyzyl6dc73u6jr870w08nsdegmanudshv3kjv
  - &c3po age1kxdlut9r8fxw9hsfhdq0jgs798qy4zrs2traxsxvw46wldsd7qdqye7m2n
  - &r2d2 age1pwsnn9ptq7xju2k583n8dum0h82alwe3q9rdzl2ute720wrf53psl0d5wd

  # CI key — GitHub Actions can only decrypt secrets/ci/*
  - &ci age15arhyjjf09vy4he9qfhzyvl2p4kx8plzqycjfw4fjmkq32lhvgmscq5s2w

creation_rules:
  # ---------------------------------------------------------------------------
  # TIER 1: NixOS-side secrets — decrypted by sops-nix at system activation
  # ---------------------------------------------------------------------------
  #
  # secrets/chopper/ covers ALL Tier-1 secrets for the chopper host, including:
  #   - secrets.yaml                   (Tailscale auth key, Nextcloud pass, etc.)
  #   - k3s-token                      (k3s cluster join token)
  #   - tailscale-operator-oauth       (Tailscale k8s operator OAuth creds)
  #
  # Both the master key (laptop) and chopper's own age key can decrypt these.
  # The host needs its own key because sops-nix decrypts at activation time,
  # before any human operator is present.
  - path_regex: secrets/chopper/.*
    key_groups:
      - age:
          - *master
          - *chopper

  - path_regex: secrets/kenobi/.*
    key_groups:
      - age:
          - *master
          - *kenobi

  - path_regex: secrets/c3po/.*
    key_groups:
      - age:
          - *master
          - *c3po

  - path_regex: secrets/r2d2/.*
    key_groups:
      - age:
          - *master
          - *r2d2

  # Example for a future host (add its age key anchor above first):
  # - path_regex: secrets/newhost/.*
  #   key_groups:
  #     - age:
  #         - *master
  #         - *newhost

  # ---------------------------------------------------------------------------
  # LAPTOP-side secrets — decrypted by the operator's laptop at tool-call time
  # ---------------------------------------------------------------------------
  #
  # secrets/laptop/* holds credentials consumed by tooling that runs directly
  # on the operator's Mac (NOT on any managed host and NOT in-cluster).
  # Example:
  #   secrets/laptop/wiki-mcp.yaml  → MediaWiki bot password for the
  #                                   mediawiki-mcp-server, decrypted lazily
  #                                   via an `exec` secret source in
  #                                   ~/.config/mediawiki-mcp/config.json.
  #
  # Encrypted to the master key only — no managed host or CI runner has any
  # business decrypting laptop-local credentials.
  - path_regex: secrets/laptop/.*
    key_groups:
      - age:
          - *master

  # ---------------------------------------------------------------------------
  # CI secrets — decrypted by GitHub Actions using the &ci age key
  # ---------------------------------------------------------------------------
  #
  # secrets/ci/* contains tokens and credentials needed by CI workflows.
  # Only the master key and the CI key can decrypt these. Host keys have
  # NO access — if a host is compromised, CI tokens remain safe.
  #
  # The only GitHub Actions secret needed is SOPS_AGE_KEY (the CI private key).
  # Everything else (ATTIC_TOKEN, CACHIX_AUTH_TOKEN, TS_OAUTH_*) lives here.
  - path_regex: secrets/ci/.*
    key_groups:
      - age:
          - *master
          - *ci

  # ---------------------------------------------------------------------------
  # TIER 2: Cluster-side secrets — decrypted by the operator at apply time
  # ---------------------------------------------------------------------------
  #
  # k8s/**/secrets.yaml    — Helm values files containing secrets (helm-secrets)
  # k8s/**/*.enc.yaml      — Encrypted raw Kubernetes Secret manifests
  #                          (e.g. cnpg-backup-s3.enc.yaml)
  #
  # These are decrypted by the operator's laptop via `just k8s-apply`:
  #   sops --decrypt k8s/clusters/chopper/secrets/cnpg-backup-s3.enc.yaml \
  #     | kubectl apply -f -
  #
  # ALSO encrypted to *chopper* so that bootstrap operators whose credentials
  # must be present the moment k3s starts (e.g. Tailscale operator OAuth)
  # can be surfaced by sops-nix as well. See TIER 1 note above — the
  # tailscale-operator-oauth secret lives under secrets/chopper/ (Tier 1),
  # NOT here; this rule is for cluster-side secrets only.
  #
  # Only the master key can decrypt Tier-2 secrets (cluster nodes have no
  # business decrypting raw Kubernetes Secret manifests).
  - path_regex: k8s/.*/(secrets\.yaml|.*\.enc\.yaml)$
    key_groups:
      - age:
          - *master
          - *chopper
          - *kenobi
