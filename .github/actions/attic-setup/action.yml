name: Attic Setup
description: Install pinned attic-client, decrypt CI token via sops, and authenticate
inputs:
  sops-age-key:
    required: true
    description: SOPS_AGE_KEY secret
  attic-server:
    required: false
    default: https://cache.tellmey.fyi
    description: Attic server URL
  attic-cache:
    required: false
    default: system
    description: Attic cache name
outputs:
  attic-cache:
    value: ${{ inputs.attic-cache }}
    description: The cache name
runs:
  using: composite
  steps:
    # --inputs-from . pins both tools to THIS repo's flake.lock instead of
    # the runner's floating nixpkgs registry.
    - name: Install attic-client
      run: nix profile install --inputs-from . nixpkgs#attic-client
      shell: bash

    - name: Decrypt CI token and login
      env:
        SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
      run: |
        set -euo pipefail
        # sops --extract prints only the one value: no plaintext file on
        # disk, no brittle grep/awk YAML parsing.
        ATTIC_TOKEN=$(nix run --inputs-from . nixpkgs#sops -- \
          --decrypt --extract '["attic_token"]' secrets/ci/actions.yaml)
        echo "::add-mask::$ATTIC_TOKEN"
        attic login ci "${{ inputs.attic-server }}" "$ATTIC_TOKEN"
      shell: bash
