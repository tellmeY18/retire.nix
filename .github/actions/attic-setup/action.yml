name: Attic Setup
description: Install attic-client, decrypt CI token, and authenticate with cache
inputs:
  sops-age-key:
    required: true
    description: SOPS_AGE_KEY secret
  attic-server:
    required: false
    default: https://cache.tellmey.fyi
    description: Attic server URL
  attic-cache:
    required: false
    default: system
    description: Attic cache name
outputs:
  attic-cache:
    value: ${{ inputs.attic-cache }}
    description: The cache name
runs:
  using: composite
  steps:
    - name: Install attic-client
      run: nix profile install nixpkgs#attic-client
      shell: bash

    - name: Decrypt CI token and login
      env:
        SOPS_AGE_KEY: ${{ inputs.sops-age-key }}
      run: |
        nix run nixpkgs#sops -- -d secrets/ci/actions.yaml > /tmp/ci.yaml
        ATTIC_TOKEN=$(grep '^attic_token:' /tmp/ci.yaml | awk '{print $2}')
        rm /tmp/ci.yaml
        attic login ci "${{ inputs.attic-server }}" "$ATTIC_TOKEN"
        attic use "${{ inputs.attic-cache }}"
      shell: bash
