# CI: Build Apache Answer with Plugins (multi-arch, native runners)
#
# Builds a custom Apache Answer Docker image with the plugins defined in
# k8s/images/answer/plugins.txt, then pushes to ghcr.io/tellmey18/answer.
#
# The plugin list is the single source of truth — add/remove a line in
# plugins.txt and re-run this workflow to get a new image.
#
# Tags: build-{N} + sha-{7char} — NO :latest (forces explicit pinning)
name: Build Answer Image

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "k8s/images/answer/**"
      - ".github/workflows/answer-build.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tellmey18/answer

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        run: |
          BUILD_TAG="build-${{ github.run_number }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Extract plugin list
        id: plugins
        run: |
          PLUGINS=$(grep -v '^#' k8s/images/answer/plugins.txt | grep -v '^$' | tr '\n' ', ' | sed 's/,$//')
          echo "list=$PLUGINS" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        uses: docker/build-push-action@v6
        with:
          context: k8s/images/answer
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.build_tag }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: |
            org.opencontainers.image.title=Apache Answer
            org.opencontainers.image.description=Apache Answer with plugins: ${{ steps.plugins.outputs.list }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=answer-${{ matrix.platform }}
          cache-to: type=gha,scope=answer-${{ matrix.platform }},mode=max
          # mode=max caches ALL intermediate layers (deps stage, golang-builder
          # stage before the final COPY). This means the expensive Go compile
          # layer is reused when plugins.txt hasn't changed.

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          BUILD_TAG="build-${{ github.run_number }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create -t "${IMAGE}:${BUILD_TAG}" -t "${IMAGE}:${SHA_TAG}" \
            "${IMAGE}:${BUILD_TAG}-amd64" \
            "${IMAGE}:${BUILD_TAG}-arm64"

          echo "## 🎉 Answer Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${BUILD_TAG}\` | \`${IMAGE}:${BUILD_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${SHA_TAG}\` | \`${IMAGE}:${SHA_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Plugins:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -v '^#' k8s/images/answer/plugins.txt | grep -v '^$' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update deployment: \`image: ${IMAGE}:${BUILD_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
