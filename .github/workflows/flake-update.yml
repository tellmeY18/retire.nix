# CI: Flake Update — automated nixpkgs-unstable upgrade pipeline.
#
# Every 3 days (or on manual trigger), this workflow:
#   1. Runs `nix flake update` to pull the latest nixpkgs-unstable + inputs
#   2. Opens a PR with the updated flake.lock
#   3. Builds EVERY host config on native-arch runners (3 parallel jobs)
#   4. Each job pushes its closures to Attic after successful build
#   5. Finalize: auto-merges if all builds pass, closes PR if any fail
#
# Architecture:
#   Each arch job is SELF-CONTAINED: build + push. This means:
#   - Re-running a single failed job doesn't redo successful ones
#   - Cache push happens per-arch (no "all or nothing" gate)
#   - Finalize merges based on BUILD success (push is best-effort)
#
# On transient failures (rate limits, etc.): use "Re-run failed jobs"
# in the GitHub Actions UI. Only the failed arch re-runs.
#
# Hosts built:
#   x86_64-linux   — chopper, c3po, vysakh@chopper (HM)
#   aarch64-linux  — kenobi
#   aarch64-darwin — Vysakhs-MacBook-Pro, mathewalex@MacBook (HM)
#
# Invariant: `develop` always contains a flake.lock that builds for
# every host. If an update breaks any config, the PR never merges.
name: Flake Update

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:
    inputs:
      skip_cache:
        description: "Skip pushing to Attic (build-only)"
        required: false
        type: boolean
        default: false

concurrency:
  group: flake-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  CACHIX_CACHE: tellmey18
  ATTIC_SERVER: http://attic.tail477f2f.ts.net:8080
  ATTIC_CACHE: system
  TAILSCALE_VERSION: "1.82.5"
  PR_BRANCH: automation/flake-update

jobs:
  # ---------------------------------------------------------------------------
  # 1. Update flake.lock and open/update a PR
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.pr.outputs.pull-request-number }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false

      - name: Run nix flake update
        run: nix flake update

      - name: Check for flake.lock changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update PR
        if: steps.check.outputs.has_changes == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.PR_BRANCH }}
          commit-message: "chore(flake): update flake.lock"
          title: "chore(flake): update flake.lock"
          body: |
            Automated `nix flake update` — builds running for all systems.
            Use **Re-run failed jobs** if a single arch fails transiently.
          labels: flake-update
          delete-branch: true

  # ---------------------------------------------------------------------------
  # 2. Build + push per architecture (self-contained, independently re-runnable)
  # ---------------------------------------------------------------------------
  build-x86_64-linux:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BRANCH }}
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate flake checks
        run: nix flake check --no-build

      - name: Build NixOS (chopper)
        run: nix build .#nixosConfigurations.chopper.config.system.build.toplevel --print-build-logs

      - name: Push chopper to Attic
        if: ${{ !inputs.skip_cache }}
        continue-on-error: true
        run: nix run nixpkgs#attic-client -- push "$ATTIC_CACHE" ./result
        env:
          ATTIC_SERVER_TOKEN: placeholder

      - name: GC between builds
        run: nix-collect-garbage >/dev/null 2>&1

      - name: Build NixOS (c3po)
        run: nix build .#nixosConfigurations.c3po.config.system.build.toplevel --print-build-logs

      - name: GC between builds
        run: nix-collect-garbage >/dev/null 2>&1

      - name: Build Home Manager (vysakh@chopper)
        run: nix build .#homeConfigurations."vysakh@chopper".activationPackage --print-build-logs

      # Push ALL x86_64 closures to Attic at end (after all builds pass)
      - name: Connect to Tailscale + push to Attic
        if: ${{ !inputs.skip_cache }}
        continue-on-error: true
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # Decrypt secrets
          nix run nixpkgs#sops -- -d secrets/ci/actions.yaml > /tmp/ci.yaml
          ATTIC_TOKEN=$(grep '^attic_token:' /tmp/ci.yaml | awk '{print $2}')
          TS_CLIENT_ID=$(grep '^ts_oauth_client_id:' /tmp/ci.yaml | awk '{print $2}')
          TS_CLIENT_SECRET=$(grep '^ts_oauth_secret:' /tmp/ci.yaml | awk '{print $2}')
          rm /tmp/ci.yaml

          # Connect Tailscale
          curl -fsSL "https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE_VERSION}_amd64.tgz" | sudo tar -xzf - -C /usr/local/bin --strip-components=1 "tailscale_${TAILSCALE_VERSION}_amd64/tailscale" "tailscale_${TAILSCALE_VERSION}_amd64/tailscaled"
          sudo tailscaled --state=mem: &
          sleep 2
          ACCESS_TOKEN=$(curl -fsSL -d "client_id=${TS_CLIENT_ID}" -d "client_secret=${TS_CLIENT_SECRET}" "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          AUTH_KEY=$(curl -fsSL -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}}}' "https://api.tailscale.com/api/v2/tailnet/-/keys" | jq -r '.key')
          sudo tailscale up --authkey="$AUTH_KEY" --hostname="gh-ci-x86"

          # Push to Attic
          nix profile install nixpkgs#attic-client
          attic login ci "$ATTIC_SERVER" "$ATTIC_TOKEN"
          attic use "$ATTIC_CACHE"

          for target in \
            ".#nixosConfigurations.chopper.config.system.build.toplevel" \
            ".#nixosConfigurations.c3po.config.system.build.toplevel" \
            ".#homeConfigurations.\"vysakh@chopper\".activationPackage"; do
            nix build "$target" 2>/dev/null
            attic push "$ATTIC_CACHE" ./result || true
            nix-collect-garbage >/dev/null 2>&1
          done

  build-aarch64-linux:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BRANCH }}
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
      # magic-nix-cache disabled on arm64 — causes rate-limit crashes

      - name: Build NixOS (kenobi)
        run: nix build .#nixosConfigurations.kenobi.config.system.build.toplevel --print-build-logs

      - name: Connect to Tailscale + push to Attic
        if: ${{ !inputs.skip_cache }}
        continue-on-error: true
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          nix run nixpkgs#sops -- -d secrets/ci/actions.yaml > /tmp/ci.yaml
          ATTIC_TOKEN=$(grep '^attic_token:' /tmp/ci.yaml | awk '{print $2}')
          TS_CLIENT_ID=$(grep '^ts_oauth_client_id:' /tmp/ci.yaml | awk '{print $2}')
          TS_CLIENT_SECRET=$(grep '^ts_oauth_secret:' /tmp/ci.yaml | awk '{print $2}')
          rm /tmp/ci.yaml

          curl -fsSL "https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE_VERSION}_arm64.tgz" | sudo tar -xzf - -C /usr/local/bin --strip-components=1 "tailscale_${TAILSCALE_VERSION}_arm64/tailscale" "tailscale_${TAILSCALE_VERSION}_arm64/tailscaled"
          sudo tailscaled --state=mem: &
          sleep 2
          ACCESS_TOKEN=$(curl -fsSL -d "client_id=${TS_CLIENT_ID}" -d "client_secret=${TS_CLIENT_SECRET}" "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          AUTH_KEY=$(curl -fsSL -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}}}' "https://api.tailscale.com/api/v2/tailnet/-/keys" | jq -r '.key')
          sudo tailscale up --authkey="$AUTH_KEY" --hostname="gh-ci-arm"

          nix profile install nixpkgs#attic-client
          attic login ci "$ATTIC_SERVER" "$ATTIC_TOKEN"
          attic use "$ATTIC_CACHE"
          nix build .#nixosConfigurations.kenobi.config.system.build.toplevel 2>/dev/null
          attic push "$ATTIC_CACHE" ./result || true

  build-aarch64-darwin:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: macos-14
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /Users/runner/Library/Android \
            /Applications/Xcode_*.app \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /Library/Frameworks/Mono.framework \
            /usr/local/share/dotnet 2>/dev/null || true
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_BRANCH }}
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
      # magic-nix-cache skipped on macOS — dyld incompatibility

      - name: Build macOS (darwin)
        run: nix build .#darwinConfigurations."Vysakhs-MacBook-Pro".system --print-build-logs

      - name: GC between builds
        run: nix-collect-garbage >/dev/null 2>&1

      - name: Build Home Manager (darwin)
        run: nix build .#homeConfigurations."mathewalex@Vysakhs-MacBook-Pro".activationPackage --print-build-logs

      - name: Connect to Tailscale + push to Attic
        if: ${{ !inputs.skip_cache }}
        continue-on-error: true
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          nix run nixpkgs#sops -- -d secrets/ci/actions.yaml > /tmp/ci.yaml
          ATTIC_TOKEN=$(grep '^attic_token:' /tmp/ci.yaml | awk '{print $2}')
          TS_CLIENT_ID=$(grep '^ts_oauth_client_id:' /tmp/ci.yaml | awk '{print $2}')
          TS_CLIENT_SECRET=$(grep '^ts_oauth_secret:' /tmp/ci.yaml | awk '{print $2}')
          rm /tmp/ci.yaml

          TS_PATH=$(nix build nixpkgs#tailscale --no-link --print-out-paths)
          sudo "$TS_PATH/bin/tailscaled" --state=mem: &
          sleep 3
          ACCESS_TOKEN=$(curl -fsSL -d "client_id=${TS_CLIENT_ID}" -d "client_secret=${TS_CLIENT_SECRET}" "https://api.tailscale.com/api/v2/oauth/token" | jq -r '.access_token')
          AUTH_KEY=$(curl -fsSL -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Content-Type: application/json" -d '{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["tag:ci"]}}}}' "https://api.tailscale.com/api/v2/tailnet/-/keys" | jq -r '.key')
          sudo "$TS_PATH/bin/tailscale" up --authkey="$AUTH_KEY" --hostname="gh-ci-darwin"
          sudo networksetup -setdnsservers "Ethernet" 100.100.100.100
          sudo networksetup -setsearchdomains "Ethernet" tail477f2f.ts.net

          nix profile install nixpkgs#attic-client
          attic login ci "$ATTIC_SERVER" "$ATTIC_TOKEN"
          attic use "$ATTIC_CACHE"

          for target in \
            ".#darwinConfigurations.\"Vysakhs-MacBook-Pro\".system" \
            ".#homeConfigurations.\"mathewalex@Vysakhs-MacBook-Pro\".activationPackage"; do
            nix build "$target" 2>/dev/null
            attic push "$ATTIC_CACHE" ./result || true
            nix-collect-garbage >/dev/null 2>&1
          done

  # ---------------------------------------------------------------------------
  # 3. Finalize — merge on all builds green (push is best-effort)
  # ---------------------------------------------------------------------------
  finalize:
    needs:
      [prepare, build-x86_64-linux, build-aarch64-linux, build-aarch64-darwin]
    if: always() && needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
    steps:
      - name: Determine result
        id: result
        env:
          R_X86: ${{ needs.build-x86_64-linux.result }}
          R_ARM: ${{ needs.build-aarch64-linux.result }}
          R_DAR: ${{ needs.build-aarch64-darwin.result }}
        run: |
          echo "x86_64-linux:   $R_X86"
          echo "aarch64-linux:  $R_ARM"
          echo "aarch64-darwin: $R_DAR"
          if [[ "$R_X86" == "success" && "$R_ARM" == "success" && "$R_DAR" == "success" ]]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-merge
        if: steps.result.outputs.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" \
            --body "✅ All builds passed. Binaries pushed to Attic (best-effort). Auto-merging."
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" \
            --squash --auto --delete-branch

      - name: Comment on failure
        if: steps.result.outputs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R_X86: ${{ needs.build-x86_64-linux.result }}
          R_ARM: ${{ needs.build-aarch64-linux.result }}
          R_DAR: ${{ needs.build-aarch64-darwin.result }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body "❌ Build failed.
          x86_64: $R_X86 | arm64: $R_ARM | darwin: $R_DAR
          PR stays open — use **Re-run failed jobs** for transient failures.
          Next cron run will replace this PR if inputs have moved."
