# CI: Flake Update — weekly updater. Creates/refreshes the lock PR, nothing else.
#
# Responsibilities (deliberately tiny — see docs/ci-cache.md):
#   1. Weekly (Mon 02:37 UTC — non-round time to dodge GitHub's cron congestion)
#      or on manual trigger, run `nix flake update`.
#   2. Open or update ONE PR on branch automation/flake-update.
#   3. Nothing else. Builds, Attic pushes, and verification happen in the
#      ordinary pull_request CI (.github/workflows/build.yml), attached to
#      the PR's immutable head SHA. Merging is manual.
#
# Freeze-when-green: if an open flake-update PR already has a successful
# "all hosts built and cached" check, this workflow exits WITHOUT touching
# the branch — a green, ready-to-merge candidate is never replaced by the
# timer. Manual dispatch with force_update=true overrides this.
#
# Token: the PR is created with a PAT (sops: secrets/ci/actions.yaml
# `github_pat`), NOT the workflow GITHUB_TOKEN — PRs created by
# GITHUB_TOKEN do not trigger pull_request workflows, which would silently
# skip the entire build/cache gate.
name: Flake Update

on:
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Update the candidate even if the open PR is green"
        required: false
        type: boolean
        default: false

concurrency:
  group: flake-update
  cancel-in-progress: false

# The PAT does all the writing; the workflow token needs nothing.
permissions:
  contents: read

env:
  PR_BRANCH: automation/flake-update
  GATE_CHECK_NAME: all hosts built and cached

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          flakehub: false

      - name: Read GitHub PAT from sops
        id: pat
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          pat=$(nix run --inputs-from . nixpkgs#sops -- \
            --decrypt --extract '["github_pat"]' secrets/ci/actions.yaml)
          echo "::add-mask::$pat"
          echo "token=$pat" >> "$GITHUB_OUTPUT"

      # Freeze-when-green: a ready-to-merge candidate must not be replaced
      # by the timer (merge is manual).
      - name: Check for a green open PR
        id: freeze
        if: ${{ !inputs.force_update }}
        env:
          GH_TOKEN: ${{ steps.pat.outputs.token }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --head "$PR_BRANCH" --state open \
            --json number,headRefOid --jq '.[0] // empty')
          if [[ -z "$pr" ]]; then
            echo "No open flake-update PR — proceeding."
            echo "frozen=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          number=$(jq -r .number <<<"$pr")
          head_sha=$(jq -r .headRefOid <<<"$pr")
          state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/status" \
            --jq "[.statuses[] | select(.context == \"$GATE_CHECK_NAME\")] | first | .state // \"none\"")
          echo "PR #$number head $head_sha gate status: $state"
          if [[ "$state" == "success" ]]; then
            echo "PR #$number is green and awaiting manual merge — leaving it untouched."
            echo "frozen=true" >> "$GITHUB_OUTPUT"
          else
            echo "frozen=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update flake.lock and open/update PR
        if: ${{ inputs.force_update || steps.freeze.outputs.frozen != 'true' }}
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ steps.pat.outputs.token }}
          branch: ${{ env.PR_BRANCH }}
          commit-msg: "chore(flake): update flake.lock"
          pr-title: "chore(flake): update flake.lock"
          pr-labels: flake-update
          pr-body: |
            Automated `nix flake update`.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

            Builds + Attic push + substitution verification run as ordinary
            PR checks (`Build & Cache`) against this PR's head SHA.

            - ✅ Merge manually once **all hosts built and cached** is green.
            - ♻️ Transient failure? Re-run the whole check suite (not
              individual jobs) from the Actions UI.
            - 🧊 While this PR is green, the weekly timer will not touch it.
