# CI: Build Cal.diy (multi-arch, native runners)
#
# calcom/cal.diy publishes no Docker Hub tags — this workflow builds the
# image ourselves from their Dockerfile and pushes to ghcr.io/tellmey18/cal-diy.
#
# The build needs a *reachable* Postgres at build time (Next.js statically
# renders some pages against the DB during `yarn build`) — a throwaway
# postgres:17 service container satisfies this; it is never used at runtime.
# Runtime points at the real CNPG `caldiy` database instead (see
# k8s/clusters/glug-infra/caldiy/).
#
# Tags: build-{N} + sha-{7char} — NO :latest (forces explicit pinning in
# k8s/clusters/glug-infra/caldiy/deployment.yaml).
name: Build Cal.diy Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "calcom/cal.diy git ref to build (main is often broken; prefer a release tag)"
        required: false
        default: "v6.2.0"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tellmey18/cal-diy
  WEBAPP_URL: https://date.tellmey.fyi

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caldiy_build
          POSTGRES_PASSWORD: caldiy_build
          POSTGRES_DB: caldiy_build
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout calcom/cal.diy
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ github.event.inputs.ref }}
          path: cal.diy

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        run: |
          BUILD_TAG="build-${{ github.run_number }}"
          SHA_TAG="sha-$(cd cal.diy && git rev-parse --short=7 HEAD)"
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push by platform
        uses: docker/build-push-action@v6
        with:
          context: cal.diy
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            DATABASE_URL=postgresql://caldiy_build:caldiy_build@localhost:5432/caldiy_build
            NEXT_PUBLIC_WEBAPP_URL=${{ env.WEBAPP_URL }}
            NEXTAUTH_SECRET=ci-build-only-not-used-at-runtime
            CALENDSO_ENCRYPTION_KEY=ci-build-only-32-bytes-padding
            CALCOM_TELEMETRY_DISABLED=1
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.build_tag }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          labels: |
            org.opencontainers.image.title=Cal.diy
            org.opencontainers.image.source=https://github.com/calcom/cal.diy
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha_tag }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:cache-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }},mode=max

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          BUILD_TAG="build-${{ github.run_number }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create -t "${IMAGE}:${BUILD_TAG}" \
            "${IMAGE}:${BUILD_TAG}-amd64" \
            "${IMAGE}:${BUILD_TAG}-arm64"

          echo "## 🎉 Cal.diy Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${BUILD_TAG}\` | \`${IMAGE}:${BUILD_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update deployment: \`image: ${IMAGE}:${BUILD_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "  k8s/clusters/glug-infra/caldiy/deployment.yaml" >> "$GITHUB_STEP_SUMMARY"
