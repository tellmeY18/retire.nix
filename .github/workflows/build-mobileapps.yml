name: Build mobileapps

on:
  push:
    paths:
      - 'k8s/clusters/glug-infra/mobileapps/Dockerfile'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: k8s/clusters/glug-infra/mobileapps
          file: k8s/clusters/glug-infra/mobileapps/Dockerfile
          push: true
          tags: |
            ghcr.io/tellmey18/mobileapps:latest
            ghcr.io/tellmey18/mobileapps:${{ github.sha }}
