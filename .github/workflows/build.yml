# CI: Build Configurations — evaluate all host and home-manager configs.
#
# Uses --dry-run so Nix fully evaluates every derivation (catching syntax
# errors, missing attributes, type mismatches) without downloading or
# building store paths. Full builds are done by the flake-update workflow.
#
# Covers EVERY host in flake.nix across all architectures:
#   x86_64-linux   — chopper, c3po, vysakh@chopper (HM)
#   aarch64-linux  — kenobi
#   aarch64-darwin — Vysakhs-MacBook-Pro, mathewalex@MacBook (HM)
name: Build Configurations

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate NixOS (chopper)
        run: nix build .#nixosConfigurations.chopper.config.system.build.toplevel --dry-run

      - name: Evaluate NixOS (c3po)
        run: nix build .#nixosConfigurations.c3po.config.system.build.toplevel --dry-run

      - name: Evaluate Home Manager (vysakh@chopper)
        run: nix build .#homeConfigurations."vysakh@chopper".activationPackage --dry-run

  build-aarch64-linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate NixOS (kenobi)
        run: nix build .#nixosConfigurations.kenobi.config.system.build.toplevel --dry-run

  build-aarch64-darwin:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Evaluate macOS (darwin)
        run: nix build .#darwinConfigurations."Vysakhs-MacBook-Pro".system --dry-run

      - name: Evaluate Home Manager (darwin)
        run: nix build .#homeConfigurations."mathewalex@Vysakhs-MacBook-Pro".activationPackage --dry-run
