# CI: Build & Cache — the single build/cache gate for every host config.
#
# The host inventory is NOT hard-coded: a `plan` job evaluates the flake's
# `ciMatrix` output (auto-derived from hosts/*/metadata.nix +
# homeConfigurations), so new hosts are picked up with zero workflow edits.
# Every job checks out the one immutable SHA resolved by `plan` — a later
# branch update can never mix results across candidates.
#
# Modes:
#   full — native builds of every config + Attic push (with retries) +
#          fresh-store substitution verification. Runs on:
#            • pull_request from automation/flake-update (the weekly updater)
#            • a `/build` comment on any other PR (write-access users)
#            • workflow_dispatch
#   eval — `nix build --dry-run` only. Runs on ordinary pull_requests.
#
# Granularity: one job per target, not per architecture, so hosts build in
# parallel on isolated runners and can be re-run individually. workflow_dispatch
# takes an optional `host` input to build exactly one target; such a run
# deliberately does NOT publish the aggregate gate status.
#
# Cache-first: Attic is configured as a substituter BEFORE any build, so CI
# itself never recompiles what a previous run already pushed. Magic Nix
# Cache is intentionally absent (it conflicts with Attic and broke evals).
#
# The `all hosts built and cached` gate only exists in full mode, fails on
# any non-success (including skipped pushes), and posts a commit status on
# the exact tested SHA. Merging is manual — merge the flake-update PR when
# that status is green. While it is green, the weekly updater won't touch
# the candidate.
#
# Invariant: `develop` always contains a flake.lock that builds for every
# host AND is fully substitutable from the production cache set — no host
# should ever compile anything locally.
name: Build & Cache

on:
  pull_request:
    branches: [develop]
    paths:
      - "**.nix"
      - "flake.lock"
      - "overlays/**"
      - "modules/**"
      - "hosts/**"
      - "home/**"
      - "lib/**"
      - "packages/**"
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      host:
        description: >-
          Build a single target (e.g. skywalker, chopper, hm-mathewalex@...).
          Leave empty to build everything. Matched against the ciMatrix target
          names; an unknown name fails the plan job rather than silently
          building nothing.
        required: false
        type: string
        default: ""

concurrency:
  # One run per candidate; a new push to the same ref supersedes the old run.
  group: build-${{ github.event_name == 'issue_comment' && format('pr-{0}', github.event.issue.number) || github.ref }}-${{ inputs.host || 'all' }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

env:
  ATTIC_SERVER: https://cache.tellmey.fyi
  ATTIC_CACHE: system
  # Production substituter set (mirrors modules/binary-cache.nix, minus the
  # tailnet URL that runners can't reach). Used both for builds and for the
  # fresh-store verification that proves hosts will never compile.
  NIX_SUBSTITUTERS: >-
    https://cache.nixos.org
    https://cache.tellmey.fyi/system
    https://nix-community.cachix.org
  NIX_TRUSTED_KEYS: >-
    cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
    system:mvnfTi6w7gvX6oksJ4JhHLL4wVUa576bgtLJ6lh9C2Y=
    nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
  GATE_CONTEXT: all hosts built and cached

jobs:
  # ---------------------------------------------------------------------------
  # 1. Plan — resolve ONE immutable SHA, pick the mode, derive the matrix
  # ---------------------------------------------------------------------------
  plan:
    # For comments: only PR comments saying `/build` from users with write access.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/build') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      mode: ${{ steps.resolve.outputs.mode }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve tested SHA and mode
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            issue_comment)
              # Comment-triggered: resolve the PR's current head SHA once;
              # every later job uses exactly this commit.
              sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/${{ github.event.issue.number }}" --jq .head.sha)
              mode="full"
              ;;
            pull_request)
              sha="$PR_HEAD_SHA"
              if [[ "$PR_HEAD_REF" == "automation/flake-update" ]]; then
                mode="full"
              else
                mode="eval"
              fi
              ;;
            *)
              sha="${{ github.sha }}"
              mode="full"
              ;;
          esac
          echo "sha=$sha"   >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Testing $sha in $mode mode"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          flakehub: false

      - name: Derive build matrix from flake
        id: matrix
        env:
          HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          matrix=$(nix eval .#ciMatrix --json)

          # Cross-check: every declared configuration must appear in the
          # matrix. Skipped for a single-host run, which covers one by design.
          if [[ -z "$HOST" ]]; then
            declared=$( (nix eval .#nixosConfigurations --apply builtins.attrNames --json | jq -r '.[]';
                         nix eval .#darwinConfigurations --apply builtins.attrNames --json | jq -r '.[]') | sort)
            covered=$(echo "$matrix" | jq -r '.include[].targets[].name' | sort)
            missing=$(comm -23 <(echo "$declared") <(echo "$covered"))
            if [[ -n "$missing" ]]; then
              echo "::error::Configurations missing from CI matrix: $missing"
              exit 1
            fi
          fi

          # Flatten {system, runner, targets[]} into ONE MATRIX ENTRY PER
          # TARGET. Previously a single job built every target for an
          # architecture sequentially, so six x86_64 closures shared one
          # runner's ~14 GB of free disk and one host's failure discarded the
          # whole architecture's work. Per-target jobs build in parallel, get
          # an isolated disk budget (a CUDA closure is several GB on its own),
          # and can be re-run individually from the Actions UI.
          flat=$(jq -c '{include: [.include[] as $g | $g.targets[]
                   | {name: .name, attr: .attr, system: $g.system, runner: $g.runner}]}' <<<"$matrix")

          if [[ -n "$HOST" ]]; then
            flat=$(jq -c --arg h "$HOST" '{include: [.include[] | select(.name == $h)]}' <<<"$flat")
            if [[ $(jq '.include | length' <<<"$flat") -eq 0 ]]; then
              echo "::error::No CI target named '$HOST'. Available:"
              jq -r '.include[].targets[].name' <<<"$matrix" | sed 's/^/  - /'
              exit 1
            fi
            echo "Single-target run: $HOST"
          fi

          jq . <<<"$flat"
          [[ $(jq '.include | length' <<<"$flat") -gt 0 ]]
          echo "matrix=$flat" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2. Build (+ push + verify in full mode) — one job per TARGET
  # ---------------------------------------------------------------------------
  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache 2>/dev/null || true
          timeout 30 sudo docker image prune -af 2>/dev/null || true
          df -h / | tail -1

      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo rm -rf /Users/runner/Library/Android \
            /Applications/Xcode_*.app \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /Library/Frameworks/Mono.framework \
            /usr/local/share/dotnet 2>/dev/null || true
          df -h / | tail -1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}

      # Attic (and the rest of the production substituter set) is configured
      # BEFORE any build so previous CI pushes accelerate this run.
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          flakehub: false
          extra-conf: |
            substituters = ${{ env.NIX_SUBSTITUTERS }}
            trusted-public-keys = ${{ env.NIX_TRUSTED_KEYS }}
            fallback = true
            connect-timeout = 5

      - name: Build ${{ matrix.name }}
        env:
          ATTR: ${{ matrix.attr }}
          MODE: ${{ needs.plan.outputs.mode }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/roots.txt"
          if [[ "$MODE" == "eval" ]]; then
            nix build ".#$ATTR" --dry-run
          else
            nix build ".#$ATTR" --no-link --print-out-paths --print-build-logs \
              | tee -a "$RUNNER_TEMP/roots.txt"
          fi

      - name: Setup Attic
        if: needs.plan.outputs.mode == 'full'
        uses: ./.github/actions/attic-setup
        with:
          sops-age-key: ${{ secrets.SOPS_AGE_KEY }}

      - name: Push to Attic (${{ matrix.name }})
        if: needs.plan.outputs.mode == 'full'
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # Store paths never contain whitespace, so word-splitting is safe
          # (macOS runners ship bash 3.2 — no mapfile).
          roots=$(sort -u "$RUNNER_TEMP/roots.txt")
          [[ -n "$roots" ]] || { echo "::error::no build roots collected"; exit 1; }
          echo "Pushing to $ATTIC_CACHE:"; echo "$roots"
          ok=""
          for attempt in 1 2 3 4; do
            # shellcheck disable=SC2086 # store paths contain no whitespace
            if attic push -j 4 "$ATTIC_CACHE" $roots; then
              ok=1; break
            fi
            echo "::warning::attic push attempt $attempt failed; retrying"
            sleep $((attempt * 20))
          done
          # Never `|| true` — a failed push must fail the job and block merge.
          [[ -n "$ok" ]]

      # Prove the "never compile on a host again" promise: realize every root
      # into a fresh store from the production substituter set only, with
      # local builds disabled. If this passes, deployment hosts can too.
      - name: Verify substitutability (fresh store, no builds)
        if: needs.plan.outputs.mode == 'full'
        timeout-minutes: 60
        run: |
          set -euo pipefail
          roots=$(sort -u "$RUNNER_TEMP/roots.txt")
          [[ -n "$roots" ]] || { echo "::error::no build roots collected"; exit 1; }
          # Free the local store first — the roots are in Attic now, and the
          # fresh-store realization below re-downloads the closures. Without
          # this the runner would hold two copies of every closure.
          nix store gc --quiet || true
          df -h "$RUNNER_TEMP" | tail -1
          # shellcheck disable=SC2086 # store paths contain no whitespace
          nix build $roots \
            --no-link \
            --max-jobs 0 \
            --store "$RUNNER_TEMP/verify-store" \
            --substituters "$NIX_SUBSTITUTERS" \
            --trusted-public-keys "$NIX_TRUSTED_KEYS"
          echo "All roots substitutable from the production cache set."

  # ---------------------------------------------------------------------------
  # 3. Stable aggregate gate — the ONE check that means "safe to merge/deploy"
  # ---------------------------------------------------------------------------
  gate:
    name: all hosts built and cached
    needs: [plan, build]
    # Full mode only: eval-only runs must never produce this signal, so a
    # build-only run can never look mergeable.
    #
    # ALSO skipped for single-host runs (inputs.host set). A run that built
    # one target must never publish a green "all hosts built and cached"
    # status — that status is what the weekly flake updater's
    # freeze-when-green logic and the merge decision both read, so letting a
    # one-host run satisfy it would mark a SHA as fully verified on the
    # evidence of a single build.
    if: >-
      always() && needs.plan.result == 'success'
      && needs.plan.outputs.mode == 'full'
      && inputs.host == ''
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate results
        id: result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "build: $BUILD_RESULT"
          if [[ "$BUILD_RESULT" == "success" ]]; then
            echo "state=success" >> "$GITHUB_OUTPUT"
          else
            echo "state=failure" >> "$GITHUB_OUTPUT"
          fi

      # Commit status on the exact tested SHA. This is what shows up on the
      # PR for comment-triggered runs, and what the weekly updater's
      # freeze-when-green logic reads.
      - name: Publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          STATE: ${{ steps.result.outputs.state }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$STATE" \
            -f context="$GATE_CONTEXT" \
            -f description="Build & Cache: every host built, pushed to Attic, and verified substitutable" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Fail gate on any non-success
        if: steps.result.outputs.state != 'success'
        run: exit 1
