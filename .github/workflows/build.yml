# CI: Build Configurations — validate that all hosts build cleanly.
#
# On pull_request → develop:
#   Evaluate-only (--dry-run). Fast feedback on syntax errors, missing
#   attributes, and type mismatches. No secrets needed.
#
# On push → develop:
#   Real builds (no --dry-run). Verifies nothing is broken. Does NOT
#   push to binary cache — that's the flake-update workflow's job.
#
# Note: Most packages are substituted from cache.nixos.org. Only custom
# packages (overlays, nixvim config, etc.) are actually compiled here.
# GC between builds prevents disk exhaustion on runners.
name: Build Configurations

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-x86_64-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build NixOS (chopper)
        run: >
          nix build .#nixosConfigurations.chopper.config.system.build.toplevel
          --print-build-logs
          ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}

      - name: GC between builds
        if: github.event_name == 'push'
        run: nix-collect-garbage >/dev/null 2>&1

      - name: Build NixOS (c3po)
        run: >
          nix build .#nixosConfigurations.c3po.config.system.build.toplevel
          --print-build-logs
          ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}

      - name: GC between builds
        if: github.event_name == 'push'
        run: nix-collect-garbage >/dev/null 2>&1

      - name: Build Home Manager (vysakh@chopper)
        run: >
          nix build .#homeConfigurations."vysakh@chopper".activationPackage
          --print-build-logs
          ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}

  build-aarch64-linux:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/share/swift /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/hostedtoolcache 2>/dev/null || true
          sudo docker image prune -af 2>/dev/null || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build NixOS (kenobi)
        run: >
          nix build .#nixosConfigurations.kenobi.config.system.build.toplevel
          --print-build-logs
          ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}

  build-aarch64-darwin:
    runs-on: macos-14
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /Users/runner/Library/Android \
            /Applications/Xcode_*.app \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /Library/Frameworks/Mono.framework \
            /usr/local/share/dotnet 2>/dev/null || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          flakehub: false
      # magic-nix-cache skipped on macOS — dyld symbol incompatibility

      - name: Build macOS (darwin)
        run: >
          nix build .#darwinConfigurations."Vysakhs-MacBook-Pro".system
          --print-build-logs
          ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}

      - name: GC between builds
        if: github.event_name == 'push'
        run: nix-collect-garbage >/dev/null 2>&1

      - name: Build Home Manager (darwin)
        run: >
          nix build .#homeConfigurations."mathewalex@Vysakhs-MacBook-Pro".activationPackage
          --print-build-logs
          ${{ github.event_name == 'pull_request' && '--dry-run' || '' }}
