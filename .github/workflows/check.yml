# CI: Nix Flake Check — lint, dead-code, and format validation.
# Only runs when Nix-related files change. Lightweight (no builds).
name: Nix Flake Check

on:
  push:
    branches: [develop]
    paths:
      - "**.nix"
      - "flake.lock"
      - "overlays/**"
      - "modules/**"
      - "hosts/**"
      - "home/**"
      - "lib/**"
      - "packages/**"
  pull_request:
    branches: [develop]
    paths:
      - "**.nix"
      - "flake.lock"
      - "overlays/**"
      - "modules/**"
      - "hosts/**"
      - "home/**"
      - "lib/**"
      - "packages/**"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Nix flake check
        run: nix flake check --no-build

      - name: Statix lint
        run: nix run nixpkgs#statix -- check . --config .statix.toml

      - name: Deadnix check
        run: nix run nixpkgs#deadnix -- --fail .

      - name: Format check (nixpkgs-fmt)
        run: |
          nix fmt
          git diff --exit-code || (echo '::error::Files need formatting. Run `nix fmt` locally and commit.' && exit 1)
