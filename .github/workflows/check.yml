# CI: Nix lint, dead-code, and format validation.
# Only runs when Nix-related files change. Lightweight (no builds).
name: Nix Lint & Format

on:
  push:
    branches: [develop]
    paths:
      - "**.nix"
      - "flake.lock"
      - "overlays/**"
      - "modules/**"
      - "hosts/**"
      - "home/**"
      - "lib/**"
      - "packages/**"
  pull_request:
    branches: [develop]
    paths:
      - "**.nix"
      - "flake.lock"
      - "overlays/**"
      - "modules/**"
      - "hosts/**"
      - "home/**"
      - "lib/**"
      - "packages/**"

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Magic Nix Cache: it conflicts with our Attic substituter setup and
      # has broken evaluation before (FlakeHub auth + invalid store paths).
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          flakehub: false
          extra-conf: |
            extra-substituters = https://cache.tellmey.fyi/system
            extra-trusted-public-keys = system:mvnfTi6w7gvX6oksJ4JhHLL4wVUa576bgtLJ6lh9C2Y=
            fallback = true
            connect-timeout = 5

      - name: Statix lint
        run: nix run --inputs-from . nixpkgs#statix -- check . --config .statix.toml

      - name: Deadnix check
        run: nix run --inputs-from . nixpkgs#deadnix -- --fail .

      - name: Format check (nixpkgs-fmt)
        run: |
          nix fmt
          # shellcheck disable=SC2016 # backticks are literal markdown
          git diff --exit-code || (echo '::error::Files need formatting. Run `nix fmt` locally and commit.' && exit 1)
