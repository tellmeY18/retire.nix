name: Release Wiki Access Extension

# Triggered by: git tag extension/v1.0.0  (or any extension/v* tag)
# Produces:
#   - fosscell-wiki-access-<version>.zip   → Chrome / Edge / Brave (load unpacked)
#   - fosscell-wiki-access-<version>.xpi   → Firefox (Mozilla-signed, permanent install)
# Both files are attached to a GitHub Release.
#
# Secrets: credentials live in secrets/ci/actions.yaml (sops-encrypted).
# The only GitHub Actions secret needed is SOPS_AGE_KEY (the CI age private key).

on:
  push:
    tags:
      - "extension/v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & release extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install sops + web-ext
        run: |
          # sops
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.9.4/sops-v3.9.4.linux.amd64 \
            -o /usr/local/bin/sops && chmod +x /usr/local/bin/sops
          # web-ext
          npm install --global web-ext

      - name: Decrypt CI secrets
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          # Decrypt secrets/ci/actions.yaml and export AMO creds as env vars.
          # Uses process substitution so the plaintext never touches the filesystem.
          AMO_ISSUER=$(sops --decrypt --extract '["amo_jwt_issuer"]' secrets/ci/actions.yaml)
          AMO_SECRET=$(sops --decrypt --extract '["amo_jwt_secret"]' secrets/ci/actions.yaml)
          echo "::add-mask::${AMO_ISSUER}"
          echo "::add-mask::${AMO_SECRET}"
          echo "AMO_JWT_ISSUER=${AMO_ISSUER}" >> "$GITHUB_ENV"
          echo "AMO_JWT_SECRET=${AMO_SECRET}" >> "$GITHUB_ENV"

      - name: Extract version from tag
        id: ver
        run: |
          RAW="${GITHUB_REF_NAME}"      # e.g. extension/v1.2.3
          VER="${RAW#extension/v}"      # → 1.2.3
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into manifest
        run: |
          cd k8s/apps/wiki-access-extension
          jq --arg v "${{ steps.ver.outputs.version }}" \
            '.version = $v' manifest.json > manifest.tmp.json
          mv manifest.tmp.json manifest.json

      - name: Build Chrome/Edge/Brave zip
        run: |
          cd k8s/apps/wiki-access-extension
          # -j strips directory paths so manifest.json is at the zip root
          zip -j \
            "${GITHUB_WORKSPACE}/fosscell-wiki-access-${{ steps.ver.outputs.version }}.zip" \
            manifest.json background.js popup.html popup.js
          echo "Built: fosscell-wiki-access-${{ steps.ver.outputs.version }}.zip"

      - name: Sign Firefox XPI (Mozilla AMO — unlisted / self-distributed)
        id: sign
        run: |
          cd k8s/apps/wiki-access-extension
          web-ext sign \
            --channel=unlisted \
            --api-key="${AMO_JWT_ISSUER}" \
            --api-secret="${AMO_JWT_SECRET}" \
            --artifacts-dir=./signed
          mv signed/*.xpi \
            "${GITHUB_WORKSPACE}/fosscell-wiki-access-${{ steps.ver.outputs.version }}.xpi"
          echo "Signed: fosscell-wiki-access-${{ steps.ver.outputs.version }}.xpi"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FOSS Cell Wiki Access v${{ steps.ver.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## FOSS Cell Wiki Access v${{ steps.ver.outputs.version }}

            Install this extension to get **instant, challenge-free access** to
            [wiki.fosscell.org](https://wiki.fosscell.org) — no proof-of-work puzzle,
            no waiting.

            ---

            ### Install

            | Browser | Download | Steps |
            |---|---|---|
            | **Firefox** (desktop + Android) | `fosscell-wiki-access-${{ steps.ver.outputs.version }}.xpi` | Download → open/drag onto Firefox → click **Add** |
            | **Chrome / Edge / Brave** | `fosscell-wiki-access-${{ steps.ver.outputs.version }}.zip` | Extract → `chrome://extensions` → Developer mode → **Load unpacked** |
            | **Kiwi Browser (Android)** | same `.zip` | `kiwi://extensions` → **+ (from file)** |

            Full installation guide: [docs/wiki-access-extension.md](https://github.com/${{ github.repository }}/blob/develop/docs/wiki-access-extension.md)
          files: |
            fosscell-wiki-access-${{ steps.ver.outputs.version }}.zip
            fosscell-wiki-access-${{ steps.ver.outputs.version }}.xpi
          draft: false
          prerelease: false
