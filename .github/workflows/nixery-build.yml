# CI: Build Nixery image via Nix (multi-arch, native runners)
#
# Uses nix-build to produce a container tarball from upstream tazjin/nixery,
# then loads and pushes to GHCR. No Dockerfile needed — the image is built
# reproducibly via dockerTools.buildLayeredImage.
name: Build Nixery Image

on:
  workflow_dispatch:
    inputs:
      nixery-ref:
        description: "Git ref for tazjin/nixery (branch, tag, or SHA)"
        type: string
        required: false
        default: "master"
  push:
    branches: [develop]
    paths:
      - "k8s/images/nixery/**"
      - ".github/workflows/nixery-build.yml"

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: tellmey18/nixery
  NIXERY_REF: ${{ inputs.nixery-ref || 'master' }}

jobs:
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout upstream nixery
        uses: actions/checkout@v4
        with:
          repository: tazjin/nixery
          ref: ${{ env.NIXERY_REF }}
          path: k8s/images/nixery/nixery-src

      - uses: DeterminateSystems/nix-installer-action@v16

      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build nixery-image via Nix
        run: |
          export NIX_PATH="nixpkgs=https://github.com/NixOS/nixpkgs/archive/nixpkgs-unstable.tar.gz"
          nix-build k8s/images/nixery/image.nix \
            --option sandbox false \
            --max-jobs 2
          ls -lh result

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        run: |
          BUILD_TAG="build-${{ github.run_number }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          echo "build_tag=${BUILD_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Load, tag, and push
        run: |
          TARBALL="$(readlink -f result)"
          LOADED="$(docker load -i "${TARBALL}" | sed -n 's/^Loaded image: //p')"
          test -n "${LOADED}"

          DEST="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.build_tag }}-${{ matrix.platform }}"
          docker tag "${LOADED}" "${DEST}"
          docker push "${DEST}"

  manifest:
    needs: nix-build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          BUILD_TAG="build-${{ github.run_number }}"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          docker buildx imagetools create \
            -t "${IMAGE}:${BUILD_TAG}" \
            -t "${IMAGE}:${SHA_TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${BUILD_TAG}-amd64" \
            "${IMAGE}:${BUILD_TAG}-arm64"

          echo "## 🎉 Nixery Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`latest\` | \`${IMAGE}:latest\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${BUILD_TAG}\` | \`${IMAGE}:${BUILD_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${SHA_TAG}\` | \`${IMAGE}:${SHA_TAG}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Update deployment: \`image: ${IMAGE}:${BUILD_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
