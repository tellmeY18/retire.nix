---
# values.yaml — Traefik Helm chart values for glug-infra (chart v40.x).
#
# Traefik runs on compute nodes with hostNetwork to bind directly
# to the node's public IP (68.233.115.209) on ports 80 and 443.
# TLS is handled via Let's Encrypt (Traefik's built-in ACME).

# Run on compute nodes only — these have public IPs.
nodeSelector:
  node-role.glug.infra/compute: "true"

# Bind directly to the node's network stack (no kube-proxy hop).
hostNetwork: true

# With hostNetwork, the default dnsPolicy (ClusterFirst) inherits the node's
# /etc/resolv.conf, which doesn't include kube-dns. This prevents Traefik from
# resolving cluster-internal service names — including the Turnstile CAPTCHA
# gate's ForwardAuth address. ClusterFirstWithHostNet adds kube-dns to the
# search path so service names like `turnstile.traefik-system.svc` resolve.

ports:
  traefik:
    port: 8080
    hostPort: null
  web:
    port: 80
    hostPort: null
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 443
    hostPort: null
    exposedPort: 443
    protocol: TCP
  metrics:
    port: 9180
    hostPort: null

# hostNetwork binds host ports 80/443/8080, so two Traefik pods can never
# coexist on the same node. A rolling update (chart default: maxSurge=1,
# maxUnavailable=0) therefore deadlocks — the surge pod can't bind the ports
# the old pod still holds ("didn't have free ports"). Recreate the pod instead:
# terminate the old one first, then start the new one.
updateStrategy:
  type: Recreate
  rollingUpdate: null

# Health probes. Traefik shares this node with MediaWiki, which gets hammered
# by distributed scraper floods. Under CPU contention the default probes
# (timeoutSeconds=2, liveness failureThreshold=3) time out and kubelet KILLS a
# busy-but-healthy proxy, taking down ALL public ingress and triggering a
# crash loop. Keep readiness responsive but tolerant, and make liveness very
# reluctant to restart — a slow reverse proxy should be shed load, not killed.
readinessProbe:
  failureThreshold: 3
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5
livenessProbe:
  failureThreshold: 10
  initialDelaySeconds: 5
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5

# Single replica — one compute node.
deployment:
  replicas: 1
  # hostNetwork pods inherit the node's DNS by default, which can't resolve
  # cluster-internal service names (Turnstile ForwardAuth, etc.).
  # ClusterFirstWithHostNet adds kube-dns to the search path.
  dnsPolicy: ClusterFirstWithHostNet
  # hostPath volume for ACME cert persistence (compute nodes have no PVC StorageClass).
  additionalVolumes:
    - name: acme-storage
      hostPath:
        path: /var/lib/traefik
        type: DirectoryOrCreate
    # Access logs written to the host so CrowdSec (NixOS service on kenobi)
    # can tail them — see hosts/kenobi/parts/crowdsec.nix.
    - name: access-logs
      hostPath:
        path: /var/log/traefik
        type: DirectoryOrCreate

# hostNetwork provides the real ingress path (node's public IP :80/:443).
# The chart's default Service type LoadBalancer sits <pending> forever
# (servicelb is disabled cluster-wide), which made every `helm upgrade --wait`
# time out after 600s and marked releases failed. ClusterIP keeps in-cluster
# routing working and lets --wait succeed.
service:
  type: ClusterIP

# Increase entrypoint read timeouts for large Attic uploads (initrd etc.).
# Default is 60s in Traefik v3 — Attic push of large closures can exceed this.
additionalArguments:
  - "--certificatesresolvers.letsencrypt.acme.email=vysakhpr218@gmail.com"
  - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
  - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
  - "--entryPoints.web.transport.respondingTimeouts.readTimeout=600s"
  - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=600s"

# Mount the hostPath volume for ACME state.
additionalVolumeMounts:
  - name: acme-storage
    mountPath: /acme
  - name: access-logs
    mountPath: /var/log/traefik

# No PVC persistence — using hostPath above instead.
persistence:
  enabled: false

# Dashboard — not exposed publicly.
ingressRoute:
  dashboard:
    enabled: false

# Logs
logs:
  general:
    level: INFO
  access:
    enabled: true
    # JSON to a hostPath file — parsed by CrowdSec on the node
    # (crowdsecurity/traefik expects Traefik's JSON access-log format).
    # Container stdout no longer carries access logs; use this file instead.
    format: json
    filePath: /var/log/traefik/access.log
    # Buffered writes so logging doesn't add per-request fsync latency.
    bufferingSize: 100
    fields:
      headers:
        # Headers are dropped by default; CrowdSec's user-agent scenarios
        # need the UA. Keep only that — no cookies/auth headers on disk.
        names:
          User-Agent: keep

# Resources.
# A real CPU *request* (not a limit) gives Traefik a guaranteed cgroup CPU
# share so it wins contention against the co-located MediaWiki/scraper load
# and can always answer /ping. Deliberately NO CPU limit: a CPU limit causes
# CFS throttling that stalls the event loop and makes health probes time out
# under exactly the load we need Traefik to survive. Memory stays capped.
# 300m (not more) because kenobi only has 2 cores and ~350m of unreserved
# request headroom once the databases/apps are scheduled; a larger request
# leaves the pod Pending (Insufficient cpu).
resources:
  requests:
    cpu: 300m
    memory: 128Mi
  limits:
    memory: 512Mi

# Run as root — required for binding to ports 80/443 and writing hostPath.
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  capabilities:
    add:
      - NET_BIND_SERVICE
    drop:
      - ALL

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

# Providers — watch Kubernetes IngressRoute CRDs.
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
