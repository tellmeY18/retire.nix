---
# values.yaml — Traefik Helm chart values for glug-infra (chart v40.x).
#
# Traefik runs on compute nodes with hostNetwork to bind directly
# to the node's public IP (68.233.115.209) on ports 80 and 443.
# TLS is handled via Let's Encrypt (Traefik's built-in ACME).

# Run on compute nodes only — these have public IPs.
nodeSelector:
  node-role.glug.infra/compute: "true"

# Bind directly to the node's network stack (no kube-proxy hop).
hostNetwork: true

ports:
  traefik:
    port: 8080
    hostPort: null
  web:
    port: 80
    hostPort: null
    exposedPort: 80
    protocol: TCP
  websecure:
    port: 443
    hostPort: null
    exposedPort: 443
    protocol: TCP
  metrics:
    port: 9180
    hostPort: null

# Single replica — one compute node.
deployment:
  replicas: 1
  # hostPath volume for ACME cert persistence (compute nodes have no PVC StorageClass).
  additionalVolumes:
    - name: acme-storage
      hostPath:
        path: /var/lib/traefik
        type: DirectoryOrCreate

# Increase entrypoint read timeouts for large Attic uploads (initrd etc.).
# Default is 60s in Traefik v3 — Attic push of large closures can exceed this.
additionalArguments:
  - "--certificatesresolvers.letsencrypt.acme.email=vysakhpr218@gmail.com"
  - "--certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json"
  - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
  - "--entryPoints.web.transport.respondingTimeouts.readTimeout=600s"
  - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=600s"

# Mount the hostPath volume for ACME state.
additionalVolumeMounts:
  - name: acme-storage
    mountPath: /acme

# No PVC persistence — using hostPath above instead.
persistence:
  enabled: false

# Dashboard — not exposed publicly.
ingressRoute:
  dashboard:
    enabled: false

# Logs
logs:
  general:
    level: INFO
  access:
    enabled: true

# Resources
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 256Mi

# Run as root — required for binding to ports 80/443 and writing hostPath.
securityContext:
  runAsUser: 0
  runAsGroup: 0
  runAsNonRoot: false
  capabilities:
    add:
      - NET_BIND_SERVICE
    drop:
      - ALL

podSecurityContext:
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0

# Providers — watch Kubernetes IngressRoute CRDs.
providers:
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
