# values.yaml — Plain Helm values for the cloudnative-pg operator chart 0.28.x.
#
# Encrypted / secret values belong in secrets.yaml (sops-encrypted, referenced
# from helmfile.yaml via the `secrets://` prefix).
#
# Reference for all available keys:
#   helm show values cnpg/cloudnative-pg --version 0.28.0
#
# When bumping the chart, diff this file against the upstream defaults to
# catch newly-added important keys:
#   helm show values cnpg/cloudnative-pg --version <new> > /tmp/upstream.yaml
#   diff <(helm show values cnpg/cloudnative-pg --version 0.28.0) /tmp/upstream.yaml

# ---------------------------------------------------------------------------
# Operator pod sizing — chopper is an old laptop, keep it light.
# ---------------------------------------------------------------------------
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# ---------------------------------------------------------------------------
# Replication — single operator replica is fine for a single-node cluster.
# Scale to 2 when you have ≥2 schedulable nodes; the operator does
# leader-election out of the box.
# ---------------------------------------------------------------------------
replicaCount: 1

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Operator log level: "error" | "warning" | "info" | "debug" | "trace"
logLevel: "info"

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------
# PodMonitor creation is DISABLED because we use native VictoriaMetrics CRDs
# (VMPodScrape) instead of Prometheus CRDs. The equivalent VMPodScrape for
# the operator is defined in:
#   k8s/clusters/glug-infra/monitoring/cnpg-operator-vmpodscrape.yaml
#
# Grafana dashboard ConfigMap creation is still enabled — the sidecar
# auto-discovers ConfigMaps with the `grafana_dashboard` label regardless
# of whether the monitoring backend is Prometheus or VictoriaMetrics.
monitoring:
  podMonitorEnabled: false
  grafanaDashboard:
    create: true

# ---------------------------------------------------------------------------
# CRDs — install and upgrade them as managed chart resources.
# ---------------------------------------------------------------------------
# This makes `helmfile sync` upgrade CRDs in lock-step with the operator
# Deployment, rather than relying on Helm's one-shot --install-crds hook
# (which runs only on first install and then never again).
crds:
  create: true

# ---------------------------------------------------------------------------
# Image pull policy
# ---------------------------------------------------------------------------
# `IfNotPresent` is correct for tagged operator releases; only switch to
# `Always` if you ever pin to `:main` or `:latest`, which we don't.
image:
  pullPolicy: IfNotPresent

# ---------------------------------------------------------------------------
# Webhook configuration
# ---------------------------------------------------------------------------
# CNPG ships a validating + mutating webhook. The chart provisions the cert
# automatically using its own CA; do not disable unless you front the
# webhook with cert-manager (in which case use the chart's `certManager`
# values block).
webhook:
  enabled: true
