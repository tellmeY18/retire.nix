# values.yaml — RustFS configuration notes (documentation only).
#
# RustFS is NO LONGER operator-managed. It runs as a plain standalone
# StatefulSet (one pod, one ZFS-backed PVC, no erasure coding). There is no
# Helm chart and no Tenant CRD.
#
# The actual manifests live in k8s/clusters/glug-infra/rustfs/ and are applied
# by kustomize (`kubectl apply -k clusters/glug-infra/rustfs`):
#   - statefulset.yaml   — the single standalone RustFS pod (RUSTFS_VOLUMES=/data)
#   - service.yaml        — rustfs-hl (headless) + rustfs-storage-io (stable S3 endpoint)
#   - namespace.yaml, networkpolicy.yaml, tailscale-s3-service.yaml, tailscale-s3-funnel.yaml
#
# Why standalone (not the operator / erasure coding):
#   The operator only builds erasure-coded sets (it rejects <4 drives). On a
#   single laptop NVMe, EC across 4 local "drives" is not redundancy (one disk
#   = one failure domain) — it only adds write amplification and a cross-node
#   quorum gate that crashlooped when nodes flapped. A single drive is simpler
#   and strictly more reliable here.
#
# Durability lives underneath/around RustFS, not inside it:
#   - ZFS: checksums, copy-on-write, snapshots on chopper's pool.
#   - off-site backup (to be added) for true DR.
#
# Stable in-cluster endpoint (unchanged for apps):
#   http://rustfs-storage-io.rustfs-clusters.svc:9000
#
# Root credentials: the `rustfs-credentials` Secret (sops:
#   k8s/clusters/glug-infra/rustfs/credentials-secret.enc.yaml).
