# secrets.yaml — sops-encrypted values for RustFS tenant.
#
# Contains the S3 admin credentials for the RustFS cluster.
# Edit with: just k8s::edit-secret apps/rustfs/secrets.yaml
#
# Required keys (after decryption):
#   accessKey: <at least 8 characters>
#   secretKey: <at least 8 characters>
#
# These are injected into the rustfs-credentials Secret by kustomize.
# Generate strong credentials:
#   openssl rand -hex 16   # for accessKey
#   openssl rand -hex 32   # for secretKey
accessKey: ""
secretKey: ""
