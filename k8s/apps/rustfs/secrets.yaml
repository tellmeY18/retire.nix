# secrets.yaml — Placeholder for RustFS Helm chart secret values.
#
# ⚠️  THIS FILE IS NOT CONSUMED BY HELMFILE.
#
# The RustFS Tenant is deployed via kustomize (not a Helm chart), so this
# file exists only for structural consistency with other apps/ directories.
#
# The ACTUAL credentials Secret lives at:
#   k8s/clusters/glug-infra/rustfs/credentials-secret.enc.yaml
#
# Apply it with:
#   just k8s::rustfs-apply-secret
#
# Key names use lowercase to match the operator's expected Secret format:
#   stringData.accesskey  — RustFS root access key
#   stringData.secretkey  — RustFS root secret key
#
# If the rustfs-operator ever publishes a tenant Helm chart, move the real
# credentials here and reference this file from helmfile.yaml as a `secrets:`
# entry.  Until then, this is a no-op placeholder.
{}
