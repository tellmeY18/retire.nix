# values.yaml — Plain Helm values for the Percona pxc-operator chart 1.19.x.
#
# Encrypted / secret values belong in secrets.yaml (sops-encrypted, referenced
# from helmfile.yaml via the `secrets://` prefix).
#
# Reference for all available keys:
#   helm show values percona/pxc-operator --version 1.19.1

# Operator pod sizing — chopper is an old laptop, keep it light.
resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "256Mi"

# Single operator replica is fine for a single-node cluster.
replicaCount: 1

# Log level: "ERROR" | "INFO" | "DEBUG"
logLevel: "INFO"

# CRDs — install and upgrade them as managed chart resources.
crd:
  create: true

# Image pull policy
imagePullPolicy: IfNotPresent

# Watch all namespaces for PerconaXtraDBCluster CRs.
watchAllNamespaces: true

# Disable telemetry
disableTelemetry: true
