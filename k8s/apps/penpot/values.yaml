---
# values.yaml — Penpot Helm chart (penpot/penpot 0.43.0, app 2.15).
#
# Penpot is an open-source design and prototyping platform.
# https://help.penpot.app/technical-guide/getting-started/kubernetes/
#
# This deployment integrates with the existing glug-infra cluster:
#   DB:      CNPG PostgreSQL pooler (postgres-pooler-rw.cnpg-clusters)
#   Cache:   Standalone Valkey deployed by kustomize (valkey.penpot.svc)
#   Storage: RustFS S3 bucket 'penpot' (rustfs-storage-io.rustfs-clusters)
#   Ingress: Traefik IngressRoute + Tailscale Funnel (both via kustomize)
#
# Prerequisites (one-time setup before first deploy):
#   1. Create the Postgres database:
#        just k8s::create-db penpot
#   2. Create the S3 bucket + user:
#        just k8s::create-bucket penpot
#   3. Fill in secrets.yaml (plaintext), then encrypt it:
#        just k8s::encrypt-secret apps/penpot/secrets.yaml
#   4. Apply kustomize resources (namespace, valkey, networkpolicies, ingress):
#        kubectl apply -k clusters/glug-infra/penpot
#   5. Install the Helm chart:
#        helmfile sync  (or: just k8s::apply)
#
# Version policy: chart 0.43.0 ↔ app 2.15. Bump deliberately; check
#   https://github.com/penpot/penpot-helm/blob/main/charts/penpot/CHANGELOG.md
#   before upgrading.

# ---------------------------------------------------------------------------
# Disable bundled sub-charts — we supply our own external DB + Valkey.
# ---------------------------------------------------------------------------
global:
  postgresqlEnabled: false
  valkeyEnabled: false
  redisEnabled: false

config:
  # ⚠️  REQUIRED: set this to your actual tailnet URL before the first deploy.
  # Penpot stores it in the database — changing it afterwards requires a DB
  # migration. Replace <tailnet> with your actual tailnet domain (e.g.
  # tail477f2f.ts.net). The hostname 'penpot' comes from the tls.hosts entry
  # in clusters/glug-infra/penpot/tailscale-service.yaml.
  publicUri: "https://pot.tellmey.fyi"

  # Feature flags. Full list: https://help.penpot.app/technical-guide/configuration/
  #   disable-email-verification  — skip email confirm (no SMTP required)
  #   disable-telemetry           — no anonymous stats sent to Penpot servers
  #   enable-smtp                 — add this (+ smtp config below) when ready
  flags: "enable-login-with-password disable-email-verification disable-telemetry enable-mcp"

  # apiSecretKey is supplied by secrets.yaml (never commit plaintext).
  # Generate: python3 -c "import secrets; print(secrets.token_urlsafe(64))"

  # ---------------------------------------------------------------------------
  # PostgreSQL — CNPG PgBouncer pooler (transaction mode).
  # The pooler Service always points at the current CNPG primary, so this
  # address is stable across primary failovers.
  # Prerequisite: run `just k8s::create-db penpot` once.
  # ---------------------------------------------------------------------------
  postgresql:
    host: "postgres-cluster-pooler-rw.cnpg-clusters.svc.cluster.local"
    port: 5432
    database: "penpot"
    # username + password supplied by secrets.yaml

  # ---------------------------------------------------------------------------
  # Redis / Valkey — standalone Valkey deployed by kustomize in this namespace.
  # Used for WebSocket pub/sub and session state — no persistence needed.
  # ---------------------------------------------------------------------------
  redis:
    host: "valkey.penpot.svc.cluster.local"
    port: 6379
    database: "0"

  # ---------------------------------------------------------------------------
  # Object storage — RustFS S3 (existing cluster-wide store).
  # Bucket 'penpot' must exist: `just k8s::create-bucket penpot`
  # Access key + secret key supplied by secrets.yaml.
  # ---------------------------------------------------------------------------
  objectsStorage:
    storageBackend: "s3"
    s3:
      region: "us-east-1" # RustFS ignores region; required by the chart
      bucket: "penpot"
      endpointURI: "http://rustfs-storage-io.rustfs-clusters.svc:9000"

  smtp:
    # SMTP is disabled by default. To enable:
    #   1. Add 'enable-smtp' to flags above.
    #   2. Set enabled: true and fill in host/port/credentials (in secrets.yaml).
    enabled: false

  telemetryEnabled: false

# ---------------------------------------------------------------------------
# Backend — Clojure API server.
# replicaCount MUST stay at 1 if enable-mcp flag is used (not HA-safe).
# ---------------------------------------------------------------------------
backend:
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
  nodeSelector:
    node-role.glug.infra/compute: "true"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1.5Gi

# ---------------------------------------------------------------------------
# Frontend — nginx serving static files + reverse proxy to backend.
# Pin to kenobi (compute node) for more available CPU/RAM.
# ---------------------------------------------------------------------------
frontend:
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
  nodeSelector:
    node-role.glug.infra/compute: "true"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "500m"
      memory: 256Mi

# ---------------------------------------------------------------------------
# Exporter — headless Chromium for PDF/PNG export.
# Memory-hungry: Chromium needs a generous limit.
# replicaCount MUST stay at 1 if enable-mcp flag is used.
# ---------------------------------------------------------------------------
exporter:
  replicaCount: 1
  updateStrategy:
    type: RollingUpdate
  nodeSelector:
    node-role.glug.infra/compute: "true"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 1.5Gi

# ---------------------------------------------------------------------------
# Persistence — disabled (assets stored in RustFS S3, not PVC).
# To switch back to PVC: set enabled: true and storageClass: zfs-localpv.
# ---------------------------------------------------------------------------
persistence:
  assets:
    enabled: false

# ---------------------------------------------------------------------------
# Ingress — disabled in chart; managed by kustomize instead.
# See clusters/glug-infra/penpot/tailscale-service.yaml (Tailscale Ingress,
# tailnet-only HTTPS, no public internet exposure).
# ---------------------------------------------------------------------------
ingress:
  enabled: false
