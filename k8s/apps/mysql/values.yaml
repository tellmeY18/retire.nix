# values.yaml — Plain Helm values for the percona/pxc-db chart 1.19.x.
#
# Renders a PerconaXtraDBCluster CR + HAProxy + scheduled backups from a
# single source of truth. This file is the place to tune every knob that
# does NOT contain secrets. Credentials (S3 access keys, root password)
# live in `secrets.yaml` (sops-encrypted) and are merged in by helmfile
# via the `secrets://` prefix.
#
# Reference for all available keys:
#   helm show values percona/pxc-db --version 1.19.2
#
# Naming policy:
#   The Helm release is `mysql` (defined in helmfile.yaml). The chart
#   names every object after the release: `PerconaXtraDBCluster/mysql`,
#   `Service/mysql-haproxy`, etc. Nothing here is host-specific.

# ---------------------------------------------------------------------------
# Unsafe flags — required for single-node phase 1.
# The operator refuses PXC size < 3 and HAProxy size < 2 by default.
# These granular flags override those specific checks.
# ---------------------------------------------------------------------------
unsafeFlags:
  pxcSize: true
  proxySize: true

# ---------------------------------------------------------------------------
# Finalizers — ensure clean teardown of PVCs and backups on cluster deletion.
# ---------------------------------------------------------------------------
finalizers:
  - percona.com/delete-pxc-pods-in-order

# ---------------------------------------------------------------------------
# PXC (Percona XtraDB Cluster) nodes
# ---------------------------------------------------------------------------
pxc:
  # Single instance for Phase 1 (single k3s node). Galera with size > 1 on
  # a single node causes crash-recovery failures: pods that can never
  # schedule confuse the quorum logic, and "full cluster crash" recovery
  # stalls indefinitely.
  #
  # When a second schedulable node joins, bump to size: 3.
  size: 1

  # Auto-recovery: if the single PXC pod crashes or the node reboots,
  # the operator will automatically bootstrap Galera from the latest state.
  autoRecovery: true

  image:
    repository: percona/percona-xtradb-cluster
    tag: "8.0.45-36.1"

  imagePullPolicy: IfNotPresent

  # -------------------------------------------------------------------------
  # Storage — OpenEBS ZFS LocalPV with 16K recordsize for InnoDB.
  #
  # The StorageClass `zfs-localpv-16k` is created cluster-wide by the
  # NixOS-bootstrapped manifest in modules/services/k3s.nix. It uses
  # recordsize=16k to match InnoDB's 16KB page size (vs 8k for PostgreSQL).
  # -------------------------------------------------------------------------
  persistence:
    enabled: true
    storageClass: zfs-localpv-16k
    size: 20Gi

  # -------------------------------------------------------------------------
  # MySQL / InnoDB configuration — tuned for ZFS on NVMe laptop hardware.
  # -------------------------------------------------------------------------
  configuration: |
    [mysqld]
    # === InnoDB + ZFS optimisations ===
    # ZFS is copy-on-write: doublewrite is redundant and wastes IOPS.
    innodb_doublewrite=0
    # Bypass the filesystem page cache; let ZFS ARC handle caching.
    innodb_flush_method=O_DIRECT
    # NVMe does not benefit from flushing neighbouring pages.
    innodb_flush_neighbors=0
    # NVMe IOPs budget — conservative for an old laptop.
    innodb_io_capacity=2000
    innodb_io_capacity_max=4000

    # === Memory (laptop-class hardware) ===
    innodb_buffer_pool_size=256M
    innodb_log_file_size=64M

    # === Logging ===
    slow_query_log=ON
    long_query_time=1
    log_slow_admin_statements=ON

    # === Character set ===
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci

    # === Connection limits ===
    max_connections=200

  # -------------------------------------------------------------------------
  # Resources — conservative for laptop hardware.
  # -------------------------------------------------------------------------
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"

  # -------------------------------------------------------------------------
  # Pod scheduling — preferred anti-affinity (phase 1 single node).
  # -------------------------------------------------------------------------
  affinity:
    antiAffinityTopologyKey: "kubernetes.io/hostname"

  podDisruptionBudget:
    maxUnavailable: 1

  # Graceful shutdown timeout (seconds).
  gracePeriod: 600

  # -------------------------------------------------------------------------
  # Metrics — mysqld_exporter sidecar for Prometheus scraping.
  # -------------------------------------------------------------------------
  # The operator creates a `monitor` user in the mysql-pxc-db-secrets Secret.
  # The sidecar reads the password via an env var, connects to MySQL on
  # localhost:3306, and exposes /metrics on port 9104.
  sidecars:
    - name: mysqld-exporter
      image: prom/mysqld-exporter:v0.16.0
      ports:
        - name: metrics
          containerPort: 9104
      env:
        - name: MONITOR_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pxc-db-secrets
              key: monitor
        - name: MYSQLD_EXPORTER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-pxc-db-secrets
              key: monitor
      args:
        - "--mysqld.address=localhost:3306"
        - "--mysqld.username=monitor"
        - "--web.listen-address=:9104"
        - "--collect.info_schema.innodb_metrics"
        - "--collect.info_schema.processlist"
        - "--collect.slave_status"
        - "--collect.global_status"
        - "--collect.global_variables"
        - "--collect.engine_innodb_status"
      resources:
        requests:
          cpu: "10m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "128Mi"

# ---------------------------------------------------------------------------
# HAProxy — connection router sitting in front of PXC writer node.
# ---------------------------------------------------------------------------
# The Tailscale LoadBalancer Service (k8s/clusters/glug-infra/pxc/
# tailscale-mysql-service.yaml) targets the HAProxy pods.
haproxy:
  enabled: true
  # Single HAProxy instance for Phase 1 (single k3s node).
  # Bump to 2 when a second schedulable node joins.
  size: 1

  # The upstream chart expects haproxy.image as a plain string (unlike
  # pxc.image which accepts repository+tag). Using the structured form
  # produces `map[repository:... tag:...]` in the pod spec, causing
  # InvalidImageName errors.
  image: "percona/haproxy:2.8.11"

  imagePullPolicy: IfNotPresent

  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "300m"
      memory: "256Mi"

  affinity:
    antiAffinityTopologyKey: "kubernetes.io/hostname"

  podDisruptionBudget:
    maxUnavailable: 1

  # Expose MySQL (3306), MySQL replicas read (3309), and stats (33062).
  # The Tailscale Service selects HAProxy pods on port 3306.
  exposePrimary:
    enabled: true
    type: ClusterIP

# ---------------------------------------------------------------------------
# ProxySQL — disabled; HAProxy is simpler and sufficient for our use case.
# ---------------------------------------------------------------------------
proxysql:
  enabled: false

# ---------------------------------------------------------------------------
# PMM (Percona Monitoring and Management) — disabled.
# We use victoria-metrics-k8s-stack with standalone VMServiceScrapes instead.
# ---------------------------------------------------------------------------
pmm:
  enabled: false

# ---------------------------------------------------------------------------
# Backups — Percona XtraBackup to S3-compatible storage.
# ---------------------------------------------------------------------------
backup:
  enabled: true

  image:
    repository: percona/percona-xtrabackup
    tag: "8.0.35-35.1"

  imagePullPolicy: IfNotPresent

  # S3 storage destination. Credentials come from secrets.yaml.
  storages:
    s3-backup:
      type: s3
      verifyTLS: true
      s3:
        # bucket and credentials OVERRIDDEN by secrets.yaml.
        bucket: ""
        region: ""
        # endpointUrl OVERRIDDEN by secrets.yaml.
        endpointUrl: ""
        credentialsSecret: ""

  # Schedule a full backup daily at 03:00 UTC.
  schedule:
    - name: daily-backup
      schedule: "0 3 * * *"
      keep: 14
      storageName: s3-backup

# ---------------------------------------------------------------------------
# Secrets — the chart can create secrets or reference existing ones.
# We let the chart create them; override root password in secrets.yaml.
# ---------------------------------------------------------------------------
secrets: {}

# ---------------------------------------------------------------------------
# Upgrade options
# ---------------------------------------------------------------------------
upgradeOptions:
  apply: disabled
  versionServiceEndpoint: https://check.percona.com
