---
# cnpg-backup.yaml — ScheduledBackup CR for chopper-pg.
#
# This file declares the *cadence* of base backups. The *destination* and
# *credentials* live in cnpg-cluster.yaml (spec.backup.barmanObjectStore)
# and the cnpg-backup-s3 Secret (applied via sops) respectively.
#
# Why no standalone ObjectStore CR here?
#   CNPG 1.28 introduces an optional barman-cloud plugin that consumes
#   ObjectStore CRs. We use the inline barmanObjectStore in the Cluster
#   spec instead — same effect, one fewer operator to install. See the
#   header comment in cnpg-cluster.yaml for the full reasoning.
#
# CNPG ScheduledBackup uses a 6-field cron expression:
#   <second> <minute> <hour> <day-of-month> <month> <day-of-week>
# "0 0 2 * * *" = every day at 02:00:00 UTC.

apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: chopper-pg-daily
  namespace: cnpg-clusters
  labels:
    app.kubernetes.io/name: chopper-pg
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  # Daily at 02:00 UTC. Adjust if your tailnet has a quieter window.
  schedule: "0 0 2 * * *"

  # The Backup objects produced by this schedule are owned by the
  # ScheduledBackup; CNPG garbage-collects them once they fall outside the
  # Cluster's retentionPolicy ("14d" — see cnpg-cluster.yaml).
  backupOwnerReference: self

  cluster:
    name: chopper-pg

  # Take a consistent base backup. Setting `immediate: false` here means we
  # do NOT take a base backup the moment this CR is applied — the first one
  # runs at the next 02:00 UTC tick. Set this to `true` once at first apply
  # if you want an immediate baseline (then re-apply with `false`), or just
  # trigger one manually:
  #   kubectl cnpg backup chopper-pg -n cnpg-clusters
  immediate: false

  # The CNPG Cluster's `backup.target: prefer-standby` (cnpg-cluster.yaml)
  # determines which instance to back up from when this Schedule fires.
  # We do NOT override it here.
  method: barmanObjectStore
