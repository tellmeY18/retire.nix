---
# cnpg-pooler.yaml — CloudNativePG Pooler CR (PgBouncer in transaction mode).
#
# The Pooler sits in front of the chopper-pg cluster's read-write Service and
# is the target of the Tailscale LoadBalancer (tailscale-pg-service.yaml).
#
# PgBouncer in transaction mode:
#   - Short-lived backend connections to PostgreSQL (released after each tx)
#   - Long-lived frontend connections from webservices
#   - Smooths reconnect latency during CNPG primary failover
#
# Service created by CNPG: `chopper-pg-pooler-rw` (ClusterIP, port 5432).
# We do NOT expose this Service directly; the Tailscale ts-proxy exposes it
# on the tailnet under MagicDNS name `pg-rw`.

apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: chopper-pg-pooler-rw
  namespace: cnpg-clusters
  labels:
    app.kubernetes.io/name: chopper-pg-pooler-rw
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  # Target cluster and service type.
  cluster:
    name: chopper-pg
  type: rw

  # 2 PgBouncer replicas for redundancy.
  # Phase 1 (single node): both land on chopper — no pod-level HA, but the
  # topology is ready. Flip the anti-affinity below to required once a
  # second untainted node joins (see docs/runbooks/add-node.md).
  instances: 2

  pgbouncer:
    poolMode: transaction
    parameters:
      # Max simultaneous client connections per PgBouncer instance.
      max_client_conn: "1000"
      # Backend connections per (db, user) pair per PgBouncer instance.
      default_pool_size: "25"
      # Reserve connections for administrative queries.
      reserve_pool_size: "5"
      # Drop clients idle for 10 minutes — they can reconnect cheaply.
      client_idle_timeout: "600"
      # Recycle backend connections every 10 minutes to spread the load
      # of a CNPG primary failover.
      server_idle_timeout: "600"
      # Application-level connection logs go through PgBouncer; keep these
      # on so we have a single source of truth for connect/disconnect events.
      log_connections: "1"
      log_disconnections: "1"
      # Defensive: PgBouncer requires its own auth_user when the backing
      # PostgreSQL has SCRAM/MD5; CNPG injects this automatically with
      # mTLS-based pooler auth, no manual config needed.

  # Pod template for PgBouncer pods.
  template:
    spec:
      # Phase 1: preferred anti-affinity (all on chopper is acceptable).
      # Flip to requiredDuringSchedulingIgnoredDuringExecution once ≥2 nodes
      # are available — see docs/runbooks/add-node.md step 6.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    # CNPG stamps this label on every PgBouncer pod managed
                    # by the named Pooler. Used by both this anti-affinity
                    # rule and the Tailscale Service selector.
                    cnpg.io/poolerName: chopper-pg-pooler-rw
                topologyKey: kubernetes.io/hostname
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
---
# ---------------------------------------------------------------------------
# PodDisruptionBudget for the PgBouncer pods.
#
# With 2 instances and `minAvailable: 1`, voluntary disruptions (node drain,
# kubectl rollout restart, cluster autoscaler) can only ever take down one
# pooler pod at a time. Combined with the Tailscale Service load-balancing
# across both, this yields zero connection drops during routine maintenance
# (assuming clients reconnect on TCP reset).
#
# CNPG's built-in PDB for the Cluster itself is created automatically by
# the operator; this PDB is only for the Pooler (operator does NOT create one).
# ---------------------------------------------------------------------------
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: chopper-pg-pooler-rw
  namespace: cnpg-clusters
  labels:
    app.kubernetes.io/name: chopper-pg-pooler-rw
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cnpg.io/poolerName: chopper-pg-pooler-rw
