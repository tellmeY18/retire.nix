# cnpg-backup-s3.enc.yaml — S3 credentials for CNPG Barman backup.
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# THIS FILE MUST BE SOPS-ENCRYPTED BEFORE COMMITTING TO GIT.
#
# Steps:
#   1. Fill in the real values for ACCESS_KEY_ID and SECRET_ACCESS_KEY below.
#   2. Ensure .sops.yaml has a creation rule covering this path.
#   3. Encrypt in-place:
#        sops --encrypt --in-place \
#          k8s/clusters/chopper/secrets/cnpg-backup-s3.enc.yaml
#   4. Verify it is encrypted (the file should start with "sops:" metadata).
#   5. Only then commit.
#
# To edit later:
#   just k8s-edit-secret k8s/clusters/chopper/secrets/cnpg-backup-s3.enc.yaml
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
#
# This Secret is applied separately from kustomize:
#   sops --decrypt k8s/clusters/chopper/secrets/cnpg-backup-s3.enc.yaml \
#     | kubectl apply -f -
#
# It is referenced by the Cluster spec (cnpg-cluster.yaml) and the
# ObjectStore CR (cnpg-backup.yaml) under spec.configuration.s3Credentials.

apiVersion: v1
kind: Secret
metadata:
  name: cnpg-backup-s3
  namespace: cnpg-clusters
type: Opaque
stringData:
  # S3 access key ID for the backup bucket.
  # For Backblaze B2: the Application Key ID.
  # For Cloudflare R2: the Access Key ID from the R2 API token.
  ACCESS_KEY_ID: "REPLACE-WITH-REAL-ACCESS-KEY-ID"

  # S3 secret access key for the backup bucket.
  # For Backblaze B2: the Application Key.
  # For Cloudflare R2: the Secret Access Key from the R2 API token.
  SECRET_ACCESS_KEY: "REPLACE-WITH-REAL-SECRET-ACCESS-KEY"

  # Optional: endpoint URL for non-AWS S3 (uncomment if using Garage / R2 / B2).
  # Must match the endpointURL in cnpg-cluster.yaml and cnpg-backup.yaml.
  # ENDPOINT_URL: "https://YOUR-ACCOUNT-ID.r2.cloudflarestorage.com"
