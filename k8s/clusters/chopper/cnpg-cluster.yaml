---
# cnpg-cluster.yaml — CloudNativePG Cluster CR for the chopper k3s cluster.
#
# Namespace: cnpg-clusters
# Operator:  cloudnative-pg chart 0.28.0 (CNPG 1.28.x), installed via helmfile.
#
# CNPG auto-generates these Kubernetes Secrets on first creation:
#   - chopper-pg-app             (application user; what webservices use)
#   - chopper-pg-ca              (cluster CA)
#   - chopper-pg-server / -replication / -client (mTLS material)
# Note: with `enableSuperuserAccess: false` the postgres superuser is locked
# (no password). For DBA tasks use `kubectl cnpg psql chopper-pg` which
# authenticates via the operator's cluster-internal mTLS path.
#
# WAL archiving and base backups go via the inline `backup.barmanObjectStore`
# block below. The `ScheduledBackup` CR in cnpg-backup.yaml only references
# this Cluster by name (`spec.cluster.name: chopper-pg`) and inherits the
# backup destination from this block — a single source of truth.
#
# Note on the standalone `ObjectStore` CR: CNPG 1.28 introduces an optional
# barman-cloud plugin (deployed as a separate operator) that consumes
# `ObjectStore` CRs. We deliberately do NOT use that path — the inline
# barmanObjectStore is still fully supported in 1.28, requires no extra
# operator, and avoids a second reconcile loop. Re-evaluate when the plugin
# becomes the only supported path (currently no deprecation timeline).

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: chopper-pg
  namespace: cnpg-clusters
  labels:
    app.kubernetes.io/name: chopper-pg
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  description: "Production PostgreSQL for cloud webservices (chopper, single-node phase 1)"

  # ---------------------------------------------------------------------------
  # Topology
  # ---------------------------------------------------------------------------
  # Three instances: one primary + two synchronous standbys.
  # Phase 1 (single node): all three pods land on chopper — no HA at the node
  # level, but the topology is already correct for when more nodes are added.
  instances: 3

  # Pin the PostgreSQL minor version explicitly. CNPG ships purpose-built
  # PostgreSQL container images that include all the operator-side tooling
  # (barman-cloud, pgaudit, etc.). Bump deliberately, never with `:latest`.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2-bookworm

  # Lock the postgres superuser. All app access goes through the `app` user
  # (see bootstrap.initdb below); DBA access uses operator-mediated paths.
  # See https://cloudnative-pg.io/documentation/current/postgresql_conf/#superuser-access
  enableSuperuserAccess: false

  # ---------------------------------------------------------------------------
  # Bootstrap
  # ---------------------------------------------------------------------------
  # On first creation only. Recovery into a NEW Cluster from S3 backups uses
  # `bootstrap.recovery` instead — see docs/runbooks/restore-pitr.md.
  bootstrap:
    initdb:
      database: app
      owner: app
      # Locale matters for collation: pin it so backup/restore between hosts
      # cannot end up with mismatched collations and silently corrupt indexes.
      localeCollate: C.UTF-8
      localeCType: C.UTF-8
      encoding: UTF8

  # ---------------------------------------------------------------------------
  # Storage  (OpenEBS ZFS LocalPV — provisioned by the NixOS-bootstrapped
  #            openebs-zfs-localpv chart on the `rpool/openebs` dataset.)
  # ---------------------------------------------------------------------------
  storage:
    storageClass: zfs-localpv
    size: 20Gi
  walStorage:
    # Separate volume for pg_wal so a runaway WAL fill cannot OOM the data
    # volume. ZFS LocalPV gives us per-volume snapshots either way; keeping
    # WAL on its own dataset also lets us tune logbias=latency just for WAL.
    storageClass: zfs-localpv
    size: 5Gi

  # ---------------------------------------------------------------------------
  # PostgreSQL configuration
  # ---------------------------------------------------------------------------
  postgresql:
    # Require at least 1 synchronous standby before acknowledging writes.
    # method: any  →  synchronous_standby_names = 'ANY 1 (*)'
    # With 3 instances this gives RPO ≈ 0 for a single replica loss.
    synchronous:
      method: any
      number: 1

    # Conservative parameter set tuned for the chopper hardware (laptop).
    # All values are strings as required by the CNPG API.
    parameters:
      # Memory
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "8MB"
      maintenance_work_mem: "64MB"

      # WAL / checkpoint
      wal_compression: "on"
      max_wal_size: "2GB"
      min_wal_size: "512MB"
      checkpoint_completion_target: "0.9"

      # Logging — emit slow queries and lock waits, but not every statement.
      log_min_duration_statement: "500ms"
      log_lock_waits: "on"
      log_temp_files: "0"
      log_checkpoints: "on"
      log_connections: "off" # PgBouncer logs these; avoid duplication.
      log_disconnections: "off"

      # Autovacuum — slightly more aggressive than defaults for OLTP.
      autovacuum_vacuum_scale_factor: "0.1"
      autovacuum_analyze_scale_factor: "0.05"

      # Extensions whitelisted for the `app` user via shared_preload_libraries.
      # Adjust before first apply if the application needs others (pg_cron,
      # pgvector, etc.); changes here require a Cluster restart, which CNPG
      # performs as a rolling restart.
      shared_preload_libraries: "pg_stat_statements"

  # ---------------------------------------------------------------------------
  # Backup — inline Barman Cloud config (single source of truth).
  # The ScheduledBackup CR in cnpg-backup.yaml drives the *cadence*; this
  # block declares the *destination* and credentials.
  # ---------------------------------------------------------------------------
  backup:
    # Retain base backups + just-enough WAL for 14 days of PITR.
    retentionPolicy: "14d"
    # Take backups from a standby when one is healthy to offload I/O from
    # the primary; CNPG falls back to the primary otherwise.
    target: prefer-standby
    barmanObjectStore:
      # S3 destination for WAL archives + base backups.
      # Replace with your actual bucket path before first apply.
      #   Backblaze B2:    s3://YOUR-BUCKET/chopper-pg
      #   Cloudflare R2:   s3://YOUR-BUCKET/chopper-pg  (+ endpointURL below)
      #   AWS S3:          s3://YOUR-BUCKET/chopper-pg
      destinationPath: "s3://YOUR-BUCKET-NAME/chopper-pg"

      # Uncomment for non-AWS S3-compatible endpoints (R2, B2, Garage, MinIO).
      # endpointURL: "https://YOUR-S3-ENDPOINT"

      # Credentials are read from the cnpg-backup-s3 Secret. That Secret is
      # applied separately via sops — see secrets/cnpg-backup-s3.enc.yaml.
      s3Credentials:
        accessKeyId:
          name: cnpg-backup-s3
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-backup-s3
          key: SECRET_ACCESS_KEY

      # WAL segment archiving — gzip is universally available; bump to
      # zstd if barman-cloud-wal-archive supports it in your image (CNPG
      # 1.28 PG17 image does).
      wal:
        compression: gzip
        maxParallel: 4

      # Base backup compression and parallelism. `immediateCheckpoint: false`
      # avoids the I/O spike of a synchronous checkpoint at backup start —
      # backups simply wait for the next natural checkpoint.
      data:
        compression: gzip
        immediateCheckpoint: false
        jobs: 2

  # ---------------------------------------------------------------------------
  # Pod scheduling
  # ---------------------------------------------------------------------------
  # Phase 1 (single node): preferred — all three pods will end up on chopper
  # but the field is in place. Flip to `required` once a second untainted
  # node joins the cluster (see docs/runbooks/add-node.md).
  affinity:
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  # CNPG exposes Prometheus metrics on port 9187 of every instance. Setting
  # enablePodMonitor=true makes the operator create a PodMonitor CR — picked
  # up automatically by kube-prometheus-stack if installed. Harmless if not.
  monitoring:
    enablePodMonitor: true

  # ---------------------------------------------------------------------------
  # Resource requests (tune for chopper's available RAM)
  # ---------------------------------------------------------------------------
  # `requests` reserve resources; `limits` cap them. For OLTP databases,
  # avoid memory limits that are too tight or PostgreSQL will OOM under load.
  resources:
    requests:
      memory: "512Mi"
      cpu: "100m"
    limits:
      memory: "1.5Gi"
      cpu: "1000m"
