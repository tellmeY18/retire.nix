---
# namespace.yaml — Self-hosted Tailscale DERP relay (derper).
#
# Runs derper on kenobi (the public-IP node) behind Traefik. Fixes the
# kenobi↔c3po DERP relay: c3po is behind symmetric NAT so kenobi can't NAT-punch
# to it and currently relays through Tailscale's throttled shared DERP — the
# bottleneck behind slow attic→RustFS uploads and the fragile etcd/CNPG/MGR
# behaviour across that pair.
#
# PSA privileged — the pod mounts the host's tailscaled socket (hostPath) for
# --verify-clients.
apiVersion: v1
kind: Namespace
metadata:
  name: derper
  labels:
    kubernetes.io/metadata.name: derper
    app.kubernetes.io/name: derper
    app.kubernetes.io/part-of: tailnet
    app.kubernetes.io/managed-by: kustomize
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
