---
# deployment.yaml — derper relay + its Service.
#
# Runtime mode: derper serves the DERP protocol over PLAIN HTTP on :8080
# (`-a :8080` — derper only does its own TLS when the -a port is :443), and
# Traefik terminates the public TLS in front (see ingress-traefik.yaml). So
# there's no cert to manage in the pod.
#
# --verify-clients makes derper relay ONLY for nodes in our tailnet. It's
# key-based (checks the connecting client's node key via the LOCAL tailscaled
# LocalAPI), so it works fine behind a proxy — it just needs kenobi's
# tailscaled socket, mounted via hostPath. That also pins the pod to kenobi.
#
# STUN: derper runs a STUN server on UDP :3478, exposed on the node via a
# hostPort (NOT through Traefik — STUN is UDP and goes straight to kenobi's
# public IP). This is REQUIRED for tailnet nodes to measure latency to this
# region; without it the region has no measurable latency and is never picked
# as a home/relay DERP (traffic falls back to Tailscale's shared relay). The
# derpMap entry sets STUNPort:3478 to match. Needs UDP 3478 open on kenobi's
# host firewall AND the OCI VCN security list.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: derper
  namespace: derper
  labels:
    app: derper
    app.kubernetes.io/name: derper
    app.kubernetes.io/part-of: tailnet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: derper
  template:
    metadata:
      labels:
        app: derper
        app.kubernetes.io/name: derper
    spec:
      # Pin to kenobi — the public-IP node and the host whose tailscaled
      # socket we mount for --verify-clients.
      nodeSelector:
        kubernetes.io/hostname: kenobi
      # fsGroup makes the emptyDir state volume group-writable by uid 1000 so
      # derper can write its auto-generated relay keypair (-c path) on boot.
      securityContext:
        fsGroup: 1000
      containers:
        - name: derper
          # NOTE: update this tag to the one produced by the "Build Derper
          # Image" workflow (ghcr.io/tellmey18/derper:build-<N>).
          image: ghcr.io/tellmey18/derper:build-1
          imagePullPolicy: IfNotPresent
          args:
            - "-c"
            - "/var/lib/derper/derper.key" # auto-generated relay keypair
            - "-a"
            - ":8080" # non-443 → plain HTTP; Traefik does TLS
            - "-http-port"
            - "-1" # no separate :80 redirect listener
            - "-verify-clients" # only relay for our tailnet
            - "-stun-port=3478" # STUN on UDP :3478 (direct, bypasses Traefik)
          ports:
            - name: derp
              containerPort: 8080
              protocol: TCP
            - name: stun
              containerPort: 3478
              hostPort: 3478 # expose STUN on kenobi's public IP (UDP)
              protocol: UDP
          volumeMounts:
            - name: tailscaled-sock
              mountPath: /var/run/tailscale
            - name: derper-state
              mountPath: /var/lib/derper
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        # kenobi's tailscaled control socket (world-rw 0666) for --verify-clients.
        - name: tailscaled-sock
          hostPath:
            path: /var/run/tailscale
            type: Directory
        # Ephemeral store for derper's relay keypair (regenerated on restart;
        # the derpMap entry doesn't pin the key, so a new key is harmless).
        - name: derper-state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: derper-svc
  namespace: derper
  labels:
    app: derper
spec:
  type: ClusterIP
  selector:
    app: derper
  ports:
    - name: derp
      protocol: TCP
      port: 8080
      targetPort: 8080
