---
# ingress-traefik.yaml — Expose derper at https://derp.tellmey.fyi via Traefik.
#
# Traefik terminates TLS (existing Let's Encrypt ACME) and forwards to derper's
# plain-HTTP :8080. DERP clients connect with HTTPS; the protocol's HTTP
# Upgrade (or WebSocket fallback) is carried through.
#
# Traefik tuning for DERP (long-lived, latency-sensitive relay connections):
#   - ServersTransport with NO backend timeouts (responseHeaderTimeout=0,
#     idleConnTimeout=0) — a DERP connection stays open indefinitely; default
#     timeouts would tear it down.
#   - responseForwarding.flushInterval small — flush relayed frames promptly
#     instead of buffering (minimises added latency on non-upgraded paths).
#   - Traefik's default entrypoint respondingTimeouts (read/write = 0, idle =
#     180s) are already DERP-friendly; DERP keepalives (~every 60s) keep the
#     connection from being considered idle.
#
# DNS required: derp.tellmey.fyi A 68.233.115.209 (kenobi).
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: derper-longlived
  namespace: derper
spec:
  forwardingTimeouts:
    dialTimeout: 30s
    responseHeaderTimeout: 0s
    idleConnTimeout: 0s
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: derper
  namespace: derper
  labels:
    app.kubernetes.io/name: derper
    app.kubernetes.io/part-of: tailnet
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`derp.tellmey.fyi`)
      kind: Rule
      services:
        - name: derper-svc
          port: 8080
          serversTransport: derper-longlived
          responseForwarding:
            flushInterval: 10ms
  tls:
    certResolver: letsencrypt
