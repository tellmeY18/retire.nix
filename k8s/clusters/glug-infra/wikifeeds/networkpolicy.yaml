---
# networkpolicy.yaml — Allow wikifeeds to reach MediaWiki and external DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: wikifeeds
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: mediawiki
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    # Allow ingress from Traefik
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8889
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wikifeeds-egress
  namespace: wikifeeds
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/part-of: mediawiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wikifeeds
  policyTypes:
    - Egress
  egress:
    # Allow DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow HTTPS to external (for reaching wiki.fosscell.org via ingress)
    - ports:
        - port: 443
          protocol: TCP
    # Allow HTTP (in case MediaWiki is HTTP internally)
    - ports:
        - port: 80
          protocol: TCP
