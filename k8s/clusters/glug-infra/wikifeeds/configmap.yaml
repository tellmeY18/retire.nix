---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wikifeeds-config
  namespace: wikifeeds
data:
  config.yaml: |
    # Number of worker processes to spawn.
    num_workers: 0

    # Log error messages and gracefully restart a worker if v8 reports that it
    # uses more heap (note: not RSS) than this many mb.
    worker_heap_limit_mb: 250

    # Logger info
    logging:
      level: info
      streams:
        - type: stdout
          named_levels: true

    services:
      - name: wikifeeds
        module: ./app.js
        conf:
          port: 8889
          cors: "*"

          # User agent for requests to MediaWiki
          user_agent: FOSSCELL Wikifeeds Service (wiki.fosscell.org)

          # REST API base URIs — point at wiki.fosscell.org
          use_request_host: true

          # MediaWiki API template — wiki uses empty scriptpath, so /api.php not /w/api.php
          mwapi_req:
            method: get
            uri: https://{{domain}}/api.php
            headers:
              user-agent: "{{user-agent}}"
              accept-language: "{{accept-language}}"
            query: "{{ default(request.query, {}) }}"

          # RESTBase template — used when usecorepagehtml is false (legacy path)
          restbase_req:
            method: "{{request.method}}"
            uri: https://{{domain}}/rest.php/v1/{+path}
            query: "{{ default(request.query, {}) }}"
            headers: "{{request.headers}}"
            body: "{{request.body}}"

          # REST Gateway template
          rest_gateway_req:
            method: "{{request.method}}"
            uri: https://{{domain}}/rest.php/v1/{+path}
            query: "{{ default(request.query, {}) }}"
            headers: "{{request.headers}}"
            body: "{{request.body}}"

          # MW REST API template — used when usecorepagehtml is true (getParsoidHtml
          # calls mwCorePageHTMLGet which uses mwrestapi_tpl). Must match wiki's
          # rest.php path (not /w/rest.php — wiki has empty scriptpath).
          mwrestapi_req:
            method: get
            uri: https://{{domain}}/rest.php/v1/{+path}
            headers: "{{request.headers}}"

          # MediaWiki appserver template — wiki uses empty scriptpath, so /index.php
          mw_req:
            method: get
            uri: https://{{domain}}/index.php
            query:
              title: "{{request.params.title}}"
            headers:
              user-agent: "{{user-agent}}"
              accept-language: "{{accept-language}}"

          # Enable page HTML from core Parsoid (MW 1.45+)
          usecorepagehtml: true
          debug: false
