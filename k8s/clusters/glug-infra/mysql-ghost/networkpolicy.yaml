---
# networkpolicy.yaml — NetworkPolicies for the mysql-ghost namespace.
#
# Single MySQL (member b, app=mysql-ghost) on c3po. Default-deny ingress, then
# 3306 from the ghost namespace (the app) and intra-namespace tooling (backup).
# Egress is left open (backup CronJob → RustFS S3, DNS).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mysql-ghost
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# MySQL: application SQL + intra-namespace tooling.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-ghost-ingress
  namespace: mysql-ghost
spec:
  podSelector:
    matchLabels:
      app: mysql-ghost
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Ghost app pods.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ghost
        # Intra-namespace tooling (backup CronJob).
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3306
