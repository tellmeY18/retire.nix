---
# kustomization.yaml — kustomize entry point for Ghost's MySQL.
#
# `kubectl apply -k k8s/clusters/glug-infra/mysql-ghost`
#
# A single MySQL (mysql-ghost-b, c3po) for Ghost, which connects to it
# directly. The 3-member Group Replication cluster + ProxySQL were retired
# 2026-11-16 (see docs/chopper-recovery-2026-11-16.md).
#
# Secrets are NOT managed here. Apply out-of-band before the first apply:
#   - credentials-secret.enc.yaml  mysql-ghost-root, mysql-ghost-app (the
#                                  `ghost` user password; must equal
#                                  ghost-credentials' database__connection__password)
#   - backup-r2-secret.enc.yaml    mysql-ghost-backup-r2 (off-site dumps)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mysql-ghost

labels:
  - pairs:
      app.kubernetes.io/part-of: ghost
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - mgr-config.yaml
  - mysql-ghost-b.yaml
  - mysql-ghost-backup-cronjob.yaml
