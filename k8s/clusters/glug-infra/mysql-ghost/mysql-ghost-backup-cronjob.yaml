---
# mysql-ghost-backup-cronjob.yaml — Hourly mysqldump of Ghost's DB to RustFS S3.
#
# Mirrors the pxc-ram backup job. Dumps the `ghost` database, gzips it, and
# uploads to s3://mysql-backups/ghost/<date>/<timestamp>.sql.gz.
# ZFS snapshots cover local rollback; this covers off-node / off-site DR.
#
# Reads directly from member A (the preferred primary) with --single-
# transaction for a consistent logical dump.
#
# Runs every hour at :30 (offset from mysql-ram's :00 to spread S3 load).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-ghost-backup
  namespace: mysql-ghost
  labels:
    app: mysql-ghost
    app.kubernetes.io/component: backup
spec:
  schedule: "30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: mysql-ghost-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: percona/percona-server:8.0.45
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  DATE=$(date +%Y-%m-%d)
                  DUMP_FILE="/tmp/mysql-ghost-${TIMESTAMP}.sql.gz"

                  echo "[$(date)] Starting mysqldump of ghost..."
                  mysqldump -h mysql-ghost-a-0.mysql-ghost-a.mysql-ghost.svc.cluster.local \
                    -uroot -p"${MYSQL_ROOT_PASSWORD}" \
                    --databases ghost \
                    --single-transaction \
                    --routines \
                    --triggers \
                    --events \
                    --set-gtid-purged=OFF \
                    2>/dev/null | gzip > "${DUMP_FILE}"

                  SIZE=$(du -h "${DUMP_FILE}" | cut -f1)
                  echo "[$(date)] Dump complete: ${SIZE}"

                  # Download mc (minio client) for S3 upload
                  curl -sL https://dl.min.io/client/mc/release/linux-arm64/mc -o /tmp/mc && chmod +x /tmp/mc
                  /tmp/mc alias set backup "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" --api S3v4
                  /tmp/mc cp "${DUMP_FILE}" "backup/${S3_BUCKET}/ghost/${DATE}/${TIMESTAMP}.sql.gz"

                  echo "[$(date)] Uploaded to s3://${S3_BUCKET}/ghost/${DATE}/${TIMESTAMP}.sql.gz (${SIZE})"

                  rm -f "${DUMP_FILE}"
                  echo "[$(date)] Pruning backups older than 7 days..."
                  PRUNE_BEFORE=$(date -d "7 days ago" +%Y-%m-%d)
                  for DIR in $(/tmp/mc ls "backup/${S3_BUCKET}/ghost/" 2>/dev/null | awk '{print $NF}'); do
                    DIR_DATE="${DIR%/}"
                    if [ -n "$DIR_DATE" ] && [ "$DIR_DATE" != "$DATE" ] && [ "$DIR_DATE" \< "$PRUNE_BEFORE" ]; then
                      /tmp/mc rm --force --recursive "backup/${S3_BUCKET}/ghost/${DIR}" 2>/dev/null
                      echo "[$(date)] Pruned: ${DIR}"
                    fi
                  done
                  rm -f /tmp/mc
                  echo "[$(date)] Backup complete."
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ghost-root
                      key: password
                - name: S3_ENDPOINT
                  value: "http://rustfs-storage-io.rustfs-clusters.svc:9000"
                - name: S3_BUCKET
                  value: "mysql-backups"
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ghost-backup-s3
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ghost-backup-s3
                      key: S3_SECRET_KEY
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
