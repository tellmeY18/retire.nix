---
# mysql-ghost-backup-cronjob.yaml — Nightly mysqldump of Ghost → Cloudflare R2.
#
# Same R2 bucket as the Postgres dumps, under `mysql-ghost/`, kept 30 days.
# Credentials: Secret `mysql-ghost-backup-r2` (backup-r2-secret.enc.yaml, sops).
# Restore: gunzip -c <file> | mysql -uroot -h mysql-ghost-b.mysql-ghost.svc
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-ghost-backup
  namespace: mysql-ghost
  labels:
    app: mysql-ghost
    app.kubernetes.io/component: backup
spec:
  schedule: "45 2 * * *"
  timeZone: Asia/Kolkata
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: mysql-ghost-backup
        spec:
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/hostname: c3po
          tolerations:
            - key: node-role.glug.infra/storage
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              image: percona/percona-server:8.0.45
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - bash
                - -c
                - |
                  set -euo pipefail
                  mysqldump -h mysql-ghost-b.mysql-ghost.svc.cluster.local -uroot \
                    --single-transaction --routines --triggers --events --hex-blob \
                    --set-gtid-purged=OFF --databases ghost activitypub \
                    | gzip > /backup/mysql-ghost-$(date +%Y%m%d-%H%M%S).sql.gz
                  ls -la /backup
              env:
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ghost-root
                      key: password
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: docker.io/rclone/rclone:1.71
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -eu
                  rclone copy /backup "r2:${R2_BUCKET}/mysql-ghost" -v
                  rclone delete "r2:${R2_BUCKET}/mysql-ghost" --min-age 30d -v
              env:
                - name: R2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ghost-backup-r2
                      key: R2_BUCKET
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ghost-backup-r2
                      key: R2_ENDPOINT
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ghost-backup-r2
                      key: R2_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ghost-backup-r2
                      key: R2_SECRET_ACCESS_KEY
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup
              emptyDir: {}
            - name: tmp
              emptyDir: {}
