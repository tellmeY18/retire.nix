---
# kustomization.yaml — kustomize entry point for the PXC cluster namespace.
#
# `kubectl apply -k k8s/clusters/glug-infra/pxc`
#
# What lives here:
#   - The `pxc-clusters` Namespace (with PodSecurity labels).
#   - NetworkPolicies guarding the namespace.
#   - The Tailscale LoadBalancer Service that exposes the HAProxy
#     as `mysql-rw.<tailnet>.ts.net:3306`.
#   - S3 backup credentials Secret (sops-encrypted).
#
# What does NOT live here (managed by helmfile instead):
#   - The PXC operator chart (pxc-system namespace).
#   - The PerconaXtraDBCluster CR, HAProxy, and backup schedule — rendered
#     by the percona/pxc-db Helm chart from k8s/apps/mysql/values.yaml +
#     secrets.yaml.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pxc-clusters

labels:
  - pairs:
      app.kubernetes.io/part-of: percona-xtradb-cluster
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - tailscale-mysql-service.yaml
  # backup-credentials-secret.enc.yaml is sops-encrypted; applied separately:
  #   sops --decrypt backup-credentials-secret.enc.yaml | kubectl apply -f -
