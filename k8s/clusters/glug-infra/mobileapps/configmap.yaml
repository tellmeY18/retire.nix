---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mobileapps-config
  namespace: mobileapps
data:
  config.yaml: |
    # Number of worker processes to spawn.
    num_workers: 0

    # Log error messages and gracefully restart a worker if v8 reports that it
    # uses more heap (note: not RSS) than this many mb.
    worker_heap_limit_mb: 250

    # Logger info
    logging:
      level: info
      streams:
        - type: stdout
          named_levels: true

    # Metrics reporter (statsd) - disabled for now
    metrics:
      type: statsd
      host: localhost
      port: 8125

    services:
      - name: service-mobileapp-node
        module: ./app.js
        conf:
          port: 8888
          cors: "*"

          # Security headers
          security_headers:
            x_frame_options: SAMEORIGIN
            x_content_type_options: nosniff
            x_xss_protection: 1; mode=block

          # RESTBase compatibility layer
          restbase_compatibility:
            security_headers: true

          # CSP for mobile-html
          mobile_html_csp: "default-src 'none';
            connect-src https://wiki.fosscell.org https://s3.tellmey.fyi 'self';
            media-src https://s3.tellmey.fyi https://wiki.fosscell.org 'self';
            img-src https://s3.tellmey.fyi https://wiki.fosscell.org 'self' data:;
            object-src 'none';
            script-src 'self' 'unsafe-inline';
            style-src https://wiki.fosscell.org 'self' 'unsafe-inline';
            frame-ancestors 'self'
            "

          # User agent for requests to MediaWiki
          user_agent: FOSSCELL Mobile Content Service (wiki.fosscell.org)

          # Wiki languages that require MW mobile view for language variant support
          mobile_view_languages: []

          # REST API base URIs — point at wiki.fosscell.org
          use_request_host: true
          mobileapps_uri: https://wiki.fosscell.org

          # MediaWiki API template
          mwapi_req:
            method: post
            uri: https://{{domain}}/api.php
            headers:
              host: '{{request.params.domain}}'
              user-agent: '{{user-agent}}'
              accept-language: '{{accept-language}}'
              content-type: application/x-www-form-urlencoded
            body: '{{ default(request.query, {}) }}'

          # RESTBase-shaped template pointing at MW core REST API
          # (for endpoints that haven't migrated to core-api-compat yet)
          restbase_req:
            method: '{{request.method}}'
            uri: https://{{domain}}/rest.php/v1/{+path}
            query: '{{ default(request.query, {}) }}'
            headers: '{{request.headers}}'
            body: '{{request.body}}'

          # RESTBase integration disabled - MobileApps talks directly to MediaWiki
          # For third-party wikis, RESTBase adds complexity without much benefit.

          # Use core Parsoid endpoint (MW 1.45+)
          use_coreparsoid_endpoint: true

          # Point at your MediaWiki's Parsoid endpoint (MW 1.45 uses /rest.php/v1/)
          mobile_html_rest_api_base_uri: https://wiki.fosscell.org/rest.php/
          mobile_html_local_rest_api_base_uri_template: https://wiki.fosscell.org/rest.php/v1/
          parsoid_uri: https://wiki.fosscell.org/rest.php/v1/

          # Core Parsoid templates (overrides built-in defaults that use /w/rest.php)
          corepagehtml_req:
            method: GET
            uri: https://{{domain}}/rest.php/v1/page/{{title}}/with_html
            query: '{{ default(request.query, {}) }}'
            headers: '{{request.headers}}'

          corerevisionhtml_req:
            method: GET
            uri: https://{{domain}}/rest.php/v1/revision/{{revision}}/with_html
            query: '{{ default(request.query, {}) }}'
            headers: '{{request.headers}}'

          # Disable domain restrictions for non-Wikimedia wikis
          restrict_domains: false

          # Redirect handling (PCS = Page Content Service compatibility)
          pcs_handles_redirects: false

          # Caching configuration (Cassandra-based, disabled for now)
          caching:
            enabled: false
            ttl: 0
            maxJitter: 0
            event:
              stream:
                change: resource_change
                purge: resource_purge
            excludedUserAgents:
              - RESTBase/WMF
            cassandra:
              keyspace: mobileapps
              storageTable: storage
