---
# deployment.yaml — Wikimedia mobileapps service for Wikipedia mobile app support.
#
# Provides /api/rest_v1/ endpoints that the Wikipedia mobile app uses to fetch
# structured page content. Points at wiki.fosscell.org's API and Parsoid.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobileapps
  namespace: mobileapps
  labels:
    app.kubernetes.io/name: mobileapps
    app.kubernetes.io/part-of: mediawiki
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mobileapps
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mobileapps
    spec:
      # Spread replicas across different nodes for HA (prefer, not require)
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mobileapps
                topologyKey: kubernetes.io/hostname
      # Tolerate storage node taint so we can run on chopper/c3po
      tolerations:
        - key: node-role.glug.infra/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: mobileapps
          # Use build-tagged image for version control
          # Update to :build-N when deploying a new version
          image: ghcr.io/tellmey18/mobileapps:build-7
          # Patch: fix Wikidata getCentralDescription crashing on non-Wikimedia wikis.
          # Empty languages array [] is truthy in JS, so the Wikidata call fires even
          # when there are no language variants. Add .catch() + length check.
          # TODO: remove command override once image is rebuilt with the patched Dockerfile.
          command: ["sh", "-c"]
          args:
            - |
              sed -i 's/languages ? mwapi\.getCentralDescription(req, site, languages) : BBPromise\.resolve({})/languages \&\& languages.length ? mwapi.getCentralDescription(req, site, languages).catch(function() { return {}; }) : BBPromise.resolve({})/g' /app/lib/mwapi.js
              exec node server.js -c /etc/mobileapps/config.yaml
          ports:
            - name: http
              containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /etc/mobileapps
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /_info
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_info
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: mobileapps-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: mobileapps-svc
  namespace: mobileapps
spec:
  selector:
    app.kubernetes.io/name: mobileapps
  ports:
    - port: 8888
      targetPort: 8888
      protocol: TCP
      name: http
