---
# deployment.yaml — Wikimedia mobileapps service for Wikipedia mobile app support.
#
# Provides /api/rest_v1/ endpoints that the Wikipedia mobile app uses to fetch
# structured page content. Points at wiki.fosscell.org's API and Parsoid.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mobileapps
  namespace: mobileapps
  labels:
    app.kubernetes.io/name: mobileapps
    app.kubernetes.io/part-of: mediawiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mobileapps
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mobileapps
    spec:
      # Pin to kenobi — minimal resource node for light services.
      nodeSelector:
        kubernetes.io/hostname: kenobi
      containers:
        - name: mobileapps
          # Use build-tagged image for version control
          # Update to :build-N when deploying a new version
          image: ghcr.io/tellmey18/mobileapps:build-10
          ports:
            - name: http
              containerPort: 8888
          volumeMounts:
            - name: config
              mountPath: /etc/mobileapps
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /_info
              port: 8888
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_info
              port: 8888
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: mobileapps-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: mobileapps-svc
  namespace: mobileapps
spec:
  selector:
    app.kubernetes.io/name: mobileapps
  ports:
    - port: 8888
      targetPort: 8888
      protocol: TCP
      name: http
