---
# deployment.yaml — Ghost CMS (stateless).
#
# All content stored in RustFS (S3) via ghost-object-store-storage-adapter.
# Database in PXC MySQL. No PVC needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/component: blog
    app.kubernetes.io/part-of: ghost
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ghost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghost
        app.kubernetes.io/component: blog
        app.kubernetes.io/part-of: ghost
    spec:
      containers:
        - name: ghost
          image: ghcr.io/tellmey18/ghost:build-6
          ports:
            - name: http
              containerPort: 2368
              protocol: TCP

          envFrom:
            - secretRef:
                name: ghost-credentials

          env:
            # Ghost core config
            - name: url
              value: "https://tellmey.fyi"
            - name: NODE_ENV
              value: "production"

            # Database
            - name: database__client
              value: "mysql"
            - name: database__connection__host
              value: "mysql-pxc-db-haproxy.pxc-clusters.svc"
            - name: database__connection__port
              value: "3306"
            - name: database__connection__database
              value: "ghost"

            # S3 Storage adapter
            - name: storage__active
              value: "object-store"
            - name: storage__files__adapter
              value: "object-store"
            - name: storage__media__adapter
              value: "object-store"
            - name: storage__objectStore__endpoint
              value: "rustfs-storage-io.rustfs-clusters.svc:9000"
            - name: storage__objectStore__bucket
              value: "ghost"
            - name: storage__objectStore__region
              value: "us-east-1"
            - name: storage__objectStore__useSSL
              value: "false"

            # Misc
            - name: security__staffDeviceVerification
              value: "false"

          volumeMounts:
            # Writable content dir (emptyDir — themes + adapter are in image)
            - name: content
              mountPath: /var/lib/ghost/content

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          livenessProbe:
            httpGet:
              path: /ghost/api/admin/site/
              port: 2368
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /ghost/api/admin/site/
              port: 2368
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: content
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ghost-svc
  namespace: ghost
spec:
  selector:
    app.kubernetes.io/name: ghost
  ports:
    - port: 2368
      targetPort: 2368
      protocol: TCP
      name: http
