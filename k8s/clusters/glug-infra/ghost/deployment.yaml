---
# deployment.yaml — Ghost CMS (stateless).
#
# Images served DIRECTLY from RustFS S3 to the browser (not proxied through Ghost).
# Database in PXC MySQL. No PVC needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghost
  namespace: ghost
  labels:
    app.kubernetes.io/name: ghost
    app.kubernetes.io/component: blog
    app.kubernetes.io/part-of: ghost
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ghost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghost
        app.kubernetes.io/component: blog
        app.kubernetes.io/part-of: ghost
    spec:
      tolerations:
        - key: node-role.glug.infra/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ghost
                topologyKey: kubernetes.io/hostname
      containers:
        - name: ghost
          image: ghcr.io/tellmey18/ghost:build-16
          ports:
            - name: http
              containerPort: 2368
              protocol: TCP

          envFrom:
            - secretRef:
                name: ghost-credentials

          env:
            # Ghost core config
            - name: url
              value: "https://tellmey.fyi"
            - name: NODE_ENV
              value: "production"
            - name: server__trustProxy
              value: "true"

            # Database (Ghost MGR cluster via dedicated ProxySQL)
            - name: database__client
              value: "mysql"
            - name: database__connection__host
              value: "proxysql-ghost.mysql-ghost.svc.cluster.local"
            - name: database__connection__port
              value: "3306"
            - name: database__connection__database
              value: "ghost"

            # S3 Storage — colinmeinke/ghost-storage-adapter-s3
            # Images are served DIRECTLY from assetHost (public Traefik ingress).
            # Ghost never proxies image reads. Migrated from Tailscale Funnel
            # to Traefik for better performance (direct to kenobi, no relay).
            - name: storage__active
              value: "s3"
            - name: storage__s3__endpoint
              value: "http://rustfs-storage-io.rustfs-clusters.svc:9000"
            - name: storage__s3__bucket
              value: "ghost"
            - name: storage__s3__region
              value: "us-east-1"
            - name: storage__s3__forcePathStyle
              value: "true"
            - name: storage__s3__assetHost
              value: "https://s3.tellmey.fyi/ghost"
            - name: storage__s3__pathPrefix
              value: ""
            - name: storage__s3__acl
              value: "public-read"
            - name: storage__s3__signatureVersion
              value: "v4"

            # Misc
            - name: security__staffDeviceVerification
              value: "false"

          volumeMounts:
            - name: content
              mountPath: /var/lib/ghost/content

          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

          livenessProbe:
            tcpSocket:
              port: 2368
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            tcpSocket:
              port: 2368
            initialDelaySeconds: 15
            periodSeconds: 10

      volumes:
        - name: content
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ghost-svc
  namespace: ghost
spec:
  selector:
    app.kubernetes.io/name: ghost
  ports:
    - port: 2368
      targetPort: 2368
      protocol: TCP
      name: http
