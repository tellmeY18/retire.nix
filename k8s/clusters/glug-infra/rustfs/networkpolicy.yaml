---
# networkpolicy.yaml — Default-deny + explicit allow NetworkPolicies for the
# rustfs-clusters namespace.
#
# Defense in depth: even though the cluster is reachable only over the
# tailnet, NetworkPolicies prevent unauthorised intra-cluster traffic.
#
# Standalone (single pod) topology — no inter-pod erasure traffic.
#
# Rules:
#   1. Default-deny ingress for the namespace.
#   2. Allow ingress to the RustFS pod on 9000 (S3 API) from the tailscale
#      operator, monitoring, and the consuming app namespaces.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rustfs-ingress
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  policyTypes:
    - Ingress
  ingress:
    # S3 API (9000) from tailscale, monitoring, and every consuming namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: changala
        # Ghost CMS + ActivityPub both live in the `ghost` namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ghost
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: answer
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mediawiki
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: penpot
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: attic
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nixery
        # MySQL backup CronJobs push dumps to the mysql-backups bucket.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mysql-ghost
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mysql-mediawiki
      ports:
        - protocol: TCP
          port: 9000
