---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-s3-proxy
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: nginx-s3-proxy
    app.kubernetes.io/component: s3-failover-proxy
    app.kubernetes.io/part-of: rustfs
data:
  nginx.conf: |
    upstream rustfs {
        server rustfs-chopper.rustfs-clusters.svc:9000 max_fails=2 fail_timeout=10s;
        server rustfs-c3po.rustfs-clusters.svc:9000     backup;
    }
    server {
        listen 9000;
        client_max_body_size 0;
        proxy_request_buffering off;

        # CORS headers for browser access from wiki.fosscell.org and tellmey.fyi.
        # MediaWiki, Ghost, and ActivityPub generate image URLs pointing at this
        # S3 endpoint; browsers need Access-Control-Allow-Origin to load cross-origin
        # resources. Multiple origins are allowed by setting the header dynamically.
        set $cors_origin "";
        if ($http_origin ~* "^https://(wiki\.fosscell\.org|tellmey\.fyi|www\.tellmey\.fyi)$") {
            set $cors_origin $http_origin;
        }
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, ETag" always;
        add_header Access-Control-Max-Age 3600 always;

        # Handle CORS preflight requests.
        if ($request_method = OPTIONS) {
            return 204;
        }

        location / {
            proxy_pass http://rustfs;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_timeout 30s;
            proxy_next_upstream_tries   3;
        }
    }
