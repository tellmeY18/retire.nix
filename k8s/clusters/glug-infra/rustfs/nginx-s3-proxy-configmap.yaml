---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-s3-proxy
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: nginx-s3-proxy
    app.kubernetes.io/component: s3-failover-proxy
    app.kubernetes.io/part-of: rustfs
data:
  nginx.conf: |
    upstream rustfs {
        server rustfs-chopper.rustfs-clusters.svc:9000 max_fails=2 fail_timeout=10s;
        server rustfs-c3po.rustfs-clusters.svc:9000     backup;
    }
    server {
        listen 9000;
        client_max_body_size 0;
        proxy_request_buffering off;
        location / {
            proxy_pass http://rustfs;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_timeout 30s;
            proxy_next_upstream_tries   3;
        }
    }
