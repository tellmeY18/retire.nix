---
# tenant.yaml — RustFS Tenant CR for the glug-infra cluster.
#
# This creates a distributed, erasure-coded S3-compatible object storage
# cluster managed by the RustFS operator.
#
# Architecture:
#   - 4 servers × 2 volumes = 8 total volumes (erasure coded)
#   - Tolerates up to 4 drive failures (EC:4 default parity)
#   - S3 API on port 9000, Console UI on port 9001
#   - Credentials from the `rustfs-credentials` Secret
#
# HA strategy:
#   Phase 1 (single node, chopper): all 4 pods on one node. No node-level
#   HA, but erasure coding protects against individual volume corruption.
#   Off-site backups (via mc mirror to R2/B2) are the DR strategy.
#
#   Phase 2 (multi-node): topologySpreadConstraints distribute pods across
#   nodes. Survives single node failure with no data loss.
#
# Storage:
#   Uses `zfs-localpv` StorageClass — same ZFS pool as CNPG/PXC.
#   50Gi per volume × 8 volumes = 400Gi raw, ~200Gi usable after EC.
#
# Accessing the S3 API:
#   From the tailnet: s3.<tailnet>.ts.net:9000
#   From within the cluster: rustfs-storage-io.rustfs-clusters.svc:9000
#
# Credentials:
#   The `credsSecret` references the `rustfs-credentials` Secret which
#   must exist before the Tenant is created. The operator validates the
#   Secret and retries every 60s if missing.

apiVersion: rustfs.com/v1alpha1
kind: Tenant
metadata:
  name: rustfs-storage
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
    environment: production
spec:
  # RustFS container image — pin to a specific tag for production.
  # Check releases: https://github.com/rustfs/rustfs/releases
  image: rustfs/rustfs:latest

  # Reference the credentials Secret (RECOMMENDED for production).
  # The operator validates this Secret exists with valid accesskey/secretkey.
  credsSecret:
    name: rustfs-credentials

  # Pod management policy: Parallel starts all pods simultaneously.
  # Recommended for RustFS — nodes coordinate via gossip, no ordered boot needed.
  podManagementPolicy: Parallel

  # Storage pool configuration.
  #
  # Single pool: 4 servers × 2 volumes = 8 erasure-coded drives on chopper.
  # This is the INTERIM configuration while we migrate to a proper 3-node
  # HA setup (pool spanning chopper + c3po + kenobi).
  #
  # Pool-1 (c3po) was removed because:
  #   - c3po went NotReady, making pool-1 unreachable
  #   - Pool-1 never integrated into the erasure set (format.json only
  #     references pool-0's 8 drives)
  #   - Having an unreachable pool in RUSTFS_VOLUMES causes 500 errors
  #     for ALL requests (including pool-0 data)
  #
  # TODO: Migrate to 3-node HA architecture. See docs/rustfs-ha.md.
  pools:
    - name: pool-0
      # 4 servers = 4 StatefulSet replicas.
      servers: 4

      persistence:
        volumesPerServer: 2
        volumeClaimTemplate:
          accessModes: ["ReadWriteOnce"]
          storageClassName: zfs-localpv
          resources:
            requests:
              storage: 50Gi
        labels:
          app.kubernetes.io/part-of: rustfs
          environment: production

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              rustfs.pool: pool-0

      resources:
        requests:
          cpu: "200m"
          memory: "512Mi"
        limits:
          cpu: "1000m"
          memory: "2Gi"

  # Optional environment variables.
  # RUSTFS_VOLUMES, RUSTFS_ADDRESS, RUSTFS_CONSOLE_ADDRESS, and
  # RUSTFS_CONSOLE_ENABLE are set automatically by the operator.
  env:
    - name: RUST_LOG
      value: info
    # RUSTFS_DOMAIN tells RustFS which domain to use for virtual-host style.
    # Any Host header that doesn't match falls back to path-style routing.
    # This fixes 403 errors when accessing via Tailscale Funnel (s3-1.tail477f2f.ts.net)
    # which RustFS would otherwise interpret as a virtual-host bucket name.
    - name: RUSTFS_DOMAIN
      value: s3.internal
