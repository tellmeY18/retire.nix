---
# kustomization.yaml — kustomize entry point for the RustFS namespace.
#
# `kubectl apply -k k8s/clusters/glug-infra/rustfs`
#
# What lives here (core Kubernetes types, no CRDs needed):
#   - The `rustfs-clusters` Namespace (with PodSecurity labels).
#   - NetworkPolicies guarding the namespace.
#   - The Tailscale LoadBalancer Service that exposes the S3 API
#     as `s3.<tailnet>.ts.net:9000`.
#
# What lives here but is applied AFTER helmfile (requires CRDs):
#   - The RustFS Tenant CR (the actual storage cluster) — applied by
#     `kubectl apply -f tenant.yaml` in the `just k8s::apply` recipe.
#   - The credentials Secret (sops-encrypted) — applied by
#     `just k8s::rustfs-apply-secret`.
#
# What does NOT live here (managed by helmfile instead):
#   - The RustFS operator chart (rustfs-system namespace).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rustfs-clusters

labels:
  - pairs:
      app.kubernetes.io/part-of: rustfs
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - tailscale-s3-service.yaml
  # NOTE: The following are NOT listed here — they require the RustFS operator
  # CRDs which are installed by helmfile. They are applied post-helmfile:
  #
  #   tenant.yaml
  #     Applied by: kubectl apply -f clusters/glug-infra/rustfs/tenant.yaml
  #     (done automatically by `just k8s::apply` after helmfile sync)
  #
  #   credentials-secret.enc.yaml
  #     Applied by: sops --decrypt credentials-secret.enc.yaml | kubectl apply -f -
  #     Use: just k8s::rustfs-apply-secret
