---
# kustomization.yaml — kustomize entry point for the RustFS namespace.
#
# `kubectl apply -k k8s/clusters/glug-infra/rustfs`
#
# Standalone, operator-free object storage: a single RustFS StatefulSet (one
# pod, one ZFS-backed PVC, no erasure coding, no Tenant CRD). See
# statefulset.yaml for the rationale.
#
# What lives here (all core Kubernetes types — NO CRDs, NO operator):
#   - The `rustfs-clusters` Namespace (with PodSecurity labels).
#   - NetworkPolicies guarding the namespace.
#   - The standalone RustFS StatefulSet + its Services (rustfs-hl headless and
#     rustfs-storage-io ClusterIP — the stable S3 endpoint apps point at).
#   - The Tailscale LoadBalancer Service that exposes the S3 API
#     as `s3.<tailnet>.ts.net:9000`.
#
# Applied separately (not a plain manifest):
#   - credentials Secret (sops-encrypted) — `just k8s::rustfs-apply-secret`.
#     The StatefulSet needs it to start, so apply the secret first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rustfs-clusters

labels:
  - pairs:
      app.kubernetes.io/part-of: rustfs
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - statefulset.yaml
  - service.yaml
  - tailscale-s3-service.yaml
  - tailscale-s3-funnel.yaml
