---
# kustomization.yaml — kustomize entry point for the RustFS namespace.
#
# `kubectl apply -k k8s/clusters/glug-infra/rustfs`
#
# Active-passive HA object storage: two standalone RustFS instances (chopper as
# primary, c3po as warm replica), async mirrored via mc mirror, fronted by an
# nginx failover proxy on kenobi. No erasure coding, no operator, no Tenant CRD.
#
# What lives here (all core Kubernetes types — NO CRDs, NO operator):
#   - The `rustfs-clusters` Namespace (with PodSecurity labels).
#   - NetworkPolicies guarding the namespace.
#   - Two standalone RustFS StatefulSets (chopper + c3po) + their Services.
#   - nginx failover proxy Deployment + ConfigMap (selects s3-failover label).
#   - mc mirror Deployment for async primary→replica replication.
#   - The Tailscale LoadBalancer Service exposing S3 as `s3.<tailnet>.ts.net:9000`.
#   - The Tailscale Funnel Ingress for public internet access to S3.
#
# Applied separately (not a plain manifest):
#   - credentials Secret (sops-encrypted) — `just k8s::rustfs-apply-secret`.
#     The StatefulSets need it to start, so apply the secret first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rustfs-clusters

labels:
  - pairs:
      app.kubernetes.io/part-of: rustfs
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - statefulset.yaml
  - statefulset-c3po.yaml
  - service.yaml
  - nginx-s3-proxy-configmap.yaml
  - nginx-s3-proxy-deployment.yaml
  - mc-mirror-deployment.yaml
  - tailscale-s3-service.yaml
  - tailscale-s3-funnel.yaml
