---
# kustomization.yaml — kustomize entry point for the RustFS namespace.
#
# `kubectl apply -k k8s/clusters/glug-infra/rustfs`
#
# What lives here:
#   - The `rustfs-clusters` Namespace (with PodSecurity labels).
#   - NetworkPolicies guarding the namespace.
#   - The RustFS Tenant CR (the actual storage cluster).
#   - The credentials Secret for RustFS admin access.
#   - The Tailscale LoadBalancer Service that exposes the S3 API
#     as `s3.<tailnet>.ts.net:9000`.
#
# What does NOT live here (managed by helmfile instead):
#   - The RustFS operator chart (rustfs-system namespace).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rustfs-clusters

labels:
  - pairs:
      app.kubernetes.io/part-of: rustfs
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  # NOTE: credentials-secret.enc.yaml is NOT listed here. It is sops-encrypted
  # and must be decrypted at apply time:
  #   sops --decrypt credentials-secret.enc.yaml | kubectl apply -f -
  # Use: just k8s::rustfs-apply-secret
  - tenant.yaml
  - tailscale-s3-service.yaml
