apiVersion: v1
kind: Service
metadata:
  name: rustfs-c3po-hl
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: rustfs-c3po
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rustfs-c3po
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-c3po
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: rustfs-c3po
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rustfs-c3po
  ports:
    - name: s3
      protocol: TCP
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-storage-io
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: s3-failover
    app.kubernetes.io/component: s3-api
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: s3-failover
  ports:
    - name: s3
      protocol: TCP
      port: 9000
      targetPort: 9000
