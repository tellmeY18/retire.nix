---
# service.yaml — Services for the standalone RustFS StatefulSet.
#
# Two services:
#   - rustfs-hl        : headless, required by the StatefulSet for stable pod
#                        DNS (rustfs-0.rustfs-hl...). Not used by apps.
#   - rustfs-storage-io: the stable S3 endpoint apps already point at. We KEEP
#                        the operator's old service name so NO app manifests
#                        need to change during the operator → standalone switch.
#                        (Apps use: http://rustfs-storage-io.rustfs-clusters.svc:9000)
apiVersion: v1
kind: Service
metadata:
  name: rustfs-hl
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-storage-io
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: s3-api
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rustfs
  ports:
    - name: s3
      protocol: TCP
      port: 9000
      targetPort: 9000
