---
# statefulset-c3po.yaml — Standalone single-node RustFS on c3po (warm replica).
#
# Mirrors statefulset.yaml for the chopper instance, but pinned to c3po.
# This instance serves as the warm replica: the mc mirror continuously syncs
# objects from chopper (primary) to c3po, and the nginx failover proxy falls
# back here when chopper is unreachable.
#
# Standalone mode = RUSTFS_VOLUMES points at a SINGLE local path, so there is
# no cross-node quorum and no `erasure read quorum` startup gate.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rustfs-c3po
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: rustfs-c3po
    app.kubernetes.io/component: object-storage
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: rustfs-c3po-hl
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs-c3po
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs-c3po
        app.kubernetes.io/component: object-storage
        app.kubernetes.io/part-of: rustfs
    spec:
      nodeSelector:
        kubernetes.io/hostname: c3po
      tolerations:
        - effect: NoSchedule
          key: node-role.glug.infra/storage
          operator: Exists
        - effect: NoExecute
          key: node-role.glug.infra/storage
          operator: Exists
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rustfs
          image: rustfs/rustfs:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: RUSTFS_VOLUMES
              value: "/data"
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "false"
            - name: RUST_LOG
              value: info
            - name: RUSTFS_DOMAIN
              value: s3.internal
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: accesskey
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secretkey
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "2Gi"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: rustfs-c3po
          app.kubernetes.io/part-of: rustfs
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: zfs-localpv
        resources:
          requests:
            storage: 100Gi
