---
# tailscale-s3-funnel.yaml — Expose the RustFS S3 API to the public internet
# via Tailscale Funnel for frontend blob access.
#
# Traffic path (public internet):
#   browser
#     → https://s3-1.tail477f2f.ts.net     (Tailscale Funnel, TLS terminated)
#     → ts-proxy pod                        (Ingress-managed, tailscale serve)
#     → rustfs-s3-internal ClusterIP        (port 9000)
#     → nginx S3 failover proxy             (label s3-failover)
#     → rustfs-chopper:9000 (primary) or rustfs-c3po:9000 (backup)
#
# Prerequisites:
#   - Tailscale Kubernetes operator installed.
#   - Tailscale ACL: Funnel enabled for tag:k8s.

apiVersion: v1
kind: Service
metadata:
  name: rustfs-s3-internal
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: s3-failover
    app.kubernetes.io/component: s3-internal
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: s3-failover
  ports:
    - name: s3-api
      protocol: TCP
      port: 9000
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-funnel
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/name: s3-failover
    app.kubernetes.io/component: s3-funnel
    app.kubernetes.io/part-of: rustfs
    app.kubernetes.io/managed-by: kustomize
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/tags: "tag:k8s"
spec:
  defaultBackend:
    service:
      name: rustfs-s3-internal
      port:
        number: 9000
  ingressClassName: tailscale
  tls:
    - hosts:
        - s3
