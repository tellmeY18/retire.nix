---
# pxc-haproxy-vmservicescrape.yaml — VMServiceScrape for PXC HAProxy pods.
#
# Native VictoriaMetrics equivalent of the former ServiceMonitor.
# Scrapes HAProxy's built-in Prometheus exporter on port 8404.

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: pxc-haproxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: percona-xtradb-cluster
    app.kubernetes.io/component: haproxy
    app.kubernetes.io/part-of: percona-xtradb-cluster
    app.kubernetes.io/managed-by: kustomize
spec:
  namespaceSelector:
    matchNames:
      - pxc-clusters
  selector:
    matchLabels:
      app.kubernetes.io/instance: mysql-pxc-db
  endpoints:
    - targetPort: 8404
      interval: 30s
      path: /metrics
