---
# rustfs-vmservicescrape.yaml — VMServiceScrape for RustFS object storage instances.
#
# Native VictoriaMetrics equivalent of a ServiceMonitor.
# Targets the RustFS IO service in the rustfs-clusters namespace and scrapes
# the MinIO-compatible metrics endpoints on port 9000.
#
# Why VMServiceScrape instead of VMPodScrape?
#   VMPodScrape requires knowing the container port NAME assigned by the
#   RustFS operator (which may vary across versions). VMServiceScrape with
#   `targetPort: 9000` (integer) works regardless of port naming.
#
# RustFS exposes two metrics paths (MinIO v2 metrics API):
#   - /minio/v2/metrics/cluster  — cluster-level aggregates (capacity, buckets,
#                                   erasure health, replication)
#   - /minio/v2/metrics/node     — per-node metrics (drive I/O, uptime, syscalls)
#
# Reference:
#   https://min.io/docs/minio/linux/operations/monitoring/metrics-and-alerts.html

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: rustfs-storage-instances
  namespace: monitoring
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  namespaceSelector:
    matchNames:
      - rustfs-clusters
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
  endpoints:
    # Cluster-level metrics — capacity, buckets, objects, erasure health.
    - targetPort: 9000
      path: /minio/v2/metrics/cluster
      interval: 30s
    # Node-level metrics — per-server drive I/O, network, uptime.
    - targetPort: 9000
      path: /minio/v2/metrics/node
      interval: 30s
