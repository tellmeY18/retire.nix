---
# laptop-battery-prometheusrules.yaml — PrometheusRule for laptop battery monitoring.
#
# The k3s nodes in this homelab are old laptops. The node_exporter DaemonSet
# (part of kube-prometheus-stack) reads /sys/class/power_supply/ via host
# filesystem mounts and exposes metrics for AC adapters and batteries.
#
# These rules are automatically picked up by Prometheus for ANY node that
# has a battery — they are fully node-agnostic. Every alert uses
# $labels.instance so it works regardless of how many laptop-nodes join
# the cluster.
#
# On non-laptop nodes (desktops, VMs, cloud instances), the powersupply
# metrics simply don't exist, so every PromQL expression evaluates to
# empty — the rules are harmless no-ops. There is no need to disable
# them per-node.
#
# Key metrics (from the node_exporter powersupply collector, enabled by
# default):
#   - node_power_supply_online{type="Mains"}
#       1 when AC is plugged in, 0 when running on battery.
#   - node_power_supply_energy_watthours{type="Battery"}
#       Current energy remaining (Wh).
#   - node_power_supply_energy_full_watthours{type="Battery"}
#       Full charge capacity of the battery (Wh). Degrades over time.
#   - node_power_supply_energy_full_design_watthours{type="Battery"}
#       Original design capacity (Wh). Fixed at manufacture time.
#
# Battery percentage is computed from energy_watthours / energy_full_watthours
# rather than the raw "capacity" sysfs attribute. The energy-based calculation
# is more reliable because it uses the kernel's coulomb-counter integration
# instead of the firmware's often-inaccurate percentage estimate.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: laptop-battery-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: laptop-battery
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  groups:
    - name: laptop-battery.rules
      rules:
        # -- AC power loss --------------------------------------------------
        # This is the most important alert. These are server laptops — they
        # should always be on mains power. Running on battery is abnormal
        # and means someone tripped over the cable or there's a power outage.

        - alert: NodeOnBattery
          annotations:
            description: >-
              Node {{ $labels.instance }} has lost AC power and is running
              on battery. Server laptops should always be plugged in —
              investigate immediately.
            summary: Node is running on battery power
          expr: |-
            node_power_supply_online{type="Mains"} == 0
          for: 2m
          labels:
            severity: warning

        # -- Battery level alerts -------------------------------------------
        # These only fire when the node is actually on battery (AC offline).
        # A laptop that is plugged in with a depleted battery is fine — the
        # PSU powers the system regardless of charge level.

        - alert: NodeBatteryLow
          annotations:
            description: >-
              Node {{ $labels.instance }} is on battery and charge has
              dropped below 30% (current: {{ $value | printf "%.1f" }}%).
              Restore AC power before the battery runs out.
            summary: Node battery below 30% while on battery power
          expr: |-
            (
              node_power_supply_energy_watthours{type="Battery"}
              /
              node_power_supply_energy_full_watthours{type="Battery"}
            ) * 100 < 30
            and on (instance)
            node_power_supply_online{type="Mains"} == 0
          for: 5m
          labels:
            severity: warning

        - alert: NodeBatteryCritical
          annotations:
            description: >-
              Node {{ $labels.instance }} is on battery and charge has
              dropped below 15% (current: {{ $value | printf "%.1f" }}%).
              The node will shut down soon if AC power is not restored.
            summary: Node battery below 15% while on battery power
          expr: |-
            (
              node_power_supply_energy_watthours{type="Battery"}
              /
              node_power_supply_energy_full_watthours{type="Battery"}
            ) * 100 < 15
            and on (instance)
            node_power_supply_online{type="Mains"} == 0
          for: 2m
          labels:
            severity: critical

        - alert: NodeBatteryEmergency
          annotations:
            description: >-
              Node {{ $labels.instance }} is on battery and charge has
              dropped below 5% (current: {{ $value | printf "%.1f" }}%).
              Imminent unclean shutdown — data loss is possible if
              workloads are not drained immediately.
            summary: Node battery below 5% — imminent shutdown
          expr: |-
            (
              node_power_supply_energy_watthours{type="Battery"}
              /
              node_power_supply_energy_full_watthours{type="Battery"}
            ) * 100 < 5
            and on (instance)
            node_power_supply_online{type="Mains"} == 0
          labels:
            severity: critical

        # -- Battery health -------------------------------------------------
        # This alert tracks long-term battery degradation. It fires
        # regardless of AC state because it's about the physical battery's
        # wear, not an immediate power event. The 1h `for` duration avoids
        # noise from transient sysfs read glitches.

        - alert: NodeBatteryHealthDegraded
          annotations:
            description: >-
              The battery in node {{ $labels.instance }} can only hold
              {{ $value | printf "%.0f" }}% of its original design capacity.
              Consider replacing the battery to maintain runtime during
              power outages.
            summary: Node battery health below 50% of design capacity
          expr: |-
            (
              node_power_supply_energy_full_watthours{type="Battery"}
              /
              node_power_supply_energy_full_design_watthours{type="Battery"}
            ) * 100 < 50
          for: 1h
          labels:
            severity: warning
