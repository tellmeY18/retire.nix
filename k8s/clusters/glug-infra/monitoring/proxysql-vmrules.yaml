---
# proxysql-vmrules.yaml — Alert rules for ProxySQL + MySQL RAM replica.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: proxysql-ram-replica-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  groups:
    - name: mysql-replication
      interval: 30s
      rules:
        # Alert if replication IO thread is not running
        - alert: MySQLReplicationIONotRunning
          expr: mysql_slave_status_slave_io_running{channel_name="from_primary"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "MySQL replication IO thread stopped on {{ $labels.instance }}"
            description: "The replication IO thread for channel 'from_primary' is not running. The RAM replica is not receiving updates from the primary."

        # Alert if replication SQL thread is not running
        - alert: MySQLReplicationSQLNotRunning
          expr: mysql_slave_status_slave_sql_running{channel_name="from_primary"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "MySQL replication SQL thread stopped on {{ $labels.instance }}"
            description: "The replication SQL thread for channel 'from_primary' is not running. The RAM replica is falling behind."

        # Alert if replication lag exceeds 30 seconds
        - alert: MySQLReplicationLagHigh
          expr: mysql_slave_status_seconds_behind_master{channel_name="from_primary"} > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "MySQL replication lag > 30s on {{ $labels.instance }}"
            description: "The RAM replica is {{ $value }}s behind the primary. Reads may return stale data."

    - name: proxysql-health
      interval: 30s
      rules:
        # Alert if ProxySQL pod is not ready
        - alert: ProxySQLDown
          expr: up{job="proxysql"} == 0 or absent(up{job="proxysql"})
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "ProxySQL is unreachable"
            description: "ProxySQL metrics endpoint is not responding. All MySQL read/write routing is affected."

        # Alert if a ProxySQL backend is shunned
        - alert: ProxySQLBackendShunned
          expr: proxysql_connection_pool_status{status="SHUNNED"} > 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "ProxySQL backend {{ $labels.hostgroup }} is SHUNNED"
            description: "ProxySQL has marked a backend as unhealthy. Queries to that hostgroup will fail."

    - name: mysql-ram-pod
      interval: 30s
      rules:
        # Alert if RAM replica pod is not ready
        - alert: MySQLRAMReplicaNotReady
          expr: kube_pod_status_ready{namespace="pxc-ram", pod=~"mysql-ram-.*", condition="true"} == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "MySQL RAM replica pod is not ready"
            description: "The RAM replica pod in pxc-ram namespace has been unready for 3 minutes. ProxySQL cannot route reads to it."
