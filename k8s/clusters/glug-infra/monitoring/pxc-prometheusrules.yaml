---
# pxc-prometheusrules.yaml — PrometheusRule for Percona XtraDB Cluster.
#
# Alerts for common PXC/Galera failure modes:
#   - Cluster node not ready (wsrep_ready != ON)
#   - Galera cluster size dropped (split-brain risk)
#   - Replication lag / flow control
#   - Backup failures
#   - PVC filling up
#
# These are scraped from the mysqld_exporter sidecar (port 9104) and
# the PXC operator's built-in metrics.

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pxc-default-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: percona-xtradb-cluster
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: percona-xtradb-cluster
    app.kubernetes.io/managed-by: kustomize
spec:
  groups:
    - name: pxc-galera.rules
      rules:
        - alert: PXCNodeNotReady
          annotations:
            description: >-
              PXC node {{ $labels.pod }} in namespace {{ $labels.namespace }}
              has wsrep_ready != ON for more than 5 minutes.
            summary: PXC Galera node is not ready
          expr: |-
            mysql_global_status_wsrep_ready != 1
          for: 5m
          labels:
            severity: critical

        - alert: PXCClusterSizeDegraded
          annotations:
            description: >-
              PXC cluster in {{ $labels.namespace }} has fewer than 3 members.
              Current size: {{ $value }}.
            summary: PXC Galera cluster size is degraded
          expr: |-
            mysql_global_status_wsrep_cluster_size < 3
          for: 5m
          labels:
            severity: warning

        - alert: PXCFlowControlPaused
          annotations:
            description: >-
              PXC node {{ $labels.pod }} has been flow-control paused for
              more than 10% of the time in the last 5 minutes.
            summary: PXC Galera flow control is throttling replication
          expr: |-
            rate(mysql_global_status_wsrep_flow_control_paused_ns[5m]) / 1e9 > 0.1
          for: 5m
          labels:
            severity: warning

        - alert: PXCSlowQueries
          annotations:
            description: >-
              PXC node {{ $labels.pod }} has more than 10 slow queries
              per minute over the last 5 minutes.
            summary: High rate of slow queries on PXC node
          expr: |-
            rate(mysql_global_status_slow_queries[5m]) > 10
          for: 5m
          labels:
            severity: warning

    - name: pxc-storage.rules
      rules:
        - alert: PXCPVCFillingUp
          annotations:
            description: >-
              PVC {{ $labels.persistentvolumeclaim }} in namespace
              {{ $labels.namespace }} is {{ $value | humanizePercentage }} full.
            summary: PXC PVC is filling up (> 80%)
          expr: |-
            (
              kubelet_volume_stats_used_bytes{namespace="pxc-clusters"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="pxc-clusters"}
            ) > 0.8
          for: 10m
          labels:
            severity: warning

        - alert: PXCPVCCriticallyFull
          annotations:
            description: >-
              PVC {{ $labels.persistentvolumeclaim }} in namespace
              {{ $labels.namespace }} is {{ $value | humanizePercentage }} full.
              MySQL may stop accepting writes imminently.
            summary: PXC PVC is critically full (> 90%)
          expr: |-
            (
              kubelet_volume_stats_used_bytes{namespace="pxc-clusters"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="pxc-clusters"}
            ) > 0.9
          for: 5m
          labels:
            severity: critical
