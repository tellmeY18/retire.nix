---
# cnpg-cluster-podmonitor.yaml — Standalone PodMonitor for CNPG Postgres instances.
#
# The official CNPG documentation (1.28+) recommends creating PodMonitor
# resources manually rather than using the deprecated
# `.spec.monitoring.enablePodMonitor` field on the Cluster CR.
#
# This PodMonitor targets every pod labelled with `cnpg.io/cluster: postgres-cluster`
# (the Cluster object name = Helm release "postgres" + chart "cluster") and
# scrapes the built-in metrics exporter on port 9187 ("metrics").
#
# CNPG instances expose:
#   - PostgreSQL metrics (cnpg_pg_*, cnpg_backends_*, cnpg_collector_*)
#   - Go runtime metrics (go_*)
#   - Default monitoring queries from the cnpg-default-monitoring ConfigMap
#
# Reference:
#   https://cloudnative-pg.io/documentation/current/monitoring/
#   https://github.com/cloudnative-pg/cloudnative-pg/blob/main/docs/src/monitoring.md

apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-cluster-instances
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  # Target pods in the cnpg-clusters namespace.
  namespaceSelector:
    matchNames:
      - cnpg-clusters
  # Select pods belonging to the postgres-cluster Cluster CR.
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster
  podMetricsEndpoints:
    - port: metrics
