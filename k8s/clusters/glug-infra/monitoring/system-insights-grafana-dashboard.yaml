---
# system-insights-grafana-dashboard.yaml — Rich system telemetry dashboard.
#
# Displays comprehensive node-exporter metrics organised by subsystem:
# system info, CPU, memory, network, storage, ZFS, and ZRAM.
#
# All queries use the `node` label (populated from
# __meta_kubernetes_pod_node_name) for node-aware filtering.
# The $node template variable auto-discovers all k3s nodes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: system-insights-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: system-insights
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
  annotations:
    grafana_folder: "Infrastructure"
data:
  system-insights-dashboard.json: |
    {
      "annotations": { "list": [] },
      "description": "Rich system telemetry across all k3s nodes: CPU, memory, network, storage, ZFS, and ZRAM. Filter by node name via the $node template variable.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "System Info",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "title": "Uptime",
          "description": "Node uptime in days.",
          "type": "stat",
          "gridPos": { "h": 3, "w": 3, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_time_seconds{node=~\"$node\"} - node_boot_time_seconds{node=~\"$node\"}",
              "legendFormat": "{{ node }}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0,
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 3,
          "title": "Load Average",
          "description": "1 / 5 / 15 minute load averages.",
          "type": "stat",
          "gridPos": { "h": 3, "w": 3, "x": 3, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_load1{node=~\"$node\"} or node_load15{node=~\"$node\"}",
              "legendFormat": "{{ node }}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "decimals": 2, "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] } },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 4,
          "title": "Processes",
          "description": "Total number of processes running.",
          "type": "stat",
          "gridPos": { "h": 3, "w": 3, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_processes_running{node=~\"$node\"}",
              "legendFormat": "{{ node }}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] } },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 5,
          "title": "Blocked Procs",
          "description": "Number of processes in uninterruptible sleep (blocked on I/O). Non-zero indicates I/O pressure.",
          "type": "stat",
          "gridPos": { "h": 3, "w": 3, "x": 9, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_processes_blocked{node=~\"$node\"}",
              "legendFormat": "{{ node }}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 1, "color": "orange" }, { "value": 5, "color": "red" } ] }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "graphMode": "none",
            "colorMode": "background",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 6,
          "title": "Context Switches",
          "description": "Rate of context switches per second.",
          "type": "stat",
          "gridPos": { "h": 3, "w": 3, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(node_context_switches_total{node=~\"$node\"}[5m])",
              "legendFormat": "{{ node }}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "ops", "decimals": 0, "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] } },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 7,
          "title": "CPU Cores",
          "description": "Number of CPU cores available on each node.",
          "type": "stat",
          "gridPos": { "h": 3, "w": 3, "x": 15, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "count(node_cpu_seconds_total{mode=\"idle\",node=~\"$node\"}) by (node)",
              "legendFormat": "{{ node }}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] } },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 8,
          "title": "Total Memory",
          "description": "Total physical memory per node.",
          "type": "stat",
          "gridPos": { "h": 3, "w": 3, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "blue" } ] } },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 9,
          "title": "Swap Total",
          "description": "Total swap space per node.",
          "type": "stat",
          "gridPos": { "h": 3, "w": 3, "x": 21, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_memory_SwapTotal_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }}",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "blue" } ] } },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "graphMode": "none",
            "colorMode": "value",
            "textMode": "auto",
            "orientation": "auto"
          }
        },
        {
          "id": 10,
          "title": "CPU",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 4 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 11,
          "title": "CPU Usage by Mode",
          "description": "CPU time breakdown by mode (user, system, iowait, softirq, steal). Stacked area shows how CPU cycles are spent.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "avg by (node, mode) (rate(node_cpu_seconds_total{node=~\"$node\",mode!=\"idle\"}[5m])) * 100",
              "legendFormat": "{{ node }} {{ mode }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "fillOpacity": 20, "lineWidth": 1, "stacking": { "mode": "normal" }, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "id": 12,
          "title": "CPU Usage %",
          "description": "Per-node total CPU usage. Green < 80%, orange 80-95%, red > 95%.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "100 - (avg by (node) (rate(node_cpu_seconds_total{mode=\"idle\",node=~\"$node\"}[5m])) * 100)",
              "legendFormat": "{{ node }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 80, "color": "orange" }, { "value": 95, "color": "red" } ] }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 13,
          "title": "Load Average",
          "description": "1-minute load average per node. Normalised to per-core (load / ncpu) so 1.0 = fully saturated.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_load1{node=~\"$node\"} / count(node_cpu_seconds_total{mode=\"idle\",node=~\"$node\"}) by (node)",
              "legendFormat": "{{ node }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 10, "lineWidth": 2, "thresholdsStyle": { "mode": "dashed" } },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 0.7, "color": "orange" }, { "value": 1.0, "color": "red" } ] }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 14,
          "title": "IOWait & Steal",
          "description": "CPU time spent waiting on I/O (iowait) and stolen by the hypervisor (steal). Non-zero iowait indicates storage pressure.",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "avg by (node) (rate(node_cpu_seconds_total{mode=\"iowait\",node=~\"$node\"}[5m])) * 100",
              "legendFormat": "{{ node }} iowait",
              "refId": "A"
            },
            {
              "expr": "avg by (node) (rate(node_cpu_seconds_total{mode=\"steal\",node=~\"$node\"}[5m])) * 100",
              "legendFormat": "{{ node }} steal",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "thresholdsStyle": { "mode": "dashed" } },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 5, "color": "orange" }, { "value": 10, "color": "red" } ] }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 15,
          "title": "Context Switches /s",
          "description": "Rate of context switches per second. Spikes may indicate thread contention.",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(node_context_switches_total{node=~\"$node\"}[5m])",
              "legendFormat": "{{ node }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": { "fillOpacity": 10, "lineWidth": 2 },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 16,
          "title": "Running vs Blocked",
          "description": "Running processes (blue) vs blocked on I/O (red). Blocked should stay near zero.",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_processes_running{node=~\"$node\"}",
              "legendFormat": "{{ node }} running",
              "refId": "A"
            },
            {
              "expr": "node_processes_blocked{node=~\"$node\"}",
              "legendFormat": "{{ node }} blocked",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "fillOpacity": 10, "lineWidth": 2 },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] }
            },
            "overrides": [
              {
                "matcher": { "id": "byFrameRefID", "options": "B" },
                "properties": [ { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } } ]
              }
            ]
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 17,
          "title": "Memory",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 20 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 18,
          "title": "Memory Breakdown",
          "description": "Memory usage breakdown per node: used, buffers/cache, slab, available. Stacked area shows how memory is distributed.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_memory_MemTotal_bytes{node=~\"$node\"} - node_memory_MemAvailable_bytes{node=~\"$node\"} - node_memory_Buffers_bytes{node=~\"$node\"} - node_memory_Cached_bytes{node=~\"$node\"} - node_memory_Slab_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} kernel/anon",
              "refId": "A"
            },
            {
              "expr": "node_memory_Buffers_bytes{node=~\"$node\"} + node_memory_Cached_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} buffers/cache",
              "refId": "B"
            },
            {
              "expr": "node_memory_Slab_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} slab",
              "refId": "C"
            },
            {
              "expr": "node_memory_MemAvailable_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} available",
              "refId": "D"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "fillOpacity": 20, "lineWidth": 1, "stacking": { "mode": "normal" } },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] }
            },
            "overrides": [
              {
                "matcher": { "id": "byFrameRefID", "options": "D" },
                "properties": [ { "id": "custom.fillOpacity", "value": 5 }, { "id": "custom.lineWidth", "value": 2 }, { "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } } ]
              }
            ]
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "id": 19,
          "title": "Memory Usage %",
          "description": "Per-node memory usage percentage (1 - available/total). Green < 75%, orange 75-90%, red > 90%.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "(1 - node_memory_MemAvailable_bytes{node=~\"$node\"} / node_memory_MemTotal_bytes{node=~\"$node\"}) * 100",
              "legendFormat": "{{ node }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "thresholdsStyle": { "mode": "line" } },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 75, "color": "orange" }, { "value": 90, "color": "red" } ] }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 20,
          "title": "Swap Usage",
          "description": "Swap usage per node. Non-zero swap on a server with ZRAM may indicate ZRAM is full and spilling to disk/zvol.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_memory_SwapTotal_bytes{node=~\"$node\"} - node_memory_SwapFree_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} swap used",
              "refId": "A"
            },
            {
              "expr": "rate(node_vmstat_pswpin{node=~\"$node\"}[5m])",
              "legendFormat": "{{ node }} pages in/s",
              "refId": "B"
            },
            {
              "expr": "rate(node_vmstat_pswpout{node=~\"$node\"}[5m])",
              "legendFormat": "{{ node }} pages out/s",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "fillOpacity": 10, "lineWidth": 2 },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" }, { "value": 0, "color": "orange" } ] }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "none" }
          }
        },
        {
          "id": 21,
          "title": "Slab Breakdown",
          "description": "Kernel slab allocations: reclaimable (dentry, inode caches) vs unreclaimable. High unreclaimable may indicate a memory leak in kernel space.",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 29 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_memory_Slab_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} slab total",
              "refId": "A"
            },
            {
              "expr": "node_memory_SReclaimable_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} reclaimable",
              "refId": "B"
            },
            {
              "expr": "node_memory_SUnreclaim_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} unreclaimable",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "fillOpacity": 10, "lineWidth": 2 },
              "thresholds": { "mode": "absolute", "steps": [ { "value": null, "color": "green" } ] }
            },
            "overrides": [
              {
                "matcher": { "id": "byFrameRefID", "options": "C" },
                "properties": [ { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } } ]
              }
            ]
          },
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          }
        },
        {
          "id": 22,
          "title": "Dirty & Writeback",
          "description": "Memory waiting to be written to disk (dirty) and currently being written (writeback). Persistent high writeback may indicate slow storage.",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 29 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "node_memory_Dirty_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} dirty",
              "refId": "A"
            },
            {
              "expr": "node_memory_Writeback_bytes{node=~\"$node\"}",
              "legendFormat": "{{ node }} writeback",
