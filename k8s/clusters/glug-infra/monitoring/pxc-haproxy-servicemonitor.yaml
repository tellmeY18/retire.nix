---
# pxc-haproxy-servicemonitor.yaml — ServiceMonitor for PXC HAProxy pods.
#
# The PXC operator's HAProxy image has a built-in Prometheus exporter on port 8404 at /metrics.
# This ServiceMonitor allows Prometheus to scrape HAProxy metrics.

apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pxc-haproxy
  namespace: monitoring
  labels:
    app.kubernetes.io/name: percona-xtradb-cluster
    app.kubernetes.io/component: haproxy
    app.kubernetes.io/part-of: percona-xtradb-cluster
    app.kubernetes.io/managed-by: kustomize
spec:
  namespaceSelector:
    matchNames:
      - pxc-clusters
  selector:
    matchLabels:
      app.kubernetes.io/instance: mysql-pxc-db
  endpoints:
    - targetPort: 8404
      interval: 30s
      path: /metrics
