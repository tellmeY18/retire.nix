---
# networkpolicy.yaml — NetworkPolicies for the monitoring namespace.
#
# Defense in depth: even though VMSingle and VMAlertmanager are ClusterIP-only
# (no Tailscale LoadBalancer, no NodePort), we lock down ingress so that only
# authorised pods can reach each service.
#
# Architecture (VictoriaMetrics stack):
#
#   tailnet → ts-proxy → Grafana (:3000) → VMSingle (:8428)
#                                        → VMAlertmanager (:9093)
#
#   VMAgent (:8429) → scrapes → kube-state-metrics, node-exporter,
#                                CNPG pods (via VMPodScrape), PXC (via VMServiceScrape)
#   VMAgent → writes → VMSingle (:8428)
#   VMAlert (:8080) → reads → VMSingle (:8428)
#   VMAlert → pushes → VMAlertmanager (:9093)
#
# Rules:
#   1. Default-deny ingress for the namespace.
#   2. Allow Grafana ingress from the Tailscale ts-proxy.
#   3. Allow VMSingle ingress from Grafana (queries) and VMAgent (writes)
#      and VMAlert (reads).
#   4. Allow VMAlertmanager ingress from VMAlert (alert delivery).
#   5. Allow intra-namespace scraping — VMAgent scrapes kube-state-metrics,
#      node-exporter, the operator, and VMAlertmanager.
#
# NOTE: VMAgent EGRESS is not restricted. It needs to reach pods in many
# namespaces (cnpg-clusters, cnpg-system, kube-system, etc.) for scraping.

# ---- 1. Default deny ingress ------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {} # all pods in the namespace
  policyTypes:
    - Ingress
---
# ---- 2. Allow Grafana ingress on port 3000 -----------------------------------
# Grafana has its own authentication (admin user + password from sops secret),
# so we do NOT restrict the source — only the port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
---
# ---- 3. Allow VMSingle ingress from Grafana, VMAgent, and VMAlert ------------
# Grafana queries VMSingle for dashboard panels (port 8428).
# VMAgent writes scraped metrics to VMSingle (port 8428).
# VMAlert reads metrics from VMSingle for rule evaluation (port 8428).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vmsingle-ingress
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Grafana pods.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        # VMAgent pods.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
        # VMAlert pods.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
      ports:
        - protocol: TCP
          port: 8428
---
# ---- 4. Allow VMAlertmanager ingress from VMAlert ----------------------------
# VMAlert pushes firing alerts to VMAlertmanager on port 9093.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vmalertmanager-from-vmalert
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
      ports:
        - protocol: TCP
          port: 9093
        # Alertmanager cluster peering port (for multi-replica HA).
        - protocol: TCP
          port: 9094
        - protocol: UDP
          port: 9094
---
# ---- 5. Allow intra-namespace metrics scraping by VMAgent --------------------
# VMAgent scrapes kube-state-metrics (:8080/:8443), node-exporter (:9100),
# the VM operator (:8080), VMSingle (:8428), VMAlert (:8080), and
# VMAlertmanager (:9093). Rather than listing each target individually, we
# allow VMAgent to reach any pod in this namespace on common metrics ports.
#
# NOTE: node-exporter runs with hostNetwork=true, so it is NOT subject to
# pod-level NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vmagent-scraping
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {} # all pods in the namespace
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        # kube-state-metrics HTTP
        - protocol: TCP
          port: 8080
        # kube-state-metrics self-metrics (telemetry port)
        - protocol: TCP
          port: 8443
        # node-exporter (pod-network fallback)
        - protocol: TCP
          port: 9100
        # VMAlertmanager metrics
        - protocol: TCP
          port: 9093
        # VMSingle metrics
        - protocol: TCP
          port: 8428
        # VMAlert metrics
        - protocol: TCP
          port: 8080
        # VMAgent self-metrics
        - protocol: TCP
          port: 8429
        # Cloudprober metrics
        - protocol: TCP
          port: 9313
        # jiralert metrics
        - protocol: TCP
          port: 9097
---
# ---- 6. Allow VM operator webhook & API access -------------------------------
# The VictoriaMetrics operator needs to be reached by the Kubernetes API server
# for admission webhook calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-operator-webhook
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
  policyTypes:
    - Ingress
  ingress:
    - ports:
        # Admission webhook port.
        - protocol: TCP
          port: 9443
