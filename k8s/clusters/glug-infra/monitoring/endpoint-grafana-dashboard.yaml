# endpoint-grafana-dashboard.yaml — Endpoint Uptime & Health dashboard
#
# Visualises Cloudprober synthetic probe metrics to give instant visibility
# into endpoint availability, response times, and SLO compliance.
#
# Metric sources:
#   - cloudprober:  cloudprober_total, cloudprober_success, cloudprober_latency
#   - alertmanager: ALERTS{alertstate="firing"}
#
# All queries exclude the "care-tls-expiry" probe (TLS cert checks use
# different semantics and have their own alerting rules).
#
# Node-agnostic: adding new probes to cloudprober.cfg automatically
# populates all panels via label_values() template variables.
#
# Docs: https://cloudprober.org/docs/
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: endpoint-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: endpoint-monitor
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
  annotations:
    grafana_folder: "Endpoints"
data:
  endpoint-uptime-dashboard.json: |
    {
      "annotations": { "list": [] },
      "description": "Endpoint uptime and health monitoring powered by Cloudprober synthetic probes. Tracks availability, response time, and SLO compliance for all monitored endpoints.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Status Overview",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "title": "Total Endpoints",
          "description": "Total number of endpoints being actively probed by Cloudprober.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "count(rate(cloudprober_total{probe!=\"care-tls-expiry\"}[5m]))",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "text" }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 3,
          "title": "Endpoints UP",
          "description": "Endpoints with >= 95% success rate over the last 5 minutes.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "count(rate(cloudprober_success{probe!=\"care-tls-expiry\"}[5m]) / rate(cloudprober_total{probe!=\"care-tls-expiry\"}[5m]) >= 0.95)",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 4,
          "title": "Endpoints DOWN",
          "description": "Endpoints with < 50% success rate over the last 5 minutes. Red means something is broken.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "count(rate(cloudprober_success{probe!=\"care-tls-expiry\"}[5m]) / rate(cloudprober_total{probe!=\"care-tls-expiry\"}[5m]) < 0.5) or vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 5,
          "title": "Active Alerts",
          "description": "Number of currently firing Endpoint/SSL alerts.",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\", alertname=~\"Endpoint.*|SSLCert.*\"}) or vector(0)",
              "instant": true,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 1, "color": "red" }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "value",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          }
        },
        {
          "id": 6,
          "title": "Per-Endpoint Success Rate",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 7,
          "title": "Success Rate %",
          "description": "Per-endpoint success rate as a percentage. Probes that consistently stay below the orange threshold (95%) likely need attention.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(cloudprober_success{probe!=\"care-tls-expiry\", probe=~\"$probe\"}[5m]) / rate(cloudprober_total{probe!=\"care-tls-expiry\", probe=~\"$probe\"}[5m]) * 100",
              "legendFormat": "{{probe}} \u2192 {{dst}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "red" },
                  { "value": 95, "color": "orange" },
                  { "value": 99, "color": "green" }
                ]
              },
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "showPoints": "never",
                "drawStyle": "line",
                "gradientMode": "none",
                "thresholdsStyle": { "mode": "line+area" }
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "min", "lastNotNull"] }
          }
        },
        {
          "id": 8,
          "title": "Response Time",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 9,
          "title": "Avg Response Time",
          "description": "Average response time per endpoint derived from cumulative latency counters. Cloudprober reports latency in microseconds; this panel converts to seconds.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "(rate(cloudprober_latency{probe!=\"care-tls-expiry\", probe=~\"$probe\"}[5m]) / rate(cloudprober_success{probe!=\"care-tls-expiry\", probe=~\"$probe\"}[5m])) / 1e6",
              "legendFormat": "{{probe}} \u2192 {{dst}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "green" },
                  { "value": 5, "color": "orange" },
                  { "value": 15, "color": "red" }
                ]
              },
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "showPoints": "never",
                "drawStyle": "line",
                "gradientMode": "none",
                "thresholdsStyle": { "mode": "line+area" }
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "max", "lastNotNull"] }
          }
        },
        {
          "id": 10,
          "title": "Availability SLO",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 11,
          "title": "1h Availability",
          "description": "Rolling 1-hour availability percentage per endpoint. This is the SLO gauge — green means the endpoint is meeting its availability target (>99.5%), orange is marginal (99-99.5%), red is in violation (<99%).",
          "type": "gauge",
          "gridPos": { "h": 6, "w": 24, "x": 0, "y": 24 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(cloudprober_success{probe!=\"care-tls-expiry\", probe=~\"$probe\"}[1h]) / rate(cloudprober_total{probe!=\"care-tls-expiry\", probe=~\"$probe\"}[1h]) * 100",
              "legendFormat": "{{probe}} \u2192 {{dst}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "value": null, "color": "red" },
                  { "value": 99, "color": "orange" },
                  { "value": 99.5, "color": "green" }
                ]
              },
              "color": { "mode": "thresholds" },
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "showThresholdLabels": false,
            "showThresholdMarkers": true
          }
        },
        {
          "id": 12,
          "title": "Probe Stats",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 13,
          "title": "Probes/sec (total vs success)",
          "description": "Raw probe throughput — total probes sent vs successful probes. A gap between the two lines indicates failures.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 31 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "rate(cloudprober_total{probe!=\"care-tls-expiry\", probe=~\"$probe\"}[5m])",
              "legendFormat": "{{probe}} total",
              "refId": "A"
            },
            {
              "expr": "rate(cloudprober_success{probe!=\"care-tls-expiry\", probe=~\"$probe\"}[5m])",
              "legendFormat": "{{probe}} success",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "color": { "mode": "palette-classic" },
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 5,
                "spanNulls": false,
                "axisCenteredZero": false,
                "axisColorMode": "text",
                "axisPlacement": "auto",
                "showPoints": "never",
                "drawStyle": "line",
                "gradientMode": "none"
              }
            },
            "overrides": []
          },
          "options": {
            "tooltip": { "mode": "multi", "sort": "desc" },
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["mean", "lastNotNull"] }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["endpoints", "cloudprober", "uptime", "slo"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "selected": true, "text": "VictoriaMetrics", "value": "VictoriaMetrics" },
            "hide": 0,
            "includeAll": false,
            "multi": false
          },
          {
            "name": "probe",
            "type": "query",
            "query": "label_values(cloudprober_total, probe)",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "allValue": ".*",
            "refresh": 2,
            "sort": 1
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Endpoint Uptime & Health",
      "uid": "endpoint-uptime",
      "version": 1
    }
