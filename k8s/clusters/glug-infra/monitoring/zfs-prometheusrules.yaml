---
# zfs-prometheusrules.yaml — PrometheusRule for ZFS host-level monitoring.
#
# The Prometheus node_exporter has a BUILT-IN ZFS collector that is enabled
# by default on Linux. It reads from /proc/spl/kstat/zfs/ and exposes:
#
#   node_zfs_arc_*             — ARC (Adaptive Replacement Cache) statistics
#   node_zfs_zil_*             — ZFS Intent Log stats
#   node_zfs_zpool_*           — Per-pool IO stats and state
#   node_zfs_zpool_dataset_*   — Per-dataset (objset) stats
#   node_zfs_zfetch_*          — Prefetch (zfetch) stats
#   node_zfs_abd_*             — ABD (Adaptive Buffer Data) stats
#   node_zfs_dmu_tx_*          — DMU transaction stats
#
# No separate exporter, textfile collector, or custom scrape config is needed.
# kube-prometheus-stack's node-exporter DaemonSet already runs with hostPID,
# hostNetwork, and the host /proc mounted — so ZFS metrics are collected
# automatically on every node that has the ZFS kernel module loaded.
#
# Pool state metrics:
#   node_zfs_zpool_state{zpool="rpool",state="online"}   = 1
#   node_zfs_zpool_state{zpool="rpool",state="degraded"} = 0
#   node_zfs_zpool_state{zpool="rpool",state="faulted"}  = 0
#   ...
#
# Alert design:
#   - Pool not online → critical (data at risk)
#   - ARC hit ratio dropping → warning (performance degradation, not data loss)
#   - ARC metadata usage high → warning (memory pressure)
#
# Useful PromQL for ad-hoc exploration:
#   node_zfs_zpool_state{state="online"} == 0             # pools not online
#   node_zfs_arc_hits / (node_zfs_arc_hits + node_zfs_arc_misses)  # ARC hit ratio
#   rate(node_zfs_arc_misses[5m])                          # ARC miss rate
#
# Reference:
#   https://github.com/prometheus/node_exporter (ZFS collector, enabled by default)
#   https://openzfs.github.io/openzfs-docs/Basic%20Concepts/ARC.html

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zfs-host-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: zfs
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: kube-prometheus-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  groups:
    # =======================================================================
    # Group 1 — ZFS pool health
    # =======================================================================
    - name: zfs-pool-health
      rules:
        # -------------------------------------------------------------------
        # Pool not online — critical
        # -------------------------------------------------------------------
        # node_zfs_zpool_state is a gauge with labels {zpool, state}.
        # Exactly one state per pool has value 1; the rest are 0.
        # If the "online" state is not 1, something is very wrong.
        - alert: ZFSPoolNotOnline
          expr: |-
            node_zfs_zpool_state{state="online"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is not online"
            description: >-
              ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is not in
              the ONLINE state. Check `zpool status {{ $labels.zpool }}` for
              details. Possible states: degraded, faulted, offline, removed,
              unavail, suspended.

        # -------------------------------------------------------------------
        # Pool degraded — warning
        # -------------------------------------------------------------------
        # A degraded pool is still serving IO but has lost redundancy.
        # On a single-disk pool (like chopper's rpool) this fires if ZFS
        # reports degraded for any reason (e.g. a checksum error threshold).
        - alert: ZFSPoolDegraded
          expr: |-
            node_zfs_zpool_state{state="degraded"} == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is degraded"
            description: >-
              ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} is in a
              DEGRADED state. It is still operational but has reduced
              redundancy. Run `zpool status {{ $labels.zpool }}` to identify
              the affected vdev.

        # -------------------------------------------------------------------
        # Pool faulted — critical
        # -------------------------------------------------------------------
        # A faulted pool is completely inaccessible.
        - alert: ZFSPoolFaulted
          expr: |-
            node_zfs_zpool_state{state="faulted"} == 1
          for: 0m
          labels:
            severity: critical
          annotations:
            summary: "ZFS pool {{ $labels.zpool }} is FAULTED"
            description: >-
              ZFS pool {{ $labels.zpool }} on {{ $labels.instance }} has
              FAULTED. All data on this pool is inaccessible until the fault
              is resolved. Immediate investigation required.

    # =======================================================================
    # Group 2 — ARC (Adaptive Replacement Cache) efficiency
    # =======================================================================
    - name: zfs-arc
      rules:
        # -------------------------------------------------------------------
        # ARC hit ratio low — warning
        # -------------------------------------------------------------------
        # A healthy ARC should maintain > 80% hit ratio in steady state.
        # On a laptop with limited RAM, occasional dips during large imports
        # are expected; the 15m `for` duration filters out transients.
        #
        # node_zfs_arc_hits and node_zfs_arc_misses are counters, so we
        # use rate() to compute the ratio over the last 5 minutes.
        - alert: ZFSARCHitRatioLow
          expr: |-
            (
              rate(node_zfs_arc_hits[5m])
              /
              (rate(node_zfs_arc_hits[5m]) + rate(node_zfs_arc_misses[5m]))
            ) < 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ZFS ARC hit ratio is below 80%"
            description: >-
              ZFS ARC hit ratio on {{ $labels.instance }} is
              {{ $value | humanizePercentage }} (5m average). Sustained low
              hit ratios indicate memory pressure or a working set larger
              than ARC can cache. Check `arc_summary` for details.

        # -------------------------------------------------------------------
        # ARC size shrinking — warning
        # -------------------------------------------------------------------
        # If ARC size drops below 50% of its target max for an extended
        # period, something is competing for memory (e.g. OOM pressure
        # from k3s pods). This is a soft signal, not critical.
        - alert: ZFSARCShrunk
          expr: |-
            (node_zfs_arc_size / node_zfs_arc_c_max) < 0.5
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "ZFS ARC is significantly below target size"
            description: >-
              ZFS ARC on {{ $labels.instance }} is using only
              {{ $value | humanizePercentage }} of its maximum target size
              (c_max). Sustained shrinkage suggests memory pressure from
              other workloads.

    # =======================================================================
    # Group 3 — ZFS IO anomalies
    # =======================================================================
    - name: zfs-io
      rules:
        # -------------------------------------------------------------------
        # High ZIL commit rate — informational/warning
        # -------------------------------------------------------------------
        # The ZFS Intent Log (ZIL) handles synchronous writes. A high
        # commit rate can indicate sync-heavy workloads (common with
        # PostgreSQL on ZFS). This is informational — not necessarily a
        # problem, but worth knowing about.
        - alert: ZFSHighZILCommitRate
          expr: |-
            rate(node_zfs_zil_zil_commit_count[5m]) > 1000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "ZFS ZIL commit rate is high"
            description: >-
              ZIL commit rate on {{ $labels.instance }} is
              {{ $value | humanize }}/s over the last 5 minutes. This is
              expected for sync-heavy workloads like PostgreSQL, but
              sustained rates may benefit from a dedicated SLOG device.
