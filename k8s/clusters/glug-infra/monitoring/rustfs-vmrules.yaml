---
# rustfs-vmrules.yaml — VMRule for RustFS (MinIO-compatible) alerting.
#
# Native VictoriaMetrics equivalent of a PrometheusRule.
# Evaluated by VMAlert, which reads rules from all VMRule objects.
#
# These rules are NODE-AGNOSTIC — they auto-discover new RustFS pods via
# generic minio_* metrics with label selectors. Adding new nodes or pods
# requires zero changes to these rules.
#
# NOTE: Metric names assume MinIO v2 metrics API compatibility. RustFS aims
# for full compatibility, but some metric names may differ in practice.
# Verify actual metric names with:
#   curl http://<rustfs-pod>:9000/minio/v2/metrics/cluster
#   curl http://<rustfs-pod>:9000/minio/v2/metrics/node
# and adjust expressions below if needed.
#
# Cluster topology: 4 servers × 2 volumes = 8 erasure-coded volumes.

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: rustfs-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/name: rustfs
    app.kubernetes.io/component: alerting
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
    app.kubernetes.io/managed-by: kustomize
spec:
  groups:
    # ──────────────────────────────────────────────────────────────────────
    # Group 1: Cluster health — nodes, drives, capacity
    # ──────────────────────────────────────────────────────────────────────
    - name: rustfs-cluster-health
      rules:
        - alert: RustFSNodeOffline
          annotations:
            description: >-
              {{ $value }} RustFS node(s) are offline in the cluster.
              With 4-server erasure coding, losing nodes risks data
              unavailability.
            summary: A RustFS node is offline.
          expr: |-
            minio_cluster_nodes_offline_total > 0
          for: 2m
          labels:
            severity: critical

        - alert: RustFSDriveOffline
          annotations:
            description: >-
              {{ $value }} drive(s) are offline in the RustFS cluster.
              Erasure coding can tolerate some drive loss, but offline
              drives must be investigated immediately.
            summary: A RustFS drive is offline.
          expr: |-
            minio_cluster_drive_offline_total > 0
          for: 2m
          labels:
            severity: critical

        - alert: RustFSClusterCapacityWarning
          annotations:
            description: >-
              RustFS cluster usable free capacity is below 20%
              ({{ $value | humanizePercentage }} free). Consider expanding
              storage or cleaning up unused objects.
            summary: RustFS cluster capacity below 20% free.
          expr: |-
            (
              minio_cluster_capacity_free_bytes
              /
              minio_cluster_capacity_total_bytes
            ) < 0.2
          for: 10m
          labels:
            severity: warning

        - alert: RustFSClusterCapacityCritical
          annotations:
            description: >-
              RustFS cluster usable free capacity is below 10%
              ({{ $value | humanizePercentage }} free). Write failures
              are imminent. Expand storage urgently.
            summary: RustFS cluster capacity critically low (< 10% free).
          expr: |-
            (
              minio_cluster_capacity_free_bytes
              /
              minio_cluster_capacity_total_bytes
            ) < 0.1
          for: 5m
          labels:
            severity: critical

    # ──────────────────────────────────────────────────────────────────────
    # Group 2: S3 API errors and latency
    # ──────────────────────────────────────────────────────────────────────
    - name: rustfs-s3-errors
      rules:
        - alert: RustFSHighErrorRate
          annotations:
            description: >-
              RustFS S3 request error rate is {{ $value | humanize }}/s
              (threshold: 5/s). Investigate application-side issues or
              storage backend failures.
            summary: High S3 request error rate on RustFS.
          expr: |-
            rate(minio_s3_requests_errors_total[5m]) > 5
          for: 5m
          labels:
            severity: warning

        # NOTE: The exact metric name for request latency/waiting may vary
        # between MinIO versions and RustFS compatibility level. Verify with:
        #   curl http://<rustfs-pod>:9000/minio/v2/metrics/cluster | grep waiting
        # Common alternatives:
        #   - minio_s3_requests_waiting_total (gauge of currently waiting)
        #   - minio_s3_ttfb_seconds (time to first byte histogram)
        # Adjust the expression below based on actual metrics output.
        - alert: RustFSHighLatency
          annotations:
            description: >-
              RustFS S3 request queue depth (p99) is {{ $value }}
              (threshold: 10). Requests are backing up — check drive
              I/O and network throughput.
            summary: High S3 request latency / queue depth on RustFS.
          expr: |-
            histogram_quantile(0.99, rate(minio_s3_requests_waiting_total[5m])) > 10
          for: 5m
          labels:
            severity: warning

    # ──────────────────────────────────────────────────────────────────────
    # Group 3: Background healing (erasure repair)
    # ──────────────────────────────────────────────────────────────────────
    - name: rustfs-healing
      rules:
        - alert: RustFSHealingInProgress
          annotations:
            description: >-
              RustFS background healing is active — {{ $value }} objects
              are being healed. This indicates a previous drive or node
              failure triggered erasure repair. Monitor until healing
              completes.
            summary: RustFS background healing is active (potential issue).
          expr: |-
            minio_heal_objects_total > 0 and minio_heal_objects_heal_total > 0
          for: 10m
          labels:
            severity: warning
