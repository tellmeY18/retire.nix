---
# pxc-cluster-vmservicescrape.yaml — VMServiceScrape for PXC MySQL instances.
#
# Native VictoriaMetrics equivalent of the former ServiceMonitor.
# Scrapes mysqld_exporter sidecar on port 9104.
#
# Reference:
#   https://docs.percona.com/percona-operator-for-mysql/pxc/monitoring.html

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: pxc-cluster-instances
  namespace: monitoring
  labels:
    app.kubernetes.io/name: percona-xtradb-cluster
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: percona-xtradb-cluster
    app.kubernetes.io/managed-by: kustomize
spec:
  namespaceSelector:
    matchNames:
      - pxc-clusters
  selector:
    matchLabels:
      app.kubernetes.io/instance: mysql-pxc-db
  endpoints:
    - targetPort: 9104
      interval: 30s
      path: /metrics
