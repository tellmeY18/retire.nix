---
# proxysql-vmservicescrape.yaml — Scrape ProxySQL metrics.
#
# ProxySQL 3.x exposes Prometheus metrics via the REST API on port 6032.
# Requires restapi_enabled=true in admin_variables (already configured).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: proxysql
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
spec:
  namespaceSelector:
    matchNames:
      - proxysql
  selector:
    matchLabels:
      app: proxysql
  endpoints:
    - port: admin
      path: /metrics
      interval: 30s
