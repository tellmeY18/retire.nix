---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logs-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: victoria-metrics-k8s-stack
data:
  logs.json: |
    {
      "annotations": {
        "list": []
      },
      "description": "Centralized log exploration for the GLUG Infra k3s cluster via VictoriaLogs",
