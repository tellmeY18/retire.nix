---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-log-collector
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: log-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vector
    spec:
      serviceAccountName: vector-log-collector
      tolerations:
        - operator: Exists
      containers:
        - name: vector
          image: timberio/vector:0.55.0-alpine
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: VECTOR_LOG
              value: "warn"
          ports:
            # prometheus_exporter sink — scraped by the vector-internal
            # VMPodScrape below.
            - name: metrics
              containerPort: 9598
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/vector
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: var-lib-rancher
              mountPath: /var/lib/rancher/k3s/agent/containerd
              readOnly: true
            - name: data
              mountPath: /var/lib/vector
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: vector-config
        - name: var-log
          hostPath:
            path: /var/log
        - name: var-lib-rancher
          hostPath:
            path: /var/lib/rancher/k3s/agent/containerd
        - name: data
          hostPath:
            path: /var/lib/vector
            type: DirectoryOrCreate
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector-log-collector
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector-log-collector
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector-log-collector
subjects:
  - kind: ServiceAccount
    name: vector-log-collector
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: vector-log-collector
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: monitoring
data:
  vector.yaml: |
    sources:
      # Vector's own telemetry: events in/out per component, errors, buffer
      # usage, lag. Without this source nothing emits vector_* metrics at
      # all, which is why the log-pipeline panels had no data.
      internal_metrics:
        type: internal_metrics

      kubernetes_logs:
        type: kubernetes_logs
        self_node_name: "${VECTOR_SELF_NODE_NAME}"
        extra_namespace_label_selector: ""
        extra_label_selector: ""

    transforms:
      parse_logs:
        type: remap
        inputs: ["kubernetes_logs"]
        source: |
          # Extract standard fields for VictoriaLogs
          .namespace = .kubernetes.pod_namespace
          .pod = .kubernetes.pod_name
          .container = .kubernetes.container_name
          .node = .kubernetes.pod_node_name
          .stream = .stream
          .app = if exists(.kubernetes.pod_labels."app.kubernetes.io/name") { to_string!(.kubernetes.pod_labels."app.kubernetes.io/name") } else if exists(.kubernetes.pod_labels.app) { to_string!(.kubernetes.pod_labels.app) } else { "unknown" }
          # Keep the log message as _msg for VictoriaLogs
          ._msg = .message
          # Timestamp
          ._time = .timestamp

    sinks:
      # Scrape target for the vector-internal VMPodScrape (port 9598).
      prometheus:
        type: prometheus_exporter
        inputs: ["internal_metrics"]
        address: "0.0.0.0:9598"

      victorialogs:
        type: http
        inputs: ["parse_logs"]
        uri: "http://victorialogs.monitoring.svc:9428/insert/jsonline?_stream_fields=namespace,pod,container,node,app&_msg_field=_msg&_time_field=_time"
        encoding:
          codec: json
        batch:
          max_bytes: 1048576
          timeout_secs: 5
        request:
          concurrency: 2
---
# VMPodScrape for Vector's own telemetry.
#
# Vector is a DaemonSet with no Service, so this selects pods directly.
# Gives: events in/out per component, error counts, buffer utilisation and
# sink lag — i.e. whether the log pipeline is actually keeping up.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: vector-internal
  namespace: monitoring
  labels:
    app.kubernetes.io/name: vector
    app.kubernetes.io/component: logging
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      # MUST match the DaemonSet's pod labels exactly — a selector that
      # matches nothing yields a scrape config with no targets and no error.
      app.kubernetes.io/name: vector
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
