---
# kustomization.yaml — kustomize entry point for the monitoring namespace.
#
# `kubectl apply -k k8s/clusters/glug-infra/monitoring`
#
# What lives here:
#   - The `monitoring` Namespace (with PodSecurity labels).
#   - The Tailscale LoadBalancer Service that exposes Grafana on the tailnet
#     as `grafana.<tailnet>.ts.net:3000`.
#
# What does NOT live here (managed by helmfile instead):
#   - The victoria-metrics-k8s-stack chart (VMSingle, VMAgent, VMAlert,
#     VMAlertmanager, Grafana, node-exporter, kube-state-metrics, and the
#     VictoriaMetrics operator).
#     These are installed by helmfile from
#     k8s/apps/victoria-metrics-k8s-stack/values.yaml + secrets.yaml.
#
# Also lives here (standalone monitoring resources using native VM CRDs):
#   - CNPG cluster VMPodScrape (scrapes Postgres instance metrics).
#   - CNPG pooler VMPodScrape (scrapes PgBouncer metrics).
#   - CNPG operator VMPodScrape (scrapes operator's own metrics).
#   - CNPG VMRule (upstream-recommended alert rules).
#   - ZFS VMRule (pool health, ARC efficiency, IO alerts).
#   - PXC VMServiceScrapes (mysqld_exporter + HAProxy stats).
#   - PXC VMRule (Galera health, flow control, storage alerts).
#   - RustFS VMServiceScrape (S3 API + node metrics via MinIO v2 API).
#   - RustFS VMRule (cluster health, capacity, S3 errors, healing).
#   - PVC storage VMRule (cluster-wide PVC capacity alerts).
#   - Laptop battery VMRule (AC power, charge level, health alerts).
#   - Blackbox exporter Deployment/Service/ConfigMap (synthetic probing).
#   - Endpoint VMProbe (OHC production endpoint HTTP probes).
#
# These resources are kustomize-managed because they are either
# infrastructure-wide (Namespace) or front-end glue not expressed by the
# upstream chart (Tailscale Service, custom scrape/rule objects).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: We intentionally do NOT set `namespace:` here. The namespace field
# is already explicit in each resource manifest.

labels:
  - pairs:
      app.kubernetes.io/part-of: victoria-metrics-k8s-stack
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  # Namespace declaration — must be applied first.
  - namespace.yaml
  # NetworkPolicies — default-deny + explicit allow rules.
  - networkpolicy.yaml
  # Tailscale LoadBalancer Service exposing Grafana on the tailnet under
  # MagicDNS name `grafana`.
  - tailscale-grafana-service.yaml
  # CNPG standalone monitoring resources (native VM CRDs).
  - cnpg-cluster-vmpodscrape.yaml
  - cnpg-pooler-vmpodscrape.yaml
  - cnpg-operator-vmpodscrape.yaml
  - cnpg-vmrules.yaml
  # ZFS host-level alerts — uses node_exporter's built-in ZFS collector.
  - zfs-vmrules.yaml
  # ZFS Grafana dashboard — auto-imported by Grafana's sidecar.
  - zfs-grafana-dashboard.yaml
  # RustFS (MinIO-compatible S3) monitoring resources.
  - rustfs-vmservicescrape.yaml
  - rustfs-vmrules.yaml
  - rustfs-grafana-dashboard.yaml
  # Cluster-wide PVC storage alerts.
  - pvc-storage-vmrules.yaml
  # Laptop battery monitoring.
  - laptop-battery-vmrules.yaml
  - laptop-battery-grafana-dashboard.yaml
  # ZRAM swap monitoring (textfile collector sourced from host sysfs).
  - zram-vmrules.yaml
  # Cloudprober — active synthetic endpoint monitoring.
  - cloudprober.yaml
  - cloudprober-vmservicescrape.yaml
  # Endpoint availability, latency, SSL, and SLO alerts (Cloudprober-based).
  - endpoint-vmrules.yaml
  # Endpoint uptime Grafana dashboard.
  - endpoint-grafana-dashboard.yaml
  # cAdvisor container metrics (scraped from kubelet's built-in cAdvisor).
  - cadvisor-vmnodescrape.yaml
  # VictoriaLogs — log storage + query engine.
  - victorialogs-deployment.yaml
  - victorialogs-grafana-datasource.yaml
  # Vector — log collector (DaemonSet shipping to VictoriaLogs).
  - vector-log-collector.yaml
  # Logs exploration Grafana dashboard.
  - logs-grafana-dashboard.yaml
  # GLUG Infra overview Grafana dashboard.
  - glug-infra-grafana-dashboard.yaml
  # jiralert — Jira incident lifecycle management (create/escalate/resolve).
  # - jiralert.yaml
