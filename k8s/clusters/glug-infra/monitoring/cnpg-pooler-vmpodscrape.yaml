---
# cnpg-pooler-vmpodscrape.yaml — VMPodScrape for CNPG PgBouncer pooler pods.
#
# Native VictoriaMetrics equivalent of the former PodMonitor.
# Targets PgBouncer pods on port 9127.
#
# Reference:
#   https://cloudnative-pg.io/documentation/current/monitoring/

apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: cnpg-pooler-rw
  namespace: monitoring
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: pgbouncer
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  namespaceSelector:
    matchNames:
      - cnpg-clusters
  selector:
    matchLabels:
      cnpg.io/poolerName: postgres-cluster-pooler-rw
  podMetricsEndpoints:
    - port: metrics
