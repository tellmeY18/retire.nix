---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  namespace: monitoring
  labels:
    app.kubernetes.io/name: victorialogs
    app.kubernetes.io/component: logs
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: victorialogs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victorialogs
    spec:
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:v1.50.0
          args:
            - "-storageDataPath=/vlogs-data"
            - "-retentionPeriod=14d"
            - "-httpListenAddr=:9428"
          ports:
            - name: http
              containerPort: 9428
          volumeMounts:
            - name: data
              mountPath: /vlogs-data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9428
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  selector:
    app.kubernetes.io/name: victorialogs
  ports:
    - name: http
      port: 9428
      targetPort: 9428
