---
# aggregator-deployment.yaml — Deployment for the Changala Aggregator.
#
# The Aggregator connects to the Bluesky Jetstream firehose, filters for
# Changala-relevant AT Protocol collections, and indexes records into
# PostgreSQL (CNPG) and a local SQLite cache.
#
# Traffic path (inbound):
#   changala.<tailnet>.ts.net:3000  (Tailscale Funnel / Ingress)
#     → ts-proxy pod
#     → changala-aggregator-svc ClusterIP (port 3000)
#     → this Deployment's pods (port 3000)
#
# Traffic path (outbound):
#   pod → jetstream1.us-east.bsky.network:443  (Bluesky Jetstream WebSocket)
#   pod → postgres-cluster-rw.cnpg-clusters:5432  (CNPG PostgreSQL)
#
# Security:
#   PSA restricted — non-root (UID 1000), all caps dropped, seccomp
#   RuntimeDefault, no privilege escalation.
#
# Secrets:
#   The `changala-aggregator-credentials` Secret is sops-encrypted and
#   applied separately via `sops --decrypt ... | kubectl apply -f -`.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: changala-aggregator
  namespace: changala
  labels:
    app.kubernetes.io/name: changala-aggregator
    app.kubernetes.io/component: aggregator
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changala-aggregator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changala-aggregator
        app.kubernetes.io/component: aggregator
        app.kubernetes.io/part-of: changala
    spec:
      # PSA restricted: non-root, seccomp, no privilege escalation.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: aggregator
          image: ghcr.io/changala-social/changala.app:v0.3.5
          command: ["changala-aggregator"]

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          # Non-secret env vars from the ConfigMap, secrets from the
          # sops-decrypted Secret.
          envFrom:
            - configMapRef:
                name: changala-aggregator-config
            - secretRef:
                name: changala-aggregator-credentials

          env:
            - name: RUST_LOG
              value: info

          volumeMounts:
            # atrg.toml — application configuration file.
            - name: config
              mountPath: /app/atrg.toml
              subPath: atrg.toml
              readOnly: true
            # nsswitch.conf — ensure DNS resolution works in distroless.
            - name: config
              mountPath: /etc/nsswitch.conf
              subPath: nsswitch.conf
              readOnly: true
            # Scratch space for the local SQLite cache.
            - name: data
              mountPath: /app/data

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

      volumes:
        - name: config
          configMap:
            name: changala-aggregator-config
        - name: data
          emptyDir: {}
