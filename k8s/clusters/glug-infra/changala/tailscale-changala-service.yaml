---
# tailscale-changala-service.yaml — Expose the Changala Ring HTTP API to the
# public internet via Tailscale Funnel + MagicDNS.
#
# Traffic path (public internet):
#   browser / client
#     → https://changala.<tailnet>.ts.net   (Tailscale Funnel, TLS terminated)
#     → ts-proxy pod                        (this Service, ts-managed)
#     → Changala Deployment pods            (port 3000, plain HTTP)
#
# Tailscale Funnel serves HTTPS on port 443. The ts-proxy terminates TLS
# and forwards plain HTTP to the targetPort (3000) on the app pod.
#
# The Tailscale operator watches Services with `spec.loadBalancerClass:
# tailscale` and provisions a ts-proxy StatefulSet that registers a device
# on the tailnet. The `tailscale.com/funnel: "true"` annotation enables
# public internet access via Funnel.
#
# Prerequisites:
#   - Tailscale Kubernetes operator installed (NixOS-bootstrapped).
#   - Tailscale operator OAuth credentials applied.
#   - Tailscale ACL: Funnel must be enabled for the tag (tag:k8s) in the
#     tailnet policy file under the "nodeAttrs" section:
#       { "target": ["tag:k8s"], "attr": ["funnel"] }

apiVersion: v1
kind: Service
metadata:
  name: changala-tailscale
  namespace: changala
  labels:
    app.kubernetes.io/name: changala
    app.kubernetes.io/component: tailnet-frontend
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # MagicDNS hostname: changala.<tailnet>.ts.net
    tailscale.com/hostname: "changala"
    tailscale.com/tags: "tag:k8s"
    # Enable Tailscale Funnel — exposes this service to the public internet
    # at https://changala.<tailnet>.ts.net. TLS is handled by Tailscale.
    tailscale.com/funnel: "true"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale

  # Select the Changala Deployment pods.
  selector:
    app.kubernetes.io/name: changala

  ports:
    # Funnel requires port 443. Tailscale terminates TLS and forwards
    # plain HTTP to targetPort 3000 on the app container.
    - name: https
      protocol: TCP
      port: 443
      targetPort: 3000
