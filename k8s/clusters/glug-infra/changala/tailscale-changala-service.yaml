---
# tailscale-changala-service.yaml — Expose Changala to the public internet
# via Tailscale Funnel, and on the tailnet via MagicDNS.
#
# Two resources:
#
# 1. ClusterIP Service — internal backend for the Ingress.
#    Only reachable inside the cluster.
#
# 2. Tailscale Ingress — the Tailscale operator provisions a ts-proxy that:
#    - Registers as `changala` on the tailnet (MagicDNS).
#    - Terminates TLS via `tailscale serve`.
#    - Enables Funnel for public internet access.
#    - Reverse-proxies HTTPS → http://changala-svc.changala:3000.
#
# Traffic path (public internet):
#   browser
#     → https://changala.<tailnet>.ts.net   (Tailscale Funnel, TLS terminated)
#     → ts-proxy pod                        (Ingress-managed, tailscale serve)
#     → changala-svc ClusterIP              (port 3000)
#     → Changala Deployment pods            (port 3000, plain HTTP)
#
# Traffic path (tailnet):
#   tailnet client
#     → https://changala.<tailnet>.ts.net   (MagicDNS, TLS terminated by ts-proxy)
#     → ts-proxy pod
#     → changala-svc ClusterIP → pods
#
# Prerequisites:
#   - Tailscale Kubernetes operator installed (NixOS-bootstrapped).
#   - Tailscale operator OAuth credentials applied.
#   - Tailscale ACL: Funnel enabled for tag:k8s:
#       { "target": ["tag:k8s"], "attr": ["funnel"] }

apiVersion: v1
kind: Service
metadata:
  name: changala-svc
  namespace: changala
  labels:
    app.kubernetes.io/name: changala
    app.kubernetes.io/component: internal-service
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: changala
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changala-tailscale
  namespace: changala
  labels:
    app.kubernetes.io/name: changala
    app.kubernetes.io/component: tailnet-frontend
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/tags: "tag:k8s"
spec:
  defaultBackend:
    service:
      name: changala-svc
      port:
        number: 3000
  ingressClassName: tailscale
  tls:
    - hosts:
        - changala
