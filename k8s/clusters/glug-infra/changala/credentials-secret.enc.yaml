# credentials-secret.enc.yaml — sops-encrypted Secret for the Changala app.
#
# Contains ONLY sensitive values. Non-sensitive config lives in the
# changala-config ConfigMap (configmap.yaml).
#
# Sensitive keys:
#   ATRG_APP__SECRET_KEY  — app session signing key
#   ATRG_DATABASE__URL    — framework database (same PG instance)
#   CHANGALA_DATABASE_URL — app-specific database URL
#   CHANGALA_S3_ACCESS_KEY / CHANGALA_S3_SECRET_KEY — RustFS credentials
#
# Decrypted and applied by `just k8s::apply`:
#   sops --decrypt credentials-secret.enc.yaml | kubectl apply -f -
#
# To edit:
#   just k8s::edit-secret clusters/glug-infra/changala/credentials-secret.enc.yaml
