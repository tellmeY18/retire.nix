# credentials-secret.enc.yaml — sops-encrypted Secret for the Changala app.
#
# Contains all sensitive values that the Changala Ring server needs:
#   - CHANGALA_DATABASE_URL: PostgreSQL connection string pointing at the
#     CNPG cluster (postgres-cluster-rw.cnpg-clusters.svc.cluster.local).
#   - CHANGALA_S3_*: RustFS (MinIO-compatible) S3 credentials for the
#     changala-blobs bucket.
#
# Decrypted and applied by `just k8s::apply`:
#   sops --decrypt credentials-secret.enc.yaml | kubectl apply -f -
#
# To edit:
#   just k8s::edit-secret clusters/glug-infra/changala/credentials-secret.enc.yaml
