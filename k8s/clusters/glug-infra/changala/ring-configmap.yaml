---
# ring-configmap.yaml — Non-sensitive config for the Changala Ring server.
#
# Contains:
#   - Environment variables consumed by the Ring binary via envFrom.
#   - The atrg.toml config file mounted at /app/atrg.toml.
#   - A custom nsswitch.conf to ensure DNS resolution works in the
#     distroless container (mounted at /etc/nsswitch.conf).
#
# Sensitive values (database URL, S3 credentials, secret key, SMTP password)
# are NOT here — they live in the changala-ring-credentials Secret
# (sops-encrypted, applied separately by `just k8s::apply`).
apiVersion: v1
kind: ConfigMap
metadata:
  name: changala-ring-config
  namespace: changala
  labels:
    app.kubernetes.io/name: changala-ring
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
data:
  ATRG_APP__NAME: "changala-ring"
  ATRG_APP__HOST: "0.0.0.0"
  ATRG_APP__PORT: "3000"
  ATRG_APP__ENVIRONMENT: "production"
  ATRG_APP__CORS_ORIGINS: "https://changala-app.pages.dev,http://localhost:5173"
  ATRG_AUTH__CLIENT_ID: "https://changala-ring.tail477f2f.ts.net/client-metadata.json"
  ATRG_AUTH__REDIRECT_URI: "https://changala-ring.tail477f2f.ts.net/auth/callback"
  ATRG_AUTH__POST_LOGIN_REDIRECT: "https://changala-app.pages.dev/login"
  ATRG_AUTH__SCOPE: "atproto transition:generic"
  CHANGALA_S3_ENDPOINT: "https://s3-1.tail477f2f.ts.net"
  CHANGALA_S3_BUCKET: "changala-blobs"
  CHANGALA_S3_REGION: "us-east-1"
  CHANGALA_S3_PATH_STYLE: "true"
  CHANGALA_ALLOWED_EMAIL_DOMAINS: "nitc.ac.in"
  CHANGALA_MCP_ENABLED: "true"

  nsswitch.conf: |
    hosts: files dns

  atrg.toml: |
    [app]
    name = "changala-ring"
    host = "0.0.0.0"
    port = 3000
    secret_key = "placeholder-overridden-by-env"
    cors_origins = ["https://changala-app.pages.dev", "http://localhost:5173"]
    environment = "production"

    [auth]
    client_id = "https://changala-ring.tail477f2f.ts.net/client-metadata.json"
    redirect_uri = "https://changala-ring.tail477f2f.ts.net/auth/callback"
    scope = "atproto transition:generic"

    [database]
    url = "sqlite:///app/data/atrg.db"

    [changala]
    database_url = "postgres://placeholder:placeholder@localhost:5432/changala_ring"
    allowed_email_domains = ["nitc.ac.in"]

    [changala.s3]
    endpoint = "http://placeholder:9000"
    bucket = "changala-blobs"
    region = "us-east-1"
    access_key = "placeholder"
    secret_key = "placeholder"
    path_style = true
