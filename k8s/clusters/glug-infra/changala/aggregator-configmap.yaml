---
# aggregator-configmap.yaml — Non-sensitive config for the Changala Aggregator.
apiVersion: v1
kind: ConfigMap
metadata:
  name: changala-aggregator-config
  namespace: changala
  labels:
    app.kubernetes.io/name: changala-aggregator
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
data:
  ATRG_APP__NAME: "changala-aggregator"
  ATRG_APP__HOST: "0.0.0.0"
  ATRG_APP__PORT: "3000"
  ATRG_APP__ENVIRONMENT: "production"
  ATRG_APP__CORS_ORIGINS: "https://changala-app.pages.dev,http://localhost:5173"

  nsswitch.conf: |
    hosts: files dns

  atrg.toml: |
    [app]
    name = "changala-aggregator"
    host = "0.0.0.0"
    port = 3000
    secret_key = "placeholder-overridden-by-env"
    cors_origins = ["https://changala-app.pages.dev", "http://localhost:5173"]
    environment = "production"

    [database]
    url = "sqlite:///app/data/atrg.db"

    [jetstream]
    host = "jetstream1.us-east.bsky.network"
    collections = [
        "app.changala.membership",
        "app.changala.keyword",
        "app.changala.note",
        "app.changala.vote",
        "app.changala.collectivenote.proposal",
        "app.changala.label",
        "app.changala.brain.node",
        "app.changala.brain.link",
    ]

    [changala]
    database_url = "postgres://placeholder:placeholder@localhost:5432/changala_aggregator"
