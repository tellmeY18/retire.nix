---
# aggregator-tailscale.yaml — Expose the Changala Aggregator on the public
# internet via Tailscale Funnel for frontend read endpoints.
#
# Traffic path (public internet):
#   browser (Cloudflare Pages frontend)
#     → https://changala.<tailnet>.ts.net   (Tailscale Funnel, TLS terminated)
#     → ts-proxy pod                         (Ingress-managed, tailscale serve)
#     → changala-aggregator-svc ClusterIP    (port 3000)
#     → Aggregator Deployment pods           (port 3000, HTTP API)
#
# The aggregator keeps the `changala` hostname (tls hosts: `changala`) so
# the existing `changala.<tailnet>.ts.net` URL continues to work for the
# frontend's read endpoints.
#
# Prerequisites:
#   - Tailscale Kubernetes operator installed.
#   - Tailscale ACL: Funnel enabled for tag:k8s.

apiVersion: v1
kind: Service
metadata:
  name: changala-aggregator-svc
  namespace: changala
  labels:
    app.kubernetes.io/name: changala-aggregator
    app.kubernetes.io/component: svc
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: changala-aggregator
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: changala-aggregator-tailscale
  namespace: changala
  labels:
    app.kubernetes.io/name: changala-aggregator
    app.kubernetes.io/component: tailscale-funnel
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/tags: "tag:k8s"
spec:
  defaultBackend:
    service:
      name: changala-aggregator-svc
      port:
        number: 3000
  ingressClassName: tailscale
  tls:
    - hosts:
        - changala
