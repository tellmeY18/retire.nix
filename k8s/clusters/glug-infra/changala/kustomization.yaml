---
# kustomization.yaml — kustomize entry point for the Changala app (Ring + Aggregator).
#
# `kubectl apply -k k8s/clusters/glug-infra/changala`
#
# Two deployments from the same image:
#   - changala-ring: write server (identity, courses, notes, brain, OAuth, S3)
#   - changala-aggregator: read server (feeds, search, graph, Jetstream firehose)
#
# Secrets (sops-encrypted) are applied separately by `just k8s::apply`:
#   sops --decrypt ring-credentials-secret.enc.yaml | kubectl apply -f -
#   sops --decrypt aggregator-credentials-secret.enc.yaml | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: changala

labels:
  - pairs:
      app.kubernetes.io/part-of: changala
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  # Ring
  - ring-configmap.yaml
  - ring-deployment.yaml
  - ring-tailscale.yaml
  # Aggregator
  - aggregator-configmap.yaml
  - aggregator-deployment.yaml
  - aggregator-tailscale.yaml
