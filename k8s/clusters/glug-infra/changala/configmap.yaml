---
# configmap.yaml — Non-sensitive environment variables for the Changala Ring server.
#
# Sensitive values (database password, S3 credentials, app secret key)
# live in the sops-encrypted credentials-secret.enc.yaml.
#
# The app reads ATRG_* env vars (framework config) and CHANGALA_* env vars
# (app-specific config). Both override atrg.toml values at runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: changala-config
  namespace: changala
  labels:
    app.kubernetes.io/name: changala
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: changala
    app.kubernetes.io/managed-by: kustomize
data:
  # --- Framework config (ATRG_*) ---
  ATRG_APP__NAME: "changala"
  ATRG_APP__HOST: "0.0.0.0"
  ATRG_APP__PORT: "3000"
  ATRG_APP__ENVIRONMENT: "production"
  ATRG_APP__CORS_ORIGINS: "*"
  ATRG_AUTH__CLIENT_ID: "https://changala.tail477f2f.ts.net/client-metadata.json"
  ATRG_AUTH__REDIRECT_URI: "https://changala.tail477f2f.ts.net/auth/callback"
  ATRG_AUTH__SCOPE: "atproto transition:generic"
  # ATRG_DATABASE__URL is in the Secret (contains password).

  # --- App config (CHANGALA_*) ---
  # CHANGALA_DATABASE_URL is in the Secret (contains password).
  CHANGALA_S3_ENDPOINT: "https://s3.tail477f2f.ts.net"
  CHANGALA_S3_BUCKET: "changala-blobs"
  CHANGALA_S3_REGION: "us-east-1"
  CHANGALA_S3_PATH_STYLE: "true"
  # CHANGALA_S3_ACCESS_KEY and CHANGALA_S3_SECRET_KEY are in the Secret.

  # --- Nix container support ---
  # Nix-built container images lack /etc/nsswitch.conf. Without it,
  # glibc's getaddrinfo() cannot resolve hostnames.
  nsswitch.conf: |
    hosts: files dns

  # --- Minimal atrg.toml skeleton ---
  # The atrg framework requires this file on disk at startup. All values
  # are overridden by ATRG_* and CHANGALA_* env vars at runtime.
  atrg.toml: |
    [app]
    name = "changala"
    host = "0.0.0.0"
    port = 3000
    secret_key = "placeholder-overridden-by-env"
    cors_origins = ["*"]
    environment = "production"

    [auth]
    client_id = "https://placeholder"
    redirect_uri = "https://placeholder"
    scope = "atproto transition:generic"

    [database]
    url = "sqlite:///app/data/atrg.db"

    [jetstream]
    host = "jetstream1.us-east.bsky.network"
    collections = [
        "app.changala.membership",
        "app.changala.keyword",
        "app.changala.note",
        "app.changala.vote",
        "app.changala.collectivenote.proposal",
        "app.changala.label",
        "app.changala.brain.node",
        "app.changala.brain.link",
    ]

    [changala]
    database_url = "postgres://placeholder:placeholder@localhost:5432/placeholder"

    [changala.s3]
    endpoint = "http://placeholder:9000"
    bucket = "placeholder"
    region = "us-east-1"
    access_key = "placeholder"
    secret_key = "placeholder"
    path_style = true
