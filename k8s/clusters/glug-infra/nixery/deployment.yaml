---
# Nixery — on-demand Nix-based container registry.
#
# Pull any combination of nixpkgs packages as a container image:
#   image: nixery.tail477f2f.ts.net:8080/shell/curl/jq/minio-client
#
# Layers are cached in RustFS S3 so repeated pulls are instant.
# First pull of a new combination takes 30-60s (Nix build).
#
# Docs: https://github.com/tazjin/nixery
apiVersion: v1
kind: Namespace
metadata:
  name: nixery
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nixery
  namespace: nixery
  labels:
    app.kubernetes.io/name: nixery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nixery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nixery
    spec:
      # kenobi = compute node (no persistent data needed for nixery)
      nodeSelector:
        kubernetes.io/hostname: kenobi
      containers:
        - name: nixery
          image: ghcr.io/tellmey18/nixery:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Use nixpkgs-unstable channel for packages
            - name: NIXERY_CHANNEL
              value: "nixpkgs-unstable"
            # S3-compatible storage backend (RustFS)
            - name: NIXERY_STORAGE_BACKEND
              value: "s3"
            - name: S3_BUCKET
              value: "nixery"
            - name: S3_ENDPOINT
              value: "http://rustfs-storage-io.rustfs-clusters.svc:9000"
            - name: AWS_REGION
              value: "us-east-1"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: nixery-s3
                  key: access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nixery-s3
                  key: secret-key
            # Build timeout (seconds)
            - name: NIX_TIMEOUT
              value: "120"
            # Port
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nixery-svc
  namespace: nixery
  labels:
    app.kubernetes.io/name: nixery
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nixery
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nixery-tailscale
  namespace: nixery
  labels:
    app.kubernetes.io/name: nixery
  annotations:
    tailscale.com/hostname: "nixery"
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: nixery
  ports:
    - name: http
      port: 8080
      targetPort: 8080
