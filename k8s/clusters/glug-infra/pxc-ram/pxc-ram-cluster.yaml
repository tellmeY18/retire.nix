---
# pxc-ram-cluster.yaml — Plain MySQL read replica on kenobi (aarch64).
#
# NOT managed by the PXC operator. This is a standalone Percona Server
# instance that receives async replication from the primary PXC cluster
# on chopper. ProxySQL routes SELECTs here for low-latency reads.
#
# Why plain MySQL instead of PXC operator?
#   - Single-node replica doesn't need Galera
#   - No operator init container OOM issues on arm64
#   - No operator reconciliation conflicts
#   - Full control over probes, resources, security context
#   - Less RAM overhead (no wsrep/gcache)
#
# Data persistence:
#   hostPath at /var/lib/pxc-ram on kenobi (created by NixOS systemd-tmpfiles).
#   Survives pod restarts AND node reboots. No SST needed.
#
# Replication:
#   Configured via mysql.slave_master_info (persists on hostPath).
#   On first boot: run the init-replication Job or manual setup.
#   On restarts: replication auto-resumes from last position.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-ram
  namespace: pxc-ram
  labels:
    app: mysql-ram
    app.kubernetes.io/name: percona-server
    app.kubernetes.io/component: replica
    app.kubernetes.io/part-of: percona-xtradb-cluster-ram
spec:
  serviceName: mysql-ram
  replicas: 1
  selector:
    matchLabels:
      app: mysql-ram
  template:
    metadata:
      labels:
        app: mysql-ram
        app.kubernetes.io/name: percona-server
        app.kubernetes.io/component: replica
        app.kubernetes.io/instance: mysql-ram
    spec:
      nodeSelector:
        kubernetes.io/hostname: kenobi

      securityContext:
        fsGroup: 1001

      containers:
        - name: mysql
          image: percona/percona-server:8.0.45
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/my.cnf.d/replica.cnf
              subPath: replica.cnf
          resources:
            requests:
              memory: "3Gi"
              cpu: "200m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

        - name: prewarm
          image: percona/percona-server:8.0.45
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL to be ready..."
              for i in $(seq 1 60); do
                if mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent 2>/dev/null; then
                  echo "MySQL is up, prewarming ALL user tables into buffer pool..."
                  # Dynamically discover and scan all tables in all user databases.
                  # This ensures new databases added in the future are also prewarmed.
                  mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "
                    SELECT CONCAT('SELECT COUNT(*) FROM \`', table_schema, '\`.\`', table_name, '\`;')
                    FROM information_schema.tables
                    WHERE table_schema NOT IN ('information_schema','performance_schema','sys','mysql')
                      AND table_type = 'BASE TABLE';
                  " 2>/dev/null | mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" 2>/dev/null
                  echo "Buffer pool prewarmed. Sleeping."
                  break
                fi
                sleep 2
              done
              # Stay alive (sidecar must keep running or pod restarts)
              exec sleep infinity
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-ram-root
                  key: password
                  optional: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"

      volumes:
        - name: datadir
          hostPath:
            path: /var/lib/pxc-ram
            type: Directory
        - name: config
          configMap:
            name: mysql-ram-config
---
# Headless Service for the StatefulSet (DNS: mysql-ram-0.mysql-ram.pxc-ram.svc)
apiVersion: v1
kind: Service
metadata:
  name: mysql-ram
  namespace: pxc-ram
  labels:
    app: mysql-ram
spec:
  clusterIP: None
  selector:
    app: mysql-ram
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
# ClusterIP Service for ProxySQL to target (stable endpoint).
apiVersion: v1
kind: Service
metadata:
  name: mysql-ram-pxc
  namespace: pxc-ram
  labels:
    app: mysql-ram
spec:
  type: ClusterIP
  selector:
    app: mysql-ram
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
