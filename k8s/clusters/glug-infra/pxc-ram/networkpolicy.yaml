---
# networkpolicy.yaml — NetworkPolicies for the pxc-ram namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: pxc-ram
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress to the MySQL replica from ProxySQL, monitoring, and intra-namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-ram-ingress
  namespace: pxc-ram
spec:
  podSelector:
    matchLabels:
      app: mysql-ram
  policyTypes:
    - Ingress
  ingress:
    - from:
        # ProxySQL sends read queries.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: proxysql
        # Monitoring scrapes metrics.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # Intra-namespace (debug pods, etc.)
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3306
