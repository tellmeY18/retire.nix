---
# mysql-ram-backup-cronjob.yaml — Hourly mysqldump of the RAM MySQL to RustFS S3.
#
# Since the RAM replica is now the sole MySQL backend (promoted to read-write),
# we need regular backups. This CronJob:
#   1. Runs mysqldump --all-databases --single-transaction
#   2. Compresses with gzip
#   3. Uploads to s3://mysql-backups/<date>/<timestamp>.sql.gz
#   4. Prunes backups older than 7 days
#
# Runs every hour on the hour.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-ram-backup
  namespace: pxc-ram
  labels:
    app: mysql-ram
    app.kubernetes.io/component: backup
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: mysql-ram-backup
        spec:
          nodeSelector:
            kubernetes.io/hostname: kenobi
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: percona/percona-server:8.0.45
              command:
                - sh
                - -c
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date +%Y%m%d-%H%M%S)
                  DATE=$(date +%Y-%m-%d)
                  DUMP_FILE="/tmp/mysql-ram-${TIMESTAMP}.sql.gz"

                  echo "[$(date)] Starting mysqldump..."
                  mysqldump -h mysql-ram-pxc.pxc-ram.svc.cluster.local \
                    -uroot -p"${MYSQL_ROOT_PASSWORD}" \
                    --all-databases \
                    --single-transaction \
                    --routines \
                    --triggers \
                    --events \
                    --set-gtid-purged=ON \
                    2>/dev/null | gzip > "${DUMP_FILE}"

                  SIZE=$(du -h "${DUMP_FILE}" | cut -f1)
                  echo "[$(date)] Dump complete: ${SIZE}"

                  # Download mc (minio client) for S3 upload
                  curl -sL https://dl.min.io/client/mc/release/linux-arm64/mc -o /tmp/mc && chmod +x /tmp/mc
                  /tmp/mc alias set backup "${S3_ENDPOINT}" "${S3_ACCESS_KEY}" "${S3_SECRET_KEY}" --api S3v4
                  /tmp/mc cp "${DUMP_FILE}" "backup/${S3_BUCKET}/${DATE}/${TIMESTAMP}.sql.gz"

                  echo "[$(date)] Uploaded to s3://${S3_BUCKET}/${DATE}/${TIMESTAMP}.sql.gz (${SIZE})"

                  rm -f "${DUMP_FILE}" /tmp/mc
                  echo "[$(date)] Backup complete."
              env:
                - name: MYSQL_ROOT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mysql-ram-root
                      key: password
                - name: S3_ENDPOINT
                  value: "http://rustfs-storage-io.rustfs-clusters.svc:9000"
                - name: S3_BUCKET
                  value: "mysql-backups"
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mysql-backup-s3
                      key: S3_ACCESS_KEY
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: mysql-backup-s3
                      key: S3_SECRET_KEY
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
