---
# kustomization.yaml — kustomize entry point for the PXC RAM replica.
#
# `kubectl apply -k k8s/clusters/glug-infra/pxc-ram`
#
# Deploys a single-node PXC cluster on kenobi (aarch64) using RAM-backed
# emptyDir storage. Receives async replication from the primary PXC cluster
# on chopper. Used as a low-latency read node and disaster recovery standby.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pxc-ram

labels:
  - pairs:
      app.kubernetes.io/part-of: percona-xtradb-cluster-ram
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - limitrange.yaml
  - networkpolicy.yaml
  - pxc-ram-cluster.yaml
