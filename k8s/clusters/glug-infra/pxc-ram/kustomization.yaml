---
# kustomization.yaml — kustomize entry point for the PXC RAM replica.
#
# `kubectl apply -k k8s/clusters/glug-infra/pxc-ram`
#
# Deploys a plain Percona Server 8.0 instance on kenobi (aarch64) as an
# async read replica. NOT managed by the PXC operator — just a StatefulSet
# with hostPath storage and a ConfigMap for MySQL config.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pxc-ram

labels:
  - pairs:
      app.kubernetes.io/part-of: percona-xtradb-cluster-ram
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - mysql-ram-config.yaml
  - pxc-ram-cluster.yaml
