---
# mysql-ram-config.yaml — MySQL configuration for the read replica.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-ram-config
  namespace: pxc-ram
  labels:
    app: mysql-ram
data:
  replica.cnf: |
    [mysqld]
    # --- Server identity ---
    server-id=200
    report-host=mysql-ram-0

    # --- Replication (async replica from primary) ---
    gtid-mode=ON
    enforce-gtid-consistency=ON
    relay-log=mysql-ram-relay-bin
    relay-log-recovery=ON
    replica-preserve-commit-order=ON

    # --- Read-only (ProxySQL only sends SELECTs here) ---
    read-only=ON
    super-read-only=ON

    # --- InnoDB tuned for reads (buffer pool > dataset) ---
    innodb-buffer-pool-size=2G
    innodb-log-file-size=256M
    innodb-flush-method=O_DIRECT
    innodb-flush-neighbors=0
    innodb-doublewrite=0
    innodb-io-capacity=2000
    innodb-io-capacity-max=4000

    # --- Connections ---
    max-connections=500
    character-set-server=utf8mb4
    collation-server=utf8mb4_unicode_ci

    # --- Logging ---
    slow-query-log=ON
    long-query-time=1

    # --- Binary logging (needed for GTID replication) ---
    log-bin=mysql-ram-bin
    binlog-format=ROW
    binlog-expire-logs-seconds=86400
    log-replica-updates=ON

    # --- Buffer pool prewarm (auto-save/restore on restart) ---
    innodb-buffer-pool-dump-at-shutdown=ON
    innodb-buffer-pool-load-at-startup=ON
    innodb-buffer-pool-dump-pct=100
