---
# kustomization.yaml — Penpot kustomize resources.
#
# What lives here (kustomize-managed — pure k8s types, no CRD dependency):
#   - Namespace (with PSA labels)
#   - Standalone Valkey for pub/sub / sessions
#   - NetworkPolicies
#   - Traefik IngressRoute (public HTTPS)
#   - Tailscale Funnel Ingress (tailnet HTTPS)
#
# What lives in helmfile instead (k8s/apps/penpot/):
#   - penpot/penpot Helm chart — Backend, Frontend, Exporter Deployments,
#     Services, ServiceAccount, and all associated config/credential Secrets.
#
# Apply order:
#   kubectl apply -k clusters/glug-infra/penpot   ← this file (first)
#   helmfile sync                                  ← Helm chart (second)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: penpot

labels:
  - pairs:
      app.kubernetes.io/part-of: penpot
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - valkey.yaml
  - networkpolicy.yaml
  - tailscale-service.yaml
