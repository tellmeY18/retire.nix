---
# Traefik IngressRoute for Penpot.
# Public URL: https://pot.tellmey.fyi
# TLS: Let's Encrypt via Traefik ACME.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: penpot-traefik
  namespace: penpot
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`pot.tellmey.fyi`)
      kind: Rule
      services:
        - name: penpot
          port: 8080
  tls:
    certResolver: letsencrypt
---
# HTTP → HTTPS redirect for Penpot.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: penpot-traefik-redirect
  namespace: penpot
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`pot.tellmey.fyi`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: traefik-system
      services:
        - name: penpot
          port: 8080
