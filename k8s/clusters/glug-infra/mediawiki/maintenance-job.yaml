---
# maintenance-job.yaml — One-shot Job for MediaWiki maintenance/update.php.
#
# Runs independently of the MediaWiki pods. Connects DIRECTLY to the
# primary MySQL (bypasses ProxySQL) to avoid read-only replica issues.
#
# Usage:
#   kubectl apply -f k8s/clusters/glug-infra/mediawiki/maintenance-job.yaml
#   kubectl logs -n mediawiki -l job-name=mw-update -f
#   kubectl delete job mw-update -n mediawiki  # cleanup after
apiVersion: batch/v1
kind: Job
metadata:
  name: mw-update
  namespace: mediawiki
  labels:
    app.kubernetes.io/name: mediawiki
    app.kubernetes.io/component: maintenance
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediawiki
        app.kubernetes.io/component: maintenance
        app.kubernetes.io/part-of: mediawiki
    spec:
      restartPolicy: Never
      # Must run on kenobi so it shares the same hostPath .smw.json with the
      # web pods (all hard-pinned to kenobi). Without this the Job's setup
      # marker would land on a different node and the pods wouldn't see it.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - kenobi
      containers:
        - name: update
          image: ghcr.io/tellmey18/mediawiki:build-55
          command:
            - sh
            - -c
            - |
              echo "=== MediaWiki update.php (direct to primary DB) ==="
              echo "DB Host: $MW_DB_HOST"
              # SemanticMediaWiki is already enabled in the base LocalSettings,
              # so no extra wfLoadExtension is needed (re-loading would fatal).
              php /var/www/html/maintenance/run.php update --quick
              echo "=== SMW setupStore (sets up store in the shared DB) ==="
              php /var/www/html/extensions/SemanticMediaWiki/maintenance/setupStore.php
              # Write the shared sentinel so the deployment's init containers
              # skip their own setupStore on the next rollout (no OPTIMIZE).
              mkdir -p /smw-config && touch /smw-config/.setup-done
              chmod -R a+rwX /smw-config 2>/dev/null || true
              echo "=== Done (exit: $?) ==="
          env:
            # Connect DIRECTLY to primary MySQL — bypass ProxySQL entirely.
            - name: MW_DB_HOST
              value: "mysql-ram-pxc.pxc-ram.svc.cluster.local"
            - name: MW_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mediawiki-credentials
                  key: MW_DB_PASSWORD
            - name: MW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mediawiki-credentials
                  key: MW_SECRET_KEY
            - name: MW_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mediawiki-credentials
                  key: MW_S3_ACCESS_KEY
            - name: MW_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mediawiki-credentials
                  key: MW_S3_SECRET_KEY
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
            - name: smw-config
              mountPath: /smw-config
      volumes:
        - name: localsettings
          configMap:
            name: mediawiki-localsettings
        - name: smw-config
          hostPath:
            path: /var/lib/mediawiki/smw-config
            type: DirectoryOrCreate
---
# ConfigMap that overrides DB settings for maintenance jobs.
# This is loaded via MaintenanceSettings.php which is auto-loaded
# by MediaWiki when present.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediawiki-maintenance-override
  namespace: mediawiki
data:
  MaintenanceSettings.php: |
    <?php
    # Override DB host to connect directly to primary (bypass ProxySQL).
    # This file is only loaded by maintenance scripts, not web requests.
    $wgDBserver = getenv('MW_DB_HOST') ?: 'mysql-ram-pxc.pxc-ram.svc.cluster.local';
    $wgDBservers = [
        [
            'host' => $wgDBserver,
            'dbname' => 'mediawiki',
            'user' => 'mediawiki',
            'password' => getenv('MW_DB_PASSWORD'),
            'type' => 'mysql',
            'flags' => DBO_DEFAULT,
        ],
    ];
