---
# MediaWiki — stateless deployment with nginx sidecar.
# Images stored in RustFS S3, database in PXC MySQL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediawiki
  namespace: mediawiki
  labels:
    app.kubernetes.io/name: mediawiki
    app.kubernetes.io/part-of: mediawiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mediawiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediawiki
        app.kubernetes.io/part-of: mediawiki
    spec:
      containers:
        # Nginx sidecar — serves static files + proxies PHP to FPM
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: mediawiki-data
              mountPath: /var/www/html
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

        # MediaWiki FPM
        - name: mediawiki
          image: ghcr.io/tellmey18/mediawiki:latest
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: mediawiki-data
              mountPath: /var/www/html
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi

      volumes:
        - name: nginx-config
          configMap:
            name: mediawiki-nginx
        - name: localsettings
          configMap:
            name: mediawiki-localsettings
        - name: mediawiki-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mediawiki-svc
  namespace: mediawiki
spec:
  selector:
    app.kubernetes.io/name: mediawiki
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
---
# Nginx ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediawiki-nginx
  namespace: mediawiki
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;

        location /images {
            add_header X-Content-Type-Options "nosniff";
        }

        location /resources {
            add_header X-Content-Type-Options "nosniff";
        }

        location / {
            try_files $uri $uri/ /index.php;
        }

        location ~ ^/(index|load|api|thumb|opensearch_desc|img_auth)\.php$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
        }

        location ~ ^/rest\.php(/.*)?$ {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/rest.php;
            fastcgi_param PATH_INFO $1;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
        }

        location /images/deleted/ {
            deny all;
        }

        location ~ /\.ht {
            deny all;
        }
    }
