---
# MediaWiki — stateless deployment (Caddy + PHP-FPM, single container).
# Images stored in RustFS S3, database in PXC MySQL (on chopper via tailnet).
# Redis + file cache absorb >95% of reads; only cache misses hit the DB.
# Pinned to kenobi (compute node) — chopper is unreliable for sustained load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediawiki
  namespace: mediawiki
  labels:
    app.kubernetes.io/name: mediawiki
    app.kubernetes.io/part-of: mediawiki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mediawiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediawiki
        app.kubernetes.io/part-of: mediawiki
    spec:
      # Hard-pinned to kenobi — single big pod, hostPath for SMW config
      # requires all pods on the same node.
      nodeSelector:
        kubernetes.io/hostname: kenobi
      initContainers:
        # Verifies DB connectivity and runs one-time SMW store bootstrap.
        # NOTE: DB schema migrations (update.php) are NOT run here — they
        # caused a fatal death spiral: update.php acquires table locks,
        # blocking other pods' requests → probes fail → pods killed →
        # their init containers also run update.php → more locks.
        # Run migrations via: kubectl apply -f maintenance-job.yaml
        # (only needed after deployments with schema changes).
        - name: db-migrate
          image: ghcr.io/tellmey18/mediawiki:build-64
          command:
            - sh
            - -c
            - |
              echo "=== DB connectivity check ==="
              php -r '
                try {
                  $m = new mysqli(getenv("MW_DB_HOST") ?: "mysql-mediawiki-db.mysql-mediawiki.svc.cluster.local",
                    "mediawiki", getenv("MW_DB_PASSWORD"), "mediawiki");
                  echo "DB: OK (" . $m->stat() . ")\n";
                  $m->close();
                } catch (Throwable $e) {
                  echo "DB: " . $e->getMessage() . "\n";
                  exit(1);
                }
              '
              # One-time SMW store bootstrap. SMW 7.0 keeps its real setup
              # marker in the DATABASE (shared by all pods), so we gate on our
              # own sentinel file on the shared hostPath. setupStore runs ONLY
              # when the sentinel is absent; flock serialises concurrent inits
              # (HPA scale-ups, scale-from-zero) so exactly one pod ever runs
              # the locking OPTIMIZE at a time. Once the sentinel exists,
              # routine restarts skip setupStore entirely — no OPTIMIZE, no
              # smw_* table lock, no 502 cascade.
              mkdir -p /smw-config
              chmod 0777 /smw-config 2>/dev/null || true
              (
                flock 9
                if [ ! -f /smw-config/.setup-done ]; then
                  echo "=== SMW cold bootstrap: running setupStore (one-time) ==="
                  # --skip-optimize prevents table locks that block all MediaWiki requests.
                  # Table optimization runs separately via the weekly CronJob.
                  if php -d memory_limit=512M /var/www/html/extensions/SemanticMediaWiki/maintenance/setupStore.php --skip-optimize 2>&1 | tail -15; then
                    touch /smw-config/.setup-done
                    echo "=== setupStore complete; sentinel written ==="
                  fi
                else
                  echo "=== SMW already set up (sentinel present) — skipping setupStore ==="
                fi
              ) 9>/smw-config/.setup.lock
          env:
            - name: MW_DB_HOST
              value: "mysql-mediawiki-db.mysql-mediawiki.svc.cluster.local"
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
            - name: smw-config
              mountPath: /smw-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "25m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: mediawiki
          image: ghcr.io/tellmey18/mediawiki:build-64
          command:
            - sh
            - -c
            - |
              # SMW store setup is handled once by the db-migrate init
              # container (guarded by the shared .smw.json marker), NOT here.
              # Running setupStore on every pod boot is what caused the
              # OPTIMIZE-TABLE lock cascade. The web container just serves.
              exec supervisord -c /etc/supervisord.conf
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: MW_DB_HOST
              value: "mysql-mediawiki-db.mysql-mediawiki.svc.cluster.local"
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
            - name: smw-config
              mountPath: /smw-config
            # Override the image's healthcheck.php — the lightweight ConfigMap
            # version avoids DB/Redis calls that can't get a worker during
            # pool saturation, preventing cascading liveness failures.
            - name: healthcheck
              mountPath: /var/www/html/healthcheck.php
              subPath: healthcheck.php
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /healthcheck.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            # Increased from 5s — the old timeout was too tight during
            # pool saturation. The new healthcheck is ~1ms, but K8s
            # connection setup + pod CPU contention need more headroom.
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api.php?action=query&meta=siteinfo&format=json
              port: 80
            initialDelaySeconds: 15
            # Increased from 15s to 30s — the api.php query can be slow
            # when all workers are saturated; the old 15s period meant
            # 45s total (3 failures) was too aggressive.
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthcheck.php
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30

        # Dedicated job runner — continuously drains the MW job queue.
        # Handles HTMLCacheUpdate (template purges), CirrusSearch indexing,
        # and all other async jobs. Replaces $wgJobRunRate on web requests.
        - name: jobrunner
          image: ghcr.io/tellmey18/mediawiki:build-64
          command:
            - sh
            - -c
            - |
              while true; do
                php /var/www/html/maintenance/run.php runJobs --maxjobs=50 --maxtime=30 2>&1 || echo "[jobrunner] Error, retrying in 10s..."
                sleep 2
              done
          env:
            - name: MW_DB_HOST
              value: "mysql-mediawiki-db.mysql-mediawiki.svc.cluster.local"
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
            - name: smw-config
              mountPath: /smw-config
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: localsettings
          configMap:
            name: mediawiki-localsettings
        # Simplified liveness healthcheck — replaces the image's
        # healthcheck.php which does heavyweight DB + Redis checks.
        # The full dependency check is done by the readiness probe.
        - name: healthcheck
          configMap:
            name: mediawiki-healthcheck
        # Shared SMW config/marker directory. hostPath is safe here because
        # the single MediaWiki pod is hard-pinned to kenobi via nodeSelector,
        # so the pod + the maintenance Job (also pinned to kenobi) see the
        # same .smw.json. This makes SMW setupStore a run-once operation.
        - name: smw-config
          hostPath:
            path: /var/lib/mediawiki/smw-config
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: mediawiki-svc
  namespace: mediawiki
spec:
  selector:
    app.kubernetes.io/name: mediawiki
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
