---
# MediaWiki — stateless deployment (Caddy + PHP-FPM, single container).
# Images stored in RustFS S3, database in PXC MySQL (on chopper via tailnet).
# Redis + file cache absorb >95% of reads; only cache misses hit the DB.
# Pinned to kenobi (compute node) — chopper is unreliable for sustained load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediawiki
  namespace: mediawiki
  labels:
    app.kubernetes.io/name: mediawiki
    app.kubernetes.io/part-of: mediawiki
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mediawiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediawiki
        app.kubernetes.io/part-of: mediawiki
    spec:
      nodeSelector:
        node-role.glug.infra/compute: "true"
      containers:
        - name: mediawiki
          image: ghcr.io/tellmey18/mediawiki:build-42
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthcheck.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthcheck.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health.txt
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 5
            failureThreshold: 30

        # Dedicated job runner — continuously drains the MW job queue.
        # Handles HTMLCacheUpdate (template purges), CirrusSearch indexing,
        # and all other async jobs. Replaces $wgJobRunRate on web requests.
        - name: jobrunner
          image: ghcr.io/tellmey18/mediawiki:build-42
          command:
            - sh
            - -c
            - |
              while true; do
                php /var/www/html/maintenance/run.php runJobs --maxjobs=50 --maxtime=30 2>&1
                # Sleep 2s between batches to avoid starving the DB
                sleep 2
              done
          env:
            # Jobs do writes (INSERT, UPDATE) — bypass ProxySQL and connect
            # directly to the primary via HAProxy to avoid read-only issues.
            - name: MW_DB_HOST
              value: "mysql-pxc-db-haproxy.pxc-clusters.svc.cluster.local"
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: localsettings
          configMap:
            name: mediawiki-localsettings
---
apiVersion: v1
kind: Service
metadata:
  name: mediawiki-svc
  namespace: mediawiki
spec:
  selector:
    app.kubernetes.io/name: mediawiki
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
