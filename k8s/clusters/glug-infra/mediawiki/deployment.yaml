---
# MediaWiki — stateless deployment (Caddy + PHP-FPM, single container).
# Images stored in RustFS S3, database in PXC MySQL (on chopper via tailnet).
# Redis + file cache absorb >95% of reads; only cache misses hit the DB.
# Pinned to kenobi (compute node) — chopper is unreliable for sustained load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediawiki
  namespace: mediawiki
  labels:
    app.kubernetes.io/name: mediawiki
    app.kubernetes.io/part-of: mediawiki
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mediawiki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mediawiki
        app.kubernetes.io/part-of: mediawiki
    spec:
      # Pin to kenobi (cloud VM, always available). MediaWiki must never
      # run on c3po/chopper which are laptops subject to power/network loss.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - kenobi
      initContainers:
        # Runs DB migrations BEFORE web containers start.
        # Ensures schema is always up-to-date on every deploy.
        # Connects directly to primary MySQL (bypasses ProxySQL).
        - name: db-migrate
          image: ghcr.io/tellmey18/mediawiki:build-48
          command:
            - sh
            - -c
            - |
              echo "=== Running MediaWiki update.php ==="
              MW_SKIP_EXTERNAL_DEPENDENCIES=1 php -d memory_limit=512M /var/www/html/maintenance/run.php update --quick 2>&1 | tail -10 || true
              echo "=== Migrations complete ==="
          env:
            - name: MW_DB_HOST
              value: "mysql-ram-pxc.pxc-ram.svc.cluster.local"
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      containers:
        - name: mediawiki
          image: ghcr.io/tellmey18/mediawiki:build-48
          command:
            - sh
            - -c
            - |
              # Run SMW setup — retry until DB is reachable (handles pod starting before DB)
              echo "Running SemanticMediaWiki setupStore..."
              for i in $(seq 1 5); do
                php -d memory_limit=512M /var/www/html/extensions/SemanticMediaWiki/maintenance/setupStore.php 2>&1 && break
                echo "Attempt $i failed, retrying in 5s..."
                sleep 5
              done
              exec supervisord -c /etc/supervisord.conf
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: MW_DB_HOST
              value: "mysql-ram-pxc.pxc-ram.svc.cluster.local"
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthcheck.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api.php?action=query&meta=siteinfo&format=json
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthcheck.php
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30

        # Dedicated job runner — continuously drains the MW job queue.
        # Handles HTMLCacheUpdate (template purges), CirrusSearch indexing,
        # and all other async jobs. Replaces $wgJobRunRate on web requests.
        - name: jobrunner
          image: ghcr.io/tellmey18/mediawiki:build-48
          command:
            - sh
            - -c
            - |
              while true; do
                php /var/www/html/maintenance/run.php runJobs --maxjobs=50 --maxtime=30 2>&1 || echo "[jobrunner] Error, retrying in 10s..."
                sleep 2
              done
          env:
            - name: MW_DB_HOST
              value: "mysql-ram-pxc.pxc-ram.svc.cluster.local"
          envFrom:
            - secretRef:
                name: mediawiki-credentials
          volumeMounts:
            - name: localsettings
              mountPath: /var/www/html/LocalSettings.php
              subPath: LocalSettings.php
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

      volumes:
        - name: localsettings
          configMap:
            name: mediawiki-localsettings
---
apiVersion: v1
kind: Service
metadata:
  name: mediawiki-svc
  namespace: mediawiki
spec:
  selector:
    app.kubernetes.io/name: mediawiki
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
