---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mediawiki
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress to MediaWiki pods on port 80 from:
#   1. Anubis in the traefik-system namespace (the PoW reverse-proxy)
#   2. Other pods in the mediawiki namespace (maintenance jobs, etc.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mediawiki-ingress
  namespace: mediawiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mediawiki
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik-system
        - podSelector: {} # intra-namespace pods
      ports:
        - port: 80
          protocol: TCP
---
# Allow ingress to OpenSearch from any mediawiki-part-of pod (includes CronJobs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opensearch-ingress
  namespace: mediawiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: mediawiki
      ports:
        - port: 9200
          protocol: TCP
        - port: 9300
          protocol: TCP
---
# Egress for all mediawiki-part-of pods (deployment + jobs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mediawiki-egress
  namespace: mediawiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: mediawiki
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # MySQL (PXC HAProxy)
    - ports:
        - port: 3306
          protocol: TCP
    # RustFS S3
    - ports:
        - port: 9000
          protocol: TCP
    # HTTPS (external)
    - ports:
        - port: 443
          protocol: TCP
    # HTTP (internal — mediawiki-svc for cache warming)
    - ports:
        - port: 80
          protocol: TCP
    # OpenSearch (CirrusSearch)
    - ports:
        - port: 9200
          protocol: TCP
    # Redis (object/parser/session cache)
    - ports:
        - port: 6379
          protocol: TCP
    # SMTP (Gmail — email confirmation, password reset)
    - ports:
        - port: 465
          protocol: TCP
        - port: 587
          protocol: TCP
---
# Allow ingress to Redis from any mediawiki-part-of pod (includes CronJobs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-ingress
  namespace: mediawiki
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: mediawiki
      ports:
        - port: 6379
          protocol: TCP
