---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediawiki-localsettings
  namespace: mediawiki
data:
  LocalSettings.php: |
    <?php
    if ( !defined( 'MEDIAWIKI' ) ) { exit; }

    ## MW 1.45 compatibility shim
    # MediaWiki 1.45 removed the global `Html` class alias (the class moved to
    # MediaWiki\Html\Html). Several extensions (Mermaid, Maps,
    # SemanticResultFormats) still do `use Html;` and fatal with
    # "Class Html not found". Restore the alias so they load. Safe: it only
    # points the legacy name at the namespaced class.
    if ( !class_exists( 'Html' ) ) {
        class_alias( 'MediaWiki\Html\Html', 'Html' );
    }

    ## Core settings
    $wgSitename = "WIKI FOSSCELL NITC";
    $wgMetaNamespace = "WIKI_FOSSCELL_NITC";
    $wgScriptPath = "";
    $wgServer = "https://wiki.fosscell.org";
    $wgResourceBasePath = $wgScriptPath;
    $wgFavicon = "$wgResourceBasePath/favicon.svg";
    $wgLogos = [
        '1x' => "$wgResourceBasePath/favicon.svg",
        'icon' => "$wgResourceBasePath/favicon.svg",
    ];

    ## Database
    $wgDBtype = "mysql";
    $wgDBserver = getenv('MW_DB_HOST') ?: "mysql-mediawiki-db.mysql-mediawiki.svc.cluster.local";
    $wgDBname = "mediawiki";
    $wgDBuser = "mediawiki";
    $wgDBpassword = getenv('MW_DB_PASSWORD');
    $wgDBprefix = "";
    $wgDBTableOptions = "ENGINE=InnoDB, DEFAULT CHARSET=binary";

    # Tolerate cross-tailnet latency on cache misses — don't let a slow
    # DB connect kill the entire request. 10s connect + 30s query is
    # enough for the worst case while still failing fast if MySQL is down.
    $wgDBservers = [
        [
            'host' => getenv('MW_DB_HOST') ?: 'mysql-mediawiki-db.mysql-mediawiki.svc.cluster.local',
            'dbname' => 'mediawiki',
            'user' => 'mediawiki',
            'password' => getenv('MW_DB_PASSWORD'),
            'type' => 'mysql',
            'flags' => DBO_DEFAULT,
            'load' => 1,
            'connTimeout' => 10,
            'queryTimeout' => 30,
        ],
    ];

    ## Shared memory / caching
    # Redis — primary cache backend for all MW caches.
    # Colocated on the same node as MediaWiki pods (kenobi).
    $wgObjectCaches['redis'] = [
        'class' => 'RedisBagOStuff',
        'servers' => [ 'redis.mediawiki.svc.cluster.local:6379' ],
        'persistent' => true,
        'connectTimeout' => 1,
    ];
    $wgMainCacheType = 'redis';
    $wgParserCacheType = 'redis';
    $wgSessionCacheType = 'redis';
    $wgMessageCacheType = 'redis';

    # Localization cache — store in Redis instead of DB to avoid
    # cross-tailnet DB queries for every REST API request.
    $wgLocalisationCacheConf = [
        'class' => 'LocalisationCache',
        'store' => 'array',  # Fastest: keeps l10n in PHP memory (APCu backed)
    ];

    # Parser cache expiry — 7 days (covers most anon traffic without DB hit)
    $wgParserCacheExpireTime = 604800;

    # Reduce cache TTL for pages with Cargo queries (dynamic content).
    # Pages using {{#cargo_query:}} get a 5-minute cache instead of 7 days,
    # so new submissions appear quickly without manual purging.
    $wgHooks['ParserAfterTidy'][] = function( &$parser, &$text ) {
        if ( strpos( $text, 'cargoTable' ) !== false || strpos( $text, 'cargo_query' ) !== false ) {
            $parser->getOutput()->updateCacheExpiry( 300 ); // 5 minutes
        }
    };

    # Auto-purge the magazine when a submission is saved.
    # Cargo does NOT re-render pages that *query* a table when a new row is
    # added, so 2026:Magazine would otherwise show stale results until its
    # own cache expired. Whenever a User:*/Magazine/* page is saved, purge
    # the magazine page so the new entry appears immediately.
    $wgHooks['PageSaveComplete'][] = function ( $wikiPage, $userIdentity, $summary, $flags, $revisionRecord, $editResult ) {
        $title = $wikiPage->getTitle();
        if ( $title->getNamespace() === NS_USER && strpos( $title->getText(), '/Magazine/' ) !== false ) {
            $services = \MediaWiki\MediaWikiServices::getInstance();
            $magTitle = $services->getTitleFactory()->newFromText( '2026:Magazine' );
            if ( $magTitle && $magTitle->exists() ) {
                $services->getWikiPageFactory()->newFromTitle( $magTitle )->doPurge();
            }
        }
        return true;
    };

    # File cache DISABLED — causes stale content for anonymous users.
    # Redis parser cache + buffer pool provide sufficient performance.
    # $wgUseFileCache = true;
    # $wgFileCacheDirectory = '/tmp/mediawiki-cache';
    $wgUseFileCache = false;

    $wgMemCachedServers = [];

    ## Security
    $wgSecretKey = getenv('MW_SECRET_KEY');
    $wgAuthenticationTokenVersion = "1";
    $wgUpgradeKey = getenv('MW_UPGRADE_KEY') ?: "upgrade123";

    ## Cross-site AJAX — NITC Wiki PWA (https://wikinitc-web.pages.dev)
    # The PWA is a static app on its own Cloudflare Pages domain and calls
    # api.php cross-origin. Reads go over JSONP (needs no config); the
    # authenticated write flow (login token -> action=login -> CSRF token ->
    # edit/create/delete/move) uses fetch() with credentials:'include' and
    # origin=<pages origin>, which requires BOTH settings below.
    $wgCrossSiteAJAXdomains = [
        'wikinitc-web.pages.dev',     # production Pages domain
        '*.wikinitc-web.pages.dev',   # preview deployments (<hash>.project.pages.dev)
    ];
    # Without SameSite=None browsers withhold the session cookie on every
    # cross-origin fetch(), silently breaking login/CSRF/edit. MediaWiki
    # forces the Secure attribute on all cookies when SameSite is None;
    # the site is already HTTPS-only ($wgServer above), so this is safe.
    $wgCookieSameSite = 'None';

    ## Reverse proxy / real IP detection
    # MediaWiki must know which IPs are trusted proxies so it reads
    # X-Forwarded-For to find the real client IP. Without this,
    # CheckUser and rate-limiting see Traefik's pod IP (10.42.x.x).
    $wgUsePrivateIPs = true;  # Required: immediate proxy is on RFC1918
    $wgCdnServersNoPurge = [
        # k3s internal networks (Traefik, Services)
        '10.42.0.0/16',   # pod CIDR (flannel)
        '10.43.0.0/16',   # service CIDR
        # Cloudflare IPv4 — https://www.cloudflare.com/ips-v4/
        '173.245.48.0/20',
        '103.21.244.0/22',
        '103.22.200.0/22',
        '103.31.4.0/22',
        '141.101.64.0/18',
        '108.162.192.0/18',
        '190.93.240.0/20',
        '188.114.96.0/20',
        '197.234.240.0/22',
        '198.41.128.0/17',
        '162.158.0.0/15',
        '104.16.0.0/13',
        '104.24.0.0/14',
        '172.64.0.0/13',
        '131.0.72.0/22',
        # Cloudflare IPv6 — https://www.cloudflare.com/ips-v6/
        '2400:cb00::/32',
        '2606:4700::/32',
        '2803:f800::/32',
        '2405:b500::/32',
        '2405:8100::/32',
        '2a06:98c0::/29',
        '2c0f:f248::/32',
    ];

    ## Paths
    $wgUsePathInfo = true;
    $wgArticlePath = "/$1";

    ## Email
    $wgEnableEmail = true;
    $wgEnableUserEmail = true;
    $wgEmergencyContact = "wikinitc@gmail.com";
    $wgPasswordSender = "wikinitc@gmail.com";
    $wgEnotifUserTalk = false;
    $wgEnotifWatchlist = false;
    $wgEmailAuthentication = true;
    $wgEmailConfirmToEdit = true;

    # SMTP via Gmail (App Password)
    $wgSMTP = [
        'host'     => 'ssl://smtp.gmail.com',
        'IDHost'   => 'wiki.fosscell.org',
        'port'     => 465,
        'auth'     => true,
        'username' => 'wikinitc@gmail.com',
        'password' => getenv('MW_SMTP_PASSWORD'),
    ];

    ## File uploads — stored in RustFS S3
    $wgEnableUploads = true;
    $wgGenerateThumbnailOnParse = true;

    ## Wikimedia Commons — foreign file repository.
    ## Files referenced via [[File:...]] that don’t exist locally are
    ## fetched from Commons on the fly (thumbnails cached per apiThumbCacheExpiry).
    $wgUseInstantCommons = true;

    ## AWS S3 storage backend
    wfLoadExtension( 'AWS' );
    $wgAWSCredentials = [
        'key' => getenv('MW_S3_ACCESS_KEY'),
        'secret' => getenv('MW_S3_SECRET_KEY'),
    ];
    $wgAWSRegion = 'us-east-1';
    $wgAWSBucketName = 'mediawiki';

    # Hash levels must match how files were migrated from local images/ dir.
    # 2 = S3 keys are a/ab/Filename.png (matching local hashed structure)
    $wgAWSRepoHashLevels = '2';
    $wgAWSRepoDeletedHashLevels = '3';

    # Custom S3-compatible endpoint (RustFS via path-style)
    $wgFileBackends['s3']['endpoint'] = 'http://rustfs-storage-io.rustfs-clusters.svc:9000';
    $wgFileBackends['s3']['use_path_style_endpoint'] = true;
    $wgAWSUseHTTPS = false;

    # Public URL for images — Traefik serves this over HTTPS to the internet.
    # Migrated from Tailscale Funnel (s3-1.tail477f2f.ts.net) to Traefik
    # for better performance (direct to kenobi public IP, no relay).
    # $1 is replaced with the bucket name.
    $wgAWSBucketDomain = 'https://s3.tellmey.fyi/$1';

    ## Permissions
    $wgGroupPermissions['*']['edit'] = false;
    $wgGroupPermissions['*']['createaccount'] = true;
    $wgGroupPermissions['student']['edit'] = true;

    # Protect Template namespace — only sysops can edit templates.
    # Prevents students from accidentally (or intentionally) breaking templates.
    $wgNamespaceProtection[NS_TEMPLATE] = [ 'editinterface' ];

    $wgGroupPermissions['bureaucrat']['smitespam'] = true;
    $wgGroupPermissions['bureaucrat']['usermerge'] = true;

    # Auto-promote to 'student' once email is confirmed.
    # This means: register with @nitc.ac.in → confirm email → instantly can edit.
    # No manual group assignment needed.
    $wgAutopromote['student'] = APCOND_EMAILCONFIRMED;
    $wgGroupPermissions['sysop']['usermerge'] = true;
    $wgGroupPermissions['sysop']['checkuser'] = true;
    $wgGroupPermissions['sysop']['checkuser-log'] = true;
    $wgGroupPermissions['sysop']['abusefilter-modify'] = true;
    $wgGroupPermissions['sysop']['abusefilter-log-detail'] = true;
    $wgGroupPermissions['sysop']['viewuserprivateinfo'] = true;
    $wgGroupPermissions['wiki-admins']['editprotected'] = true;
    $wgGroupPermissions['wiki-admins']['editinterface'] = true;

    $wgGroupPermissions['suppress']['delete'] = true;
    $wgGroupPermissions['suppress']['deletecargodata'] = true;

    # Template editors — a narrow group holding ONLY the right that
    # $wgNamespaceProtection[NS_TEMPLATE] requires. Kept separate from
    # wiki-admins so it doesn't also carry editprotected (edit-any-
    # protected-page). This is the group cargo-admins can grant/revoke
    $wgGroupPermissions['template-editors']['editinterface'] = true;
    # Cargo admins — create/recreate Cargo tables, but NOT delete/drop or
    # grant rights. Membership managed by sysops via Special:UserRights.
    $wgGroupPermissions['cargo-admins']['recreatecargodata'] = true;


    ## Skins
    wfLoadSkin( 'Vector' );
    wfLoadSkin( 'MinervaNeue' );
    wfLoadSkin( 'Citizen' );
    $wgDefaultSkin = "citizen";

    ## Citizen Theme — Full Configuration
    # Theme & appearance
    $wgCitizenThemeDefault = 'auto';           # auto/light/dark
    $wgCitizenThemeColor = '#1a5fb4';          # Brand color (FOSSCELL blue)
    $wgCitizenEnablePreferences = true;        # User preference panel
    $wgCitizenEnableCollapsibleSections = true; # Collapsible article sections
    $wgCitizenEnableDrawerSiteStats = true;    # Show site stats in drawer
    $wgCitizenHeaderPosition = 'left';         # Header position: left/right/top/bottom
    # PWA / Web App Manifest
    $wgCitizenEnableManifest = true;
    $wgCitizenManifestOptions = [
        'short_name' => 'FOSSCELL Wiki',
        'description' => 'The official wiki of FOSS Cell NITC — documenting events, projects, and community history.',
        'theme_color' => '#1a5fb4',
        'background_color' => '#ffffff',
    ];
    # Share button
    $wgCitizenEnableShare = true;
    $wgCitizenShareMode = 'auto';  # auto/panel/native
    # Table of contents
    $wgCitizenTableOfContentsCollapseAtCount = 20;

    ## OpenGraph / Social Meta Tags
    # Citizen skin + PageImages handles og:image natively.
    # Description2 + TextExtracts provides <meta name="description">.
    # WikiSEO (loaded below) owns OpenGraph/Twitter/JSON-LD tags — see its
    # config block. The previous hand-rolled BeforePageDisplay og: hook was
    # removed to avoid emitting duplicate tags alongside WikiSEO.
    $wgEnableMetaDescriptionFunctions = true;

    # PageImages config — ensure it finds images for OG tags
    $wgPageImagesNamespaces = array_merge(
        [ NS_MAIN, NS_USER, NS_PROJECT ],
        range(3000, 3200, 2)  # All year namespaces (3000, 3002, 3004, ...)
    );
    $wgPageImagesLeadSectionOnly = false;  # Search entire page, not just lead
    $wgPageImagesOpenGraph = true;
    $wgPageImagesOpenGraphFallbackImage = 'https://wiki.fosscell.org/favicon.svg';

    ## Extensions — Bundled (already in base image)
    wfLoadExtension( 'AbuseFilter' );
    wfLoadExtensions([ 'ConfirmEdit', 'ConfirmEdit/QuestyCaptcha' ]);
    wfLoadExtension( 'SpamBlacklist' );
    wfLoadExtension( 'Cite' );
    wfLoadExtension( 'CiteThisPage' );
    wfLoadExtension( 'Gadgets' );
    wfLoadExtension( 'InputBox' );
    wfLoadExtension( 'Scribunto' );
    wfLoadExtension( 'TemplateStyles' );
    wfLoadExtension( 'ParserFunctions' );
    $wgPFEnableStringFunctions = true;  # enables #pos, #len, #sub, #pad, #replace, #explode, #arraymap etc.
    wfLoadExtension( 'PageImages' );
    wfLoadExtension( 'TextExtracts' );
    wfLoadExtension( 'Nuke' );
    wfLoadExtension( 'CategoryTree' );
    wfLoadExtension( 'Echo' );
    wfLoadExtension( 'Thanks' );
    wfLoadExtension( 'CheckUser' );
    wfLoadExtension( 'VisualEditor' );
    wfLoadExtension( 'Linter' );
    wfLoadExtension( 'DiscussionTools' );
    wfLoadExtension( 'Popups' );
    wfLoadExtension( 'MobileFrontend' );
    # Citizen handles mobile natively — use it as the mobile skin too.
    $wgDefaultMobileSkin = 'citizen';

    ## Extensions — Custom (cloned in Dockerfile)
    wfLoadExtension( 'DarkMode' );
    wfLoadExtension( 'Comments' );
    wfLoadExtension( 'VoteNY' );
    wfLoadExtension( 'HitCounters' );
    wfLoadExtension( 'ContributionScores' );
    wfLoadExtension( 'Description2' );
    wfLoadExtension( 'RelatedArticles' );
    wfLoadExtension( 'SmiteSpam' );
    wfLoadExtension( 'UserMerge' );
    # --- Additional extensions (verified compatible with MW 1.45) ---
    wfLoadExtension( 'CodeMirror' );
    wfLoadExtension( 'AdvancedSearch' );
    # CommentStreams: INCOMPATIBLE with Comments + MobileFrontend (both loaded above)
    # Choose ONE: CommentStreams OR (Comments + MobileFrontend). We keep Comments + MF.
    # wfLoadExtension( 'CommentStreams' );
    # WhosOnline: REL1_45 branch, should work
    wfLoadExtension( 'WhosOnline' );
    # EmbedVideo v3.x (StarCitizenTools fork) — YouTube, Vimeo, Twitch embeds
    wfLoadExtension( 'EmbedVideo' );
    # RSS: requires SimplePie (verify in build-32)
    wfLoadExtension( 'RSS' );
    # GeoData — geographic coordinate storage and geospatial search
    # Required by the Android app for the Geosearch feature.
    # Creates its own DB table (geo_tags) on update.php.
    wfLoadExtension( 'GeoData' );
    # CommunityConfiguration — required by GrowthExperiments
    wfLoadExtension( 'CommunityConfiguration' );
    # GrowthExperiments — new user onboarding and impact tracking
    # Required by the Android app for the User Impact endpoint.
    wfLoadExtension( 'GrowthExperiments' );

    # BlogPage + SocialProfile
    # SocialProfile DISABLED — hijacks User: page creation/editing flow.
    # Re-enable once we reconcile its UserWiki: namespace with our {{User Profile}} system.
    # require_once "$IP/extensions/SocialProfile/SocialProfile.php";
    wfLoadExtension( 'BlogPage' );

    ## Extensions — Bundled (already in base image, just need loading)
    wfLoadExtension( 'SyntaxHighlight_GeSHi' );  # Code syntax highlighting
    wfLoadExtension( 'TemplateData' );            # Describe template parameters for VE

    ## Extensions — Previously bundled, now cloned in Dockerfile
    # Note: Interwiki is now part of MW core (Special:Interwiki works without extension)
    wfLoadExtension( 'ReplaceText' );             # Bulk find-and-replace across pages

    ## Extensions — Require DB schema (run maintenance/update.php after enabling)
    wfLoadExtension( 'Cargo' );
    wfLoadExtension( 'Disambiguator' );
    wfLoadExtension( 'DisplayTitle' );
    wfLoadExtension( 'BreadCrumbs2' );
    wfLoadExtension( 'CollapsibleSections' );
    wfLoadExtension( 'AJAXPoll' );
    wfLoadExtension( 'PageViewInfo' );

    ## Extensions — Forms, Schemas & Data
    wfLoadExtension( 'PageForms' );
    wfLoadExtension( 'PageSchemas' );
    wfLoadExtension( 'ExternalData' );
    # Security allowlist: ExternalData may only fetch from these hosts, and
    # caches responses for at least 1 hour so parses don't hammer remotes.
    # NITC publishes no stable JSON/RSS feed yet, so a live news ticker is
    # deferred; the capability is wired and ready for when a feed exists.
    $wgExternalDataSources['*']['allowed urls'] = [
        'https://nitc.ac.in',
        'https://en.wikipedia.org',
        'https://www.wikidata.org',
        'https://api.github.com',
    ];
    $wgExternalDataSources['*']['min cache seconds'] = 3600;
    wfLoadExtension( 'Widgets' );

    ## Extensions — Translation & Internationalisation
    wfLoadExtension( 'UniversalLanguageSelector' );
    $wgULSIMEEnabled = true;          # On-screen input methods (Malayalam typing)
    $wgULSWebfontsEnabled = true;     # Serve webfonts for Indic scripts
    $wgULSPosition = 'interlanguage'; # Language selector in the sidebar
    wfLoadExtension( 'Translate' );
    $wgTranslatePageTranslationULS = true;
    $wgGroupPermissions['sysop']['pagetranslation'] = true;
    $wgGroupPermissions['sysop']['translate-manage'] = true;

    ## Extensions — SEO
    wfLoadExtension( 'WikiSEO' );
    # WikiSEO owns all OpenGraph/Twitter/JSON-LD metadata (replaces the old
    # hand-rolled BeforePageDisplay hook). Auto-generate a description from
    # the page extract when {{#seo:}} doesn't set one explicitly.
    $wgWikiSeoDefaultLanguage = 'en';
    $wgWikiSeoEnableAutoDescription = true;   # description from TextExtracts
    $wgWikiSeoEnableSocialImages = false;     # use PageImages og:image, not generated
    $wgWikiSeoDefaultImage = 'https://wiki.fosscell.org/favicon.svg';
    # Site-wide OpenGraph defaults so every page has social tags even
    # without an explicit {{#seo:}} call.
    $wgWikiSeoOverwriteMetadata = [
        'og:site_name' => 'WIKI FOSSCELL NITC',
        'twitter:card' => 'summary_large_image',
    ];

    ## Extensions — Upload & Media Tools
    wfLoadExtension( 'UploadWizard' );
    $wgUploadNavigationUrl = '/Special:UploadWizard';
    $wgUploadWizardConfig = [
        'autoAdd' => [ 'categories' => [ 'Uploaded_with_UploadWizard' ] ],
    ];

    ## Extensions — Glossary
    wfLoadExtension( 'Lingo' );
    # Glossary terms live on [[Terminology]]. Tooltip shows once per term
    # per page (first occurrence) and only in mainspace to limit parse cost.
    $wgexLingoPage = 'Terminology';
    $wgexLingoDisplayOnce = true;
    $wgexLingoUseNamespaces = [ NS_MAIN => true ];

    ## Semantic MediaWiki 7.0-dev + ecosystem
    wfLoadExtension( 'SemanticMediaWiki' );
    # SMW 7.0 keeps its setup state in the database (shared by all pods).
    # setupStore is therefore run ONCE per deploy — by the maintenance Job
    # and, for cold bootstrap, by a flock-guarded sentinel in the db-migrate
    # init container (see deployment.yaml + maintenance-job.yaml). This
    # prevents the per-pod OPTIMIZE-TABLE lock cascade that caused 502s.
    # $smwgConfigFileDir kept on the shared volume in case a future SMW
    # version reintroduces a file-based marker; harmless today.
    $smwgConfigFileDir = '/smw-config';
    # Grant SMW admin rights to sysops
    $wgGroupPermissions['sysop']['smw-admin'] = true;
    $wgGroupPermissions['sysop']['smw-patternedit'] = true;
    $wgGroupPermissions['sysop']['smw-schemaedit'] = true;

    # Semantic Result Formats — additional query result formats (calendar, timeline, etc.)
    wfLoadExtension( 'SemanticResultFormats' );

    # Mermaid — render Mermaid diagrams via SMW
    wfLoadExtension( 'Mermaid' );
    # "neutral" (grayscale) is the most legible single theme for Citizen's
    # light/dark auto-switching skin — "forest"/"default" wash out in dark mode.
    $wgmermaidgDefaultTheme = 'neutral';

    # Maps — interactive maps with SMW integration (Google Maps, Leaflet, etc.)
    wfLoadExtension( 'Maps' );
    $egMapsDefaultService = 'leaflet';  # Use Leaflet (no API key required)

    ## Extensions — Search (CirrusSearch + OpenSearch)
    wfLoadExtension( 'Elastica' );
    wfLoadExtension( 'CirrusSearch' );
    $wgSearchType = 'CirrusSearch';
    $wgCirrusSearchServers = [ 'opensearch.mediawiki.svc.cluster.local' ];
    # Connection timeouts — prevent CirrusSearch from blocking PHP workers
    # if OpenSearch is slow/down. Search degrades gracefully to DB fallback.
    $wgCirrusSearchClientSideConnectTimeout = [ 'default' => 3 ];
    $wgCirrusSearchClientSideSearchTimeout = [ 'default' => 10 ];

    ## Extension config
    $wgScribuntoDefaultEngine = 'luastandalone';
    $wgPopupsHideOptInOnPreferencesPage = true;
    $wgPopupsOptInDefaultState = '1'; # Enable page previews by default
    $wgPopupsReferencePreviewsBetaFeature = false;
    $wgHitcounterUpdateFreq = 1;
    $wgCommentsDefaultAvatar = 'https://s3.tellmey.fyi/mediawiki/avatars/default.png';

    ## VisualEditor / Parsoid
    # Force the main stash (used by Parsoid HTML stash, edit tokens, etc.)
    # to use Redis directly. Without this, WANObjectCache does DB check-key
    # writes that fail when ProxySQL routes to the read-only replica.
    $wgMainStash = 'redis';
    # Parsoid runs in-process (bundled since MW 1.41) — no external service needed.
    $wgVisualEditorEnableWikitext = true;
    $wgVisualEditorAvailableNamespaces = [
        NS_MAIN => true,
        NS_USER => true,
        NS_PROJECT => true,
        NS_HELP => true,
    ];

    ## CAPTCHA
    $wgCaptchaClass = 'QuestyCaptcha';
    $wgCaptchaTriggers['edit'] = false;
    $wgCaptchaTriggers['create'] = false;
    $wgCaptchaTriggers['createtalk'] = false;
    $wgCaptchaTriggers['addurl'] = false;
    $wgCaptchaTriggers['createaccount'] = true;
    $wgCaptchaTriggers['badlogin'] = true;
    $myChallengeString = substr(md5(uniqid(mt_rand(), true)), 0, 8);
    $myChallengeIndex = rand(0, 7) + 1;
    $myChallengePositions = array('first','second','third','fourth','fifth','sixth','seventh','eighth');
    $myChallengePositionName = $myChallengePositions[$myChallengeIndex - 1];
    $wgCaptchaQuestions = [
        "Please provide the $myChallengePositionName character from the sequence <code>$myChallengeString</code>:" => $myChallengeString[$myChallengeIndex - 1]
    ];

    ## Email restriction hook
    $wgHooks["isValidEmailAddr"][] = function($email, &$result) {
        if ($email !== 'vysakhpr218@gmail.com' && $email !== 'farisshajahan@protonmail.com' && $email !== 'akhilneelamparambil@gmail.com' && substr($email, -11) !== '@nitc.ac.in') {
            $result = false;
            return false;
        }
    };

    ## Block duplicate email registrations
    $wgHooks['AbortNewAccount'][] = function( $user, &$message ) {
        $dbr = wfGetDB( DB_REPLICA );
        $email = $user->getEmail();
        if ( $email !== '' ) {
            $exists = $dbr->selectField( 'user', 'user_id', [ 'user_email' => $dbr->strencode( $email ) ], __METHOD__ );
            if ( $exists !== false ) {
                $message = wfMessage( 'noemaildefined' )->text() . ' An account with this email already exists.';
                return false;
            }
        }
        return true;
    };

    ## Year-based event namespaces (Wikimania-style)
    # Every year from 1961 (NITC founding) to 2026 gets a content + talk pair.
    # IDs 3000–3131. Add two more lines each calendar year.
    # Once assigned, NEVER change an ID↔name mapping.
    $currentYear = (int)date('Y');
    $endYear = $currentYear + 2; // academic planning needs 2 years ahead
    for ($y = 1961; $y <= $endYear; $y++) {
        $nsContent = 3000 + ($y - 1961) * 2;
        $nsTalk    = $nsContent + 1;
        $wgExtraNamespaces[$nsContent] = (string)$y;
        $wgExtraNamespaces[$nsTalk]    = "{$y}_talk";
        $wgNamespacesWithSubpages[$nsContent] = true;
        $wgNamespacesWithSubpages[$nsTalk]    = true;
    }

    # Include year namespaces in default search so [[Special:Search]]
    # finds event pages without users having to tick boxes.
    for ($y = 1961; $y <= $endYear; $y++) {
        $wgNamespacesToBeSearchedDefault[3000 + ($y - 1961) * 2] = true;
    }

    # Also index them in CirrusSearch
    for ($y = 1961; $y <= $endYear; $y++) {
        $wgCirrusSearchNamespaceWeights[3000 + ($y - 1961) * 2] = 1.0;
    }

    # Enable VisualEditor for all year-based namespaces
    for ($y = 1961; $y <= $endYear; $y++) {
        $wgVisualEditorAvailableNamespaces[3000 + ($y - 1961) * 2] = true;
    }

    ## HowTo namespace for college documentation
    $wgExtraNamespaces[3200] = 'HowTo';
    $wgExtraNamespaces[3201] = 'HowTo_talk';
    $wgNamespacesWithSubpages[3200] = true;
    $wgNamespacesWithSubpages[3201] = true;
    $wgNamespacesToBeSearchedDefault[3200] = true;
    $wgCirrusSearchNamespaceWeights[3200] = 1.0;
    $wgVisualEditorAvailableNamespaces[3200] = true;
    $wgVisualEditorAvailableNamespaces[3201] = true;

    ## Job queue
    # Don't run jobs on web requests — the sidecar handles them.
    $wgJobRunRate = 0;

    ## Bot lockdown: DENY only the most expensive Special: pages for anonymous users.
    # Turnstile CAPTCHA at the Traefik layer is now the primary anonymous gate.
    # Only the pages that caused crash loops (Drilldown, RecentChangesLinked, Browse)
    # are still blocked at PHP level as a final safety net — these run unbounded
    # multi-table JOINs and full table scans. Login/account pages stay accessible.
    $wgHooks['SpecialPageBeforeExecute'][] = function ( $special, $subPage ) {
        static $blockedPages = [
            'Drilldown',             // Cargo multi-table JOINs (5-10s each)
            'RecentChangesLinked',   // full table scan on recentchanges
            'Browse',                // SemanticMediaWiki property browser
        ];
        static $loginPages = [
            'UserLogin',
            'Userlogin',
            'CreateAccount',
            'PasswordReset',
            'Userlogout',
            'ConfirmEmail',
            'Confirmemail',
        ];
        $name = $special->getName();
        if (
            !$special->getUser()->isRegistered()
            && in_array( $name, $blockedPages, true )
        ) {
            $out = $special->getOutput();
            $out->setPageTitle( wfMessage( 'accmailtitle' )->text() );
            $out->showPermissionsErrorPage(
                [ [ 'badaccess-groups', wfMessage( 'group-user-member' )->text(), 1 ] ]
            );
            return false;
        }
        return true;
    };

    ## Misc
    $wgCachePages = true;
    $wgEnableMetaDescriptionFunctions = true;
    $wgShowExceptionDetails = true;
    $wgDeprecationReleaseLimit = '1.44';
    error_reporting( E_ALL & ~E_DEPRECATED & ~E_STRICT );
    ini_set('display_errors', '0');
