---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mediawiki-localsettings
  namespace: mediawiki
data:
  LocalSettings.php: |
    <?php
    if ( !defined( 'MEDIAWIKI' ) ) { exit; }

    ## Core settings
    $wgSitename = "WIKI FOSSCELL NITC";
    $wgMetaNamespace = "WIKI_FOSSCELL_NITC";
    $wgScriptPath = "";
    $wgServer = "https://wiki.fosscell.org";
    $wgResourceBasePath = $wgScriptPath;
    $wgFavicon = "$wgResourceBasePath/favicon.svg";
    $wgLogos = [
        '1x' => "$wgResourceBasePath/favicon.svg",
        'icon' => "$wgResourceBasePath/favicon.svg",
    ];

    ## Database
    $wgDBtype = "mysql";
    $wgDBserver = "proxysql.proxysql.svc.cluster.local";
    $wgDBname = "mediawiki";
    $wgDBuser = "mediawiki";
    $wgDBpassword = getenv('MW_DB_PASSWORD');
    $wgDBprefix = "";
    $wgDBTableOptions = "ENGINE=InnoDB, DEFAULT CHARSET=binary";

    # Tolerate cross-tailnet latency on cache misses — don't let a slow
    # DB connect kill the entire request. 10s connect + 30s query is
    # enough for the worst case while still failing fast if MySQL is down.
    $wgDBservers = [
        [
            'host' => 'proxysql.proxysql.svc.cluster.local',
            'dbname' => 'mediawiki',
            'user' => 'mediawiki',
            'password' => getenv('MW_DB_PASSWORD'),
            'type' => 'mysql',
            'flags' => DBO_DEFAULT,
            'connTimeout' => 10,
            'queryTimeout' => 30,
        ],
    ];

    ## Shared memory / caching
    # Redis — primary cache backend for all MW caches.
    # Colocated on the same node as MediaWiki pods (kenobi).
    $wgObjectCaches['redis'] = [
        'class' => 'RedisBagOStuff',
        'servers' => [ 'redis.mediawiki.svc.cluster.local:6379' ],
        'persistent' => true,
        'connectTimeout' => 1,
    ];
    $wgMainCacheType = 'redis';
    $wgParserCacheType = 'redis';
    $wgSessionCacheType = 'redis';
    $wgMessageCacheType = 'redis';

    # Localization cache — store in Redis instead of DB to avoid
    # cross-tailnet DB queries for every REST API request.
    $wgLocalisationCacheConf = [
        'class' => 'LocalisationCache',
        'store' => 'array',  # Fastest: keeps l10n in PHP memory (APCu backed)
    ];

    # Parser cache expiry — 7 days (covers most anon traffic without DB hit)
    $wgParserCacheExpireTime = 604800;

    # File cache for anonymous users — serves pre-rendered HTML without
    # touching PHP at all on subsequent requests. Eliminates DB latency
    # for the vast majority of traffic.
    $wgUseFileCache = true;
    $wgFileCacheDirectory = '/tmp/mediawiki-cache';
    $wgShowIPinHeader = false;

    $wgMemCachedServers = [];

    ## Security
    $wgSecretKey = getenv('MW_SECRET_KEY');
    $wgAuthenticationTokenVersion = "1";
    $wgUpgradeKey = getenv('MW_UPGRADE_KEY') ?: "upgrade123";

    ## Paths
    $wgUsePathInfo = true;
    $wgArticlePath = "/$1";

    ## Email
    $wgEnableEmail = true;
    $wgEnableUserEmail = true;
    $wgEmergencyContact = "wikinitc@gmail.com";
    $wgPasswordSender = "wikinitc@gmail.com";
    $wgEnotifUserTalk = false;
    $wgEnotifWatchlist = false;
    $wgEmailAuthentication = true;
    $wgEmailConfirmToEdit = true;

    ## File uploads — stored in RustFS S3
    $wgEnableUploads = true;
    $wgGenerateThumbnailOnParse = true;

    ## Wikimedia Commons — foreign file repository.
    ## Files referenced via [[File:...]] that don’t exist locally are
    ## fetched from Commons on the fly (thumbnails cached per apiThumbCacheExpiry).
    $wgUseInstantCommons = true;

    ## AWS S3 storage backend
    wfLoadExtension( 'AWS' );
    $wgAWSCredentials = [
        'key' => getenv('MW_S3_ACCESS_KEY'),
        'secret' => getenv('MW_S3_SECRET_KEY'),
    ];
    $wgAWSRegion = 'us-east-1';
    $wgAWSBucketName = 'mediawiki';

    # Hash levels must match how files were migrated from local images/ dir.
    # 2 = S3 keys are a/ab/Filename.png (matching local hashed structure)
    $wgAWSRepoHashLevels = '2';
    $wgAWSRepoDeletedHashLevels = '3';

    # Custom S3-compatible endpoint (RustFS via path-style)
    $wgFileBackends['s3']['endpoint'] = 'http://rustfs-storage-io.rustfs-clusters.svc:9000';
    $wgFileBackends['s3']['use_path_style_endpoint'] = true;

    # Public URL for images — $1 is replaced with bucket name
    $wgAWSBucketDomain = 's3-1.tail477f2f.ts.net/$1';

    ## Permissions
    $wgGroupPermissions['*']['edit'] = false;
    $wgGroupPermissions['*']['createaccount'] = true;
    $wgGroupPermissions['student']['edit'] = true;
    $wgGroupPermissions['bureaucrat']['smitespam'] = true;
    $wgGroupPermissions['bureaucrat']['usermerge'] = true;
    $wgGroupPermissions['sysop']['usermerge'] = true;
    $wgGroupPermissions['sysop']['checkuser'] = true;
    $wgGroupPermissions['sysop']['checkuser-log'] = true;
    $wgGroupPermissions['sysop']['abusefilter-modify'] = true;
    $wgGroupPermissions['sysop']['abusefilter-log-detail'] = true;

    ## Skins
    wfLoadSkin( 'Vector' );
    wfLoadSkin( 'MinervaNeue' );
    $wgDefaultSkin = "vector-2022";

    ## Extensions — Bundled (already in base image)
    wfLoadExtension( 'AbuseFilter' );
    wfLoadExtensions([ 'ConfirmEdit', 'ConfirmEdit/QuestyCaptcha' ]);
    wfLoadExtension( 'SpamBlacklist' );
    wfLoadExtension( 'Cite' );
    wfLoadExtension( 'CiteThisPage' );
    wfLoadExtension( 'Scribunto' );
    wfLoadExtension( 'TemplateStyles' );
    wfLoadExtension( 'ParserFunctions' );
    wfLoadExtension( 'PageImages' );
    wfLoadExtension( 'TextExtracts' );
    wfLoadExtension( 'Nuke' );
    wfLoadExtension( 'CategoryTree' );
    wfLoadExtension( 'Echo' );
    wfLoadExtension( 'Thanks' );
    wfLoadExtension( 'CheckUser' );
    wfLoadExtension( 'VisualEditor' );
    wfLoadExtension( 'Linter' );
    wfLoadExtension( 'DiscussionTools' );
    wfLoadExtension( 'Popups' );
    wfLoadExtension( 'MobileFrontend' );

    ## Extensions — Custom (cloned in Dockerfile)
    wfLoadExtension( 'DarkMode' );
    wfLoadExtension( 'Comments' );
    wfLoadExtension( 'VoteNY' );
    wfLoadExtension( 'HitCounters' );
    wfLoadExtension( 'ContributionScores' );
    wfLoadExtension( 'Description2' );
    wfLoadExtension( 'RelatedArticles' );
    wfLoadExtension( 'SmiteSpam' );
    wfLoadExtension( 'UserMerge' );
    wfLoadExtension( 'CodeMirror' );
    wfLoadExtension( 'AdvancedSearch' );
    wfLoadExtension( 'CommentStreams' );
    wfLoadExtension( 'RSS' );
    require_once "$IP/extensions/SocialProfile/SocialProfile.php";
    wfLoadExtension( 'BlogPage' );
    # EmbedVideo v2.8 — try loading (old version, may work on 1.45)
    wfLoadExtension( 'EmbedVideo' );
    # WhosOnline — REL1_45 branch, should be fixed
    wfLoadExtension( 'WhosOnline' );

    ## Extensions — Require DB schema (run maintenance/update.php after enabling)
    wfLoadExtension( 'Cargo' );
    wfLoadExtension( 'Disambiguator' );
    wfLoadExtension( 'DisplayTitle' );
    wfLoadExtension( 'BreadCrumbs2' );
    wfLoadExtension( 'CollapsibleSections' );
    wfLoadExtension( 'AJAXPoll' );
    wfLoadExtension( 'PageViewInfo' );

    ## Extensions — Search (CirrusSearch + OpenSearch)
    wfLoadExtension( 'Elastica' );
    wfLoadExtension( 'CirrusSearch' );
    $wgSearchType = 'CirrusSearch';
    $wgCirrusSearchServers = [ 'opensearch.mediawiki.svc.cluster.local' ];
    # Connection timeouts — prevent CirrusSearch from blocking PHP workers
    # if OpenSearch is slow/down. Search degrades gracefully to DB fallback.
    $wgCirrusSearchClientSideConnectTimeout = [ 'default' => 3 ];
    $wgCirrusSearchClientSideSearchTimeout = [ 'default' => 10 ];

    ## Extension config
    $wgScribuntoDefaultEngine = 'luastandalone';
    $wgPopupsHideOptInOnPreferencesPage = true;
    $wgPopupsOptInDefaultState = '1'; # Enable page previews by default
    $wgPopupsReferencePreviewsBetaFeature = false;
    $wgHitcounterUpdateFreq = 1;
    $wgCommentsDefaultAvatar = 'https://s3-1.tail477f2f.ts.net/mediawiki/avatars/default.png';

    ## VisualEditor / Parsoid
    # Force the main stash (used by Parsoid HTML stash, edit tokens, etc.)
    # to use Redis directly. Without this, WANObjectCache does DB check-key
    # writes that fail when ProxySQL routes to the read-only replica.
    $wgMainStash = 'redis';
    # Parsoid runs in-process (bundled since MW 1.41) — no external service needed.
    $wgVisualEditorEnableWikitext = true;
    $wgVisualEditorAvailableNamespaces = [
        NS_MAIN => true,
        NS_USER => true,
        NS_PROJECT => true,
        NS_HELP => true,
    ];

    ## CAPTCHA
    $wgCaptchaClass = 'QuestyCaptcha';
    $wgCaptchaTriggers['edit'] = false;
    $wgCaptchaTriggers['create'] = false;
    $wgCaptchaTriggers['createtalk'] = false;
    $wgCaptchaTriggers['addurl'] = false;
    $wgCaptchaTriggers['createaccount'] = false;
    $wgCaptchaTriggers['badlogin'] = true;
    $myChallengeString = substr(md5(uniqid(mt_rand(), true)), 0, 8);
    $myChallengeIndex = rand(0, 7) + 1;
    $myChallengePositions = array('first','second','third','fourth','fifth','sixth','seventh','eighth');
    $myChallengePositionName = $myChallengePositions[$myChallengeIndex - 1];
    $wgCaptchaQuestions = [
        "Please provide the $myChallengePositionName character from the sequence <code>$myChallengeString</code>:" => $myChallengeString[$myChallengeIndex - 1]
    ];

    ## Email restriction hook
    $wgHooks["isValidEmailAddr"][] = function($email, &$result) {
        if ($email !== 'vysakhpr218@gmail.com' && $email !== 'farisshajahan@protonmail.com' && $email !== 'akhilneelamparambil@gmail.com' && substr($email, -11) !== '@nitc.ac.in') {
            $result = false;
            return false;
        }
    };

    ## Year-based event namespaces (Wikimania-style)
    # Every year from 1961 (NITC founding) to 2026 gets a content + talk pair.
    # IDs 3000–3131. Add two more lines each calendar year.
    # Once assigned, NEVER change an ID↔name mapping.
    $currentYear = (int)date('Y');
    $endYear = $currentYear + 2; // academic planning needs 2 years ahead
    for ($y = 1961; $y <= $endYear; $y++) {
        $nsContent = 3000 + ($y - 1961) * 2;
        $nsTalk    = $nsContent + 1;
        $wgExtraNamespaces[$nsContent] = (string)$y;
        $wgExtraNamespaces[$nsTalk]    = "{$y}_talk";
        $wgNamespacesWithSubpages[$nsContent] = true;
        $wgNamespacesWithSubpages[$nsTalk]    = true;
    }

    # Include year namespaces in default search so [[Special:Search]]
    # finds event pages without users having to tick boxes.
    for ($y = 1961; $y <= $endYear; $y++) {
        $wgNamespacesToBeSearchedDefault[3000 + ($y - 1961) * 2] = true;
    }

    # Also index them in CirrusSearch
    for ($y = 1961; $y <= $endYear; $y++) {
        $wgCirrusSearchNamespaceWeights[3000 + ($y - 1961) * 2] = 1.0;
    }

    # Enable VisualEditor for all year-based namespaces
    for ($y = 1961; $y <= $endYear; $y++) {
        $wgVisualEditorAvailableNamespaces[3000 + ($y - 1961) * 2] = true;
    }

    ## Job queue
    # Don't run jobs on web requests — the sidecar handles them.
    $wgJobRunRate = 0;

    ## Misc
    $wgCachePages = true;
    $wgEnableMetaDescriptionFunctions = true;
    $wgShowExceptionDetails = true;
    $wgDeprecationReleaseLimit = '1.44';
    error_reporting( E_ALL & ~E_DEPRECATED & ~E_STRICT );
    ini_set('display_errors', '0');
