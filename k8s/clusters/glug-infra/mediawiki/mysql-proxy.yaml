---
# MySQL TCP proxy — lightweight HAProxy on kenobi (arm64) that maintains
# persistent connections to PXC HAProxy on chopper (amd64).
# Eliminates cross-tailnet DNS resolution failures and connection latency
# for MediaWiki DB queries. MediaWiki connects to this local proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-proxy
  namespace: mediawiki
  labels:
    app.kubernetes.io/name: mysql-proxy
    app.kubernetes.io/component: database-proxy
    app.kubernetes.io/part-of: mediawiki
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-proxy
        app.kubernetes.io/component: database-proxy
        app.kubernetes.io/part-of: mediawiki
    spec:
      containers:
        - name: haproxy
          # Official haproxy image — multi-arch (amd64 + arm64)
          image: haproxy:2.8-alpine
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
            - name: stats
              containerPort: 8404
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: mysql-proxy-config
      nodeSelector:
        node-role.glug.infra/compute: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-proxy
  namespace: mediawiki
spec:
  selector:
    app.kubernetes.io/name: mysql-proxy
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
    - name: stats
      port: 8404
      targetPort: 8404
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-proxy-config
  namespace: mediawiki
data:
  haproxy.cfg: |
    global
      maxconn 256
      log stdout format raw local0

    defaults
      mode tcp
      log global
      option tcplog
      timeout connect 10s
      timeout client 300s
      timeout server 300s
      retries 3
      retry-on conn-failure empty-response response-timeout

    frontend mysql_in
      bind *:3306
      default_backend pxc_haproxy

    backend pxc_haproxy
      # Direct ClusterIP of mysql-pxc-db-haproxy.pxc-clusters Service.
      # Bypasses DNS entirely — ClusterIP is stable for the lifetime of the Service.
      # Update if Service is ever deleted/recreated (kubectl get svc -n pxc-clusters).
      server pxc 10.43.63.61:3306 check inter 10s fall 3 rise 2

    frontend stats
      bind *:8404
      mode http
      http-request use-service prometheus-exporter if { path /metrics }
      stats enable
      stats uri /stats
