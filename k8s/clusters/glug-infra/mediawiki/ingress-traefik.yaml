---
# Community member bypass — requests carrying the FOSSCellWiki member token
# in their User-Agent are routed directly to mediawiki-svc, skipping Anubis
# entirely. The token is injected by the FOSS Cell Wiki Access browser extension.
# Priority 100 beats all other IngressRoutes for wiki.fosscell.org.
# Token rotation: update the HeaderRegexp value and redeploy.
#
# CrowdSec counterpart: hosts/kenobi/parts/crowdsec.nix has a whitelist parser
# (glug/whitelist-member-ua) that exempts these same User-Agents from local
# scenario buckets, preventing the firewall bouncer from ever banning them.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-member-bypass
  namespace: mediawiki
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`wiki.fosscell.org`) && HeaderRegexp(`User-Agent`, `FOSSCellWiki/token=af8675e4daaaf432b2735927e7c4e0dcbd3ac020c1687863`)
      kind: Rule
      priority: 100
      services:
        - name: mediawiki-svc
          port: 80
  tls:
    certResolver: letsencrypt
---
# Traefik IngressRoute for MediaWiki.
# Public URL: https://wiki.fosscell.org
# TLS: Let's Encrypt via Traefik ACME.
#
# Bot lockdown architecture (inner → outer):
#   Internet → CrowdSec (firewall drop) → Traefik → Anubis (PoW) → PHP-FPM
#
# Layers that stop bots before they touch PHP-FPM:
#   1. CrowdSec:   permanent bans (bot farms) + behavioral bans at iptables
#   2. Anubis:     PoW challenge (difficulty 8 global, 10 for Special:)
#   3. Turnstile:  CAPTCHA for Special: pages
#   4. MediaWiki:  SpecialPageBeforeExecute hook denies all anon Special: access
#
# Rate limits removed 2026-07 — CrowdSec handles abuse at the firewall now.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-traefik
  namespace: mediawiki
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`wiki.fosscell.org`)
      kind: Rule
      priority: 10
      middlewares:
        - name: wiki-bot-headers
          namespace: mediawiki
      services:
        - name: anubis
          namespace: traefik-system
          port: 8080
  tls:
    certResolver: letsencrypt
---
# HTTP → HTTPS redirect for MediaWiki.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-traefik-redirect
  namespace: mediawiki
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`wiki.fosscell.org`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: traefik-system
      services:
        - name: mediawiki-svc
          port: 80
---
# Turnstile challenge paths — bypass the Turnstile & Anubis middlewares.
# These paths are served directly by the Turnstile service so the challenge
# page + verification endpoint don't get caught in a redirect loop.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: turnstile-challenge
  namespace: mediawiki
spec:
  entryPoints:
    - websecure
  routes:
    # Traefik's rule parser does not support || grouping inside parentheses,
    # so split into separate route entries (they are OR'd implicitly).
    - match: Host(`wiki.fosscell.org`) && PathPrefix(`/challenge`)
      kind: Rule
      priority: 30
      services:
        - name: turnstile
          namespace: traefik-system
          port: 8080
    - match: Host(`wiki.fosscell.org`) && PathPrefix(`/verify`)
      kind: Rule
      priority: 30
      services:
        - name: turnstile
          namespace: traefik-system
          port: 8080
    - match: Host(`wiki.fosscell.org`) && PathPrefix(`/healthz`)
      kind: Rule
      priority: 30
      services:
        - name: turnstile
          namespace: traefik-system
          port: 8080
  tls:
    certResolver: letsencrypt
---
# Special: pages IngressRoute — higher priority than the catch-all above.
# Applies Turnstile CAPTCHA + much tighter rate + concurrency limits because
# every Special: page runs expensive DB/Cargo/SMW queries. Covers both pretty
# (/Special:Foo) and ugly URL (/index.php?title=Special:Foo) forms.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-specials-traefik
  namespace: mediawiki
spec:
  entryPoints:
    - websecure
  routes:
    # Pretty URL: /Special:* — primary form used by all clients
    - match: Host(`wiki.fosscell.org`) && PathPrefix(`/Special:`)
      kind: Rule
      priority: 20
      middlewares:
        - name: turnstile-check
          namespace: mediawiki
        - name: wiki-bot-headers
          namespace: mediawiki
      services:
        - name: anubis
          namespace: traefik-system
          port: 8080
    # Ugly URL: /index.php?title=Special:* — legacy form some bots use
    - match: Host(`wiki.fosscell.org`) && Path(`/index.php`) && Query(`title=Special:UserLogin`) || Host(`wiki.fosscell.org`) && Path(`/index.php`) && QueryRegexp(`title`, `^Special:`)
      kind: Rule
      priority: 20
      middlewares:
        - name: turnstile-check
          namespace: mediawiki
        - name: wiki-bot-headers
          namespace: mediawiki
      services:
        - name: anubis
          namespace: traefik-system
          port: 8080
  tls:
    certResolver: letsencrypt

---
# Response headers: signal no AI/LLM scraping.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wiki-bot-headers
  namespace: mediawiki
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noai, noimageai"
