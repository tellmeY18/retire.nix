---
# Community member bypass — requests carrying the FOSSCellWiki member token
# in their User-Agent are routed directly to mediawiki-svc, skipping Anubis
# entirely. The token is injected by the FOSS Cell Wiki Access browser extension.
# Priority 100 beats all other IngressRoutes for wiki.fosscell.org.
# Token rotation: update the HeaderRegexp value and redeploy.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-member-bypass
  namespace: mediawiki
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`wiki.fosscell.org`) && HeaderRegexp(`User-Agent`, `FOSSCellWiki/token=af8675e4daaaf432b2735927e7c4e0dcbd3ac020c1687863`)
      kind: Rule
      priority: 100
      services:
        - name: mediawiki-svc
          port: 80
  tls:
    certResolver: letsencrypt
---
# Traefik IngressRoute for MediaWiki.
# Public URL: https://wiki.fosscell.org
# TLS: Let's Encrypt via Traefik ACME.
#
# Bot lockdown architecture (inner → outer):
#   Internet → Cloudflare → Traefik (rate+inflight) → Anubis (PoW) → PHP-FPM
#
# Three layers stop bots before they touch PHP-FPM:
#   1. Traefik:    per-IP rate limit + concurrent request cap (InFlightReq)
#   2. Anubis:     PoW challenge (difficulty 8 global, 10 for Special:)
#   3. MediaWiki:  SpecialPageBeforeExecute hook denies all anon Special: access
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-traefik
  namespace: mediawiki
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`wiki.fosscell.org`)
      kind: Rule
      priority: 10
      middlewares:
        - name: wiki-rate-limit
          namespace: mediawiki
        - name: wiki-inflight
          namespace: mediawiki
        - name: wiki-bot-headers
          namespace: mediawiki
      services:
        - name: anubis
          namespace: traefik-system
          port: 8080
  tls:
    certResolver: letsencrypt
---
# HTTP → HTTPS redirect for MediaWiki.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-traefik-redirect
  namespace: mediawiki
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`wiki.fosscell.org`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: traefik-system
      services:
        - name: mediawiki-svc
          port: 80
---
# Special: pages IngressRoute — higher priority than the catch-all above.
# Applies much tighter rate + concurrency limits because every Special: page
# runs expensive DB/Cargo/SMW queries. Covers both pretty (/Special:Foo) and
# ugly URL (/index.php?title=Special:Foo) forms.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-specials-traefik
  namespace: mediawiki
spec:
  entryPoints:
    - websecure
  routes:
    # Pretty URL: /Special:* — primary form used by all clients
    - match: Host(`wiki.fosscell.org`) && PathPrefix(`/Special:`)
      kind: Rule
      priority: 20
      middlewares:
        - name: wiki-special-rate-limit
          namespace: mediawiki
        - name: wiki-special-inflight
          namespace: mediawiki
        - name: wiki-bot-headers
          namespace: mediawiki
      services:
        - name: anubis
          namespace: traefik-system
          port: 8080
    # Ugly URL: /index.php?title=Special:* — legacy form some bots use
    - match: Host(`wiki.fosscell.org`) && Path(`/index.php`) && Query(`title=Special:UserLogin`) || Host(`wiki.fosscell.org`) && Path(`/index.php`) && QueryRegexp(`title`, `^Special:`)
      kind: Rule
      priority: 20
      middlewares:
        - name: wiki-special-rate-limit
          namespace: mediawiki
        - name: wiki-special-inflight
          namespace: mediawiki
        - name: wiki-bot-headers
          namespace: mediawiki
      services:
        - name: anubis
          namespace: traefik-system
          port: 8080
  tls:
    certResolver: letsencrypt
---
# Global rate limit — 8 req/s per real client IP, burst 15.
# Enough for rapid human navigation (tab/click < 8 req/s).
# Kills high-rate scrapers even when they rotate User-Agents.
# sourceCriterion depth:1 reads the first X-Forwarded-For entry (real IP via Cloudflare).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wiki-rate-limit
  namespace: mediawiki
spec:
  rateLimit:
    average: 8
    burst: 15
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Global concurrent request cap — 10 simultaneous in-flight requests per IP.
# Humans rarely open > 10 tabs at once. Bots that pass the PoW challenge and
# try to fire 20–50 parallel requests hit a 503 wall here.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wiki-inflight
  namespace: mediawiki
spec:
  inFlightReq:
    amount: 10
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Special: page rate limit — 1 req/s per IP, burst 3.
# Special: pages run multi-join SQL (Cargo Drilldown), full table scans
# (RecentChangesLinked), or large exports. No human navigates >1 Special:/s.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wiki-special-rate-limit
  namespace: mediawiki
spec:
  rateLimit:
    average: 1
    burst: 3
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Special: page concurrent cap — 3 simultaneous in-flight per IP.
# Even with slow 10-second Cargo queries, a human opens 1–2 tabs at a time.
# Returns HTTP 503 immediately when exceeded — fast-fail, no PHP-FPM slot wasted.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wiki-special-inflight
  namespace: mediawiki
spec:
  inFlightReq:
    amount: 3
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Response headers: signal no AI/LLM scraping.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wiki-bot-headers
  namespace: mediawiki
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noai, noimageai"
