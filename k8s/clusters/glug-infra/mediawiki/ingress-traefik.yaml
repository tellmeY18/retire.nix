---
# Traefik IngressRoute for MediaWiki.
# Public URL: https://wiki.fosscell.org
# TLS: Let's Encrypt via Traefik ACME.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-traefik
  namespace: mediawiki
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`wiki.fosscell.org`)
      kind: Rule
      middlewares:
        - name: wiki-rate-limit
          namespace: mediawiki
        - name: wiki-bot-headers
          namespace: mediawiki
      services:
        - name: anubis
          namespace: traefik-system
          port: 8080
  tls:
    certResolver: letsencrypt
---
# HTTP → HTTPS redirect for MediaWiki.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mediawiki-traefik-redirect
  namespace: mediawiki
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`wiki.fosscell.org`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: traefik-system
      services:
        - name: mediawiki-svc
          port: 80
---
# Rate limit — throttle aggressive crawlers.
# Real users: 50 req/s average, burst up to 100.
# Bots hitting /index.php?action=... at 10 req/s get queued/dropped.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wiki-rate-limit
  namespace: mediawiki
spec:
  rateLimit:
    average: 30
    burst: 60
    period: 1s
    sourceCriterion:
      ipStrategy:
        depth: 1
---
# Add headers to signal bot handling.
# X-Robots-Tag tells well-behaved bots to slow down.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: wiki-bot-headers
  namespace: mediawiki
spec:
  headers:
    customResponseHeaders:
      X-Robots-Tag: "noai, noimageai"
