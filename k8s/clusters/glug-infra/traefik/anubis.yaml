---
# Anubis — proof-of-work bot challenge gate.
# Blocks AI scrapers and aggressive crawlers with a JS challenge.
# Integrates with Traefik via ForwardAuth middleware.
#
# Flow:
#   User → Traefik → ForwardAuth(Anubis) → challenge page (if bot)
#                                         → pass through (if human)
#
# Protected services: wiki.fosscell.org
# Unprotected: tellmey.fyi, ask.kenobi.win (no challenge needed)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anubis
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: anubis
    app.kubernetes.io/component: bot-protection
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: anubis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anubis
    spec:
      containers:
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.25.0
          env:
            - name: BIND
              value: ":8080"
            # TARGET = the backend service Anubis proxies to after challenge passes
            - name: TARGET
              value: "http://mediawiki-svc.mediawiki.svc.cluster.local:80"
            - name: REDIRECT_DOMAINS
              value: "wiki.fosscell.org"
            - name: COOKIE_DOMAIN
              value: "wiki.fosscell.org"
            # Global difficulty for non-Special: pages.
            # Difficulty 5 (16^5 ≈ 1M hashes) takes ~1s on a phone with the
            # `fast` algorithm — acceptable for a one-time challenge.
            # Special: pages now use Turnstile (Traefik-level CAPTCHA) instead,
            # with Anubis at difficulty 1 as a lightweight second line of defense.
            - name: DIFFICULTY
              value: "5"
            - name: SERVE_ROBOTS_TXT
              value: "true"
            - name: POLICY_FNAME
              value: /etc/anubis/policy.yaml
            # Use X-Real-Ip from Traefik to identify clients
            - name: USE_REMOTE_ADDRESS
              value: "false"
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          volumeMounts:
            - name: policy
              mountPath: /etc/anubis
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: anubis-policy
---
# Anubis bot policy.
# Rules are evaluated top-to-bottom; first match wins.
# DENY = 403. CHALLENGE = JS proof-of-work. ALLOW = pass through immediately.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anubis-policy
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: anubis
data:
  policy.yaml: |
    bots:
      # Allow our own agents (rotating token) BEFORE any deny/challenge rule.
      # The MCP client can't solve proof-of-work, so it must bypass the
      # challenge entirely. ROTATE: replace the token literal here and in
      # wiki-mcp. See file header.
      - name: nitc-agent
        user_agent_regex: ^NITCWikiAgent/.*token=e5e28642935802159128da31361c53b3
        action: ALLOW

      # FOSS Cell Wiki Access browser extension — community members install this
      # to bypass the PoW challenge. The Traefik IngressRoute already routes them
      # directly to mediawiki-svc (skipping Anubis), but this ALLOW rule is a
      # belt-and-suspenders fallback in case traffic routes through Anubis.
      # Token rotation: update here AND in ingress-traefik.yaml, then rollout restart anubis.
      - name: fosscell-member
        user_agent_regex: "FOSSCellWiki/token=af8675e4daaaf432b2735927e7c4e0dcbd3ac020c1687863"
        action: ALLOW

      # Deny pathological scrapers
      - import: (data)/bots/_deny-pathological.yaml
      - import: (data)/bots/aggressive-brazilian-scrapers.yaml

      # Block AI/LLM bots aggressively
      - import: (data)/meta/ai-block-aggressive.yaml

      # meta-webindexer = Meta/Facebook's aggressive general-purpose indexer.
      # Unlike facebookexternalhit (link previews), it has no legitimate reason
      # to crawl Special:RecentChangesLinked. It runs headless Chrome, solves
      # our PoW, then fires dozens of concurrent expensive DB queries until
      # PHP-FPM hits pm.max_children and the liveness probe times out → crash
      # loop. DENY before any challenge or allow rule.
      - name: meta-webindexer-deny
        user_agent_regex: "meta-webindexer"
        action: DENY

      # ALLOW Special:ConfirmEmail before the Special: deny/challenge rules.
      # The email-confirmation link is clicked once from a user's inbox, often
      # in a logged-out browser that has never solved a PoW challenge. Forcing
      # a difficulty-10 challenge there breaks account verification. It takes a
      # token, runs no expensive query, and is not a scraper target — safe to
      # pass straight through. (MediaWiki's SpecialPageBeforeExecute hook also
      # whitelists it.) Matches /Special:ConfirmEmail and /Special:ConfirmEmail/<token>.
      - name: allow-confirm-email
        path_regex: "^/Special:ConfirmEmail"
        action: ALLOW

      # ── Bot lockdown: path-based Special: page protection ─────────────────
      #
      # Turnstile (Traefik-level CAPTCHA) is now the primary gate for Special:
      # pages. Anubis provides a lightweight second line of defense:
      #   - DENY the most expensive pages that caused crash loops (see incident
      #     report docs/mediawiki-bot-attack-2026-07.md). These have no legitimate
      #     anonymous use and consume extreme DB resources.
      #   - CHALLENGE at difficulty 1 (minimal) for all other Special: pages.
      #     This is a very fast PoW that legitimate clients solve in <0.1s.
      #     The real bot-stopping power is in Turnstile, not Anubis.
      - name: deny-expensive-special-pages
        path_regex: "^/(index\\.php/)?Special:(Drilldown|RecentChangesLinked|Browse)"
        action: DENY

      # Query-string form of the same DENY list.
      - name: deny-expensive-special-pages-query-form
        action: DENY
        expression:
          all:
            - '"title" in query'
            - 'query["title"].matches("(?i)^Special:(Drilldown|RecentChangesLinked|Browse)")'

      # CHALLENGE — all remaining Special: pages at minimal difficulty.
      # Turnstile is the primary gate; Anubis is just a lightweight second
      # line for any request that somehow passes Turnstile.
      - name: challenge-all-special-pages
        path_regex: "^/Special:"
        action: CHALLENGE
        challenge:
          algorithm: fast
          difficulty: 1
      # Empty-UA bots can't solve the JS PoW, so they keep hitting the
      # challenge wall, which acts as a per-IP rate limiter without out-
      # right denial. Legitimate clients always send a User-Agent.
      - name: empty-ua
        user_agent_regex: ^$
        action: CHALLENGE

      # Allow search engine crawlers (Google, Bing, Apple, DDG, etc.)
      - import: (data)/crawlers/_allow-good.yaml

      # Allow social media / embed crawlers (fixes OG previews!)
      - name: facebook-crawler
        user_agent_regex: "facebookexternalhit|facebookcatalog|Facebot"
        action: ALLOW

      - name: twitter-crawler
        user_agent_regex: "Twitterbot"
        action: ALLOW

      - name: discord-crawler
        user_agent_regex: "Discordbot"
        action: ALLOW

      - name: telegram-crawler
        user_agent_regex: "TelegramBot"
        action: ALLOW

      - name: slack-crawler
        user_agent_regex: "Slackbot|Slack-ImgProxy"
        action: ALLOW

      - name: linkedin-crawler
        user_agent_regex: "LinkedInBot"
        action: ALLOW

      - name: whatsapp-crawler
        user_agent_regex: "WhatsApp"
        action: ALLOW

      - name: signal-preview
        user_agent_regex: "Signal"
        action: ALLOW

      - name: reddit-crawler
        user_agent_regex: "Redditbot"
        action: ALLOW

      - name: mastodon-preview
        user_agent_regex: "Mastodon|Pleroma|Akkoma|Misskey"
        action: ALLOW

      # Allow well-known paths (robots.txt, favicon, etc.)
      - import: (data)/common/keep-internet-working.yaml

      # Allow MediaWiki API (programmatic access)
      - name: mediawiki-api
        path_regex: "^/api\\.php"
        action: ALLOW

      - name: mediawiki-rest-api
        path_regex: "^/rest\\.php"
        action: ALLOW

      # Challenge Firefox AI previews
      - import: (data)/clients/x-firefox-ai.yaml

      # Default: challenge everyone else (difficulty set via DIFFICULTY env var)
---
apiVersion: v1
kind: Service
metadata:
  name: anubis
  namespace: traefik-system
spec:
  selector:
    app.kubernetes.io/name: anubis
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
# ForwardAuth middleware — Traefik sends every request to Anubis first.
# If Anubis returns 200, the request passes through to the backend.
# If Anubis returns 401/302, the user sees the challenge page.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: anubis-check
  namespace: traefik-system
spec:
  forwardAuth:
    # Cluster DNS resolves because Traefik is configured with
    # dnsPolicy: ClusterFirstWithHostNet in the Helm values.
    address: http://anubis.traefik-system.svc:8080/.within.website/x/cmd/anubis/api/check
    trustForwardHeader: true
    authResponseHeaders:
      - X-Anubis-Status
      - Set-Cookie
