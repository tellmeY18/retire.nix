---
# Anubis bot policy for wiki.fosscell.org.
#
# Rules are first-match-wins, top to bottom. The bulk of the lockdown comes
# from Anubis' curated, image-bundled `import:` lists (deny pathological +
# AI/LLM scrapers, allow verified search engines, keep well-known paths
# working). On top of those we layer site-specific ALLOWs (social embed
# crawlers, the MediaWiki API) and our own agent allowlist.
#
# ─── NITC agent allowlist (rotating token) ────────────────────────────────
# Our own automation (the wiki-mcp / mediawiki-mcp client) cannot solve the
# JS proof-of-work challenge, so it MUST be recognised and waved through at
# the edge. It sends a distinctive User-Agent carrying a shared, rotating
# token:
#
#   NITCWikiAgent/<ver> (+https://github.com/Wiki-NITC/wiki-mcp; token=<SECRET>)
#
# The `nitc-agent` rule is placed FIRST so our traffic is allowed before any
# deny/challenge rule can touch it. This is a SOFT allowlist, not an auth
# boundary — a User-Agent is trivially spoofable. Real write-protection still
# comes from MediaWiki's bot-password/login flow; the token only exempts our
# traffic from the challenge + throttles.
#
# TO ROTATE: generate a new token (`openssl rand -hex 16`), update the SAME
# value in BOTH places, then redeploy each side:
#   1. here — the `token=...` literal in the `nitc-agent` rule below, then
#      `kubectl apply -k k8s/clusters/glug-infra/traefik` and
#      `kubectl rollout restart deploy/anubis -n traefik-system`
#   2. wiki-mcp — the WIKI_MCP_USER_AGENT / token value the server sends.
# A leaked token is cut off by flipping this one literal and redeploying.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anubis-policy
  namespace: traefik-system
  labels:
    app.kubernetes.io/name: anubis
data:
  policy.yaml: |
    bots:
      # Allow our own agents (rotating token) BEFORE any deny/challenge rule.
      # The MCP client can't solve proof-of-work, so it must bypass the
      # challenge entirely. ROTATE: replace the token literal here and in
      # wiki-mcp. See file header.
      - name: nitc-agent
        user_agent_regex: ^NITCWikiAgent/.*token=e5e28642935802159128da31361c53b3
        action: ALLOW

      # Deny pathological scrapers
      - import: (data)/bots/_deny-pathological.yaml
      - import: (data)/bots/aggressive-brazilian-scrapers.yaml

      # Block AI/LLM bots aggressively
      - import: (data)/meta/ai-block-aggressive.yaml

      # Challenge requests with no User-Agent — the current flood vector.
      # Empty-UA bots can't solve the JS PoW, so they keep hitting the
      # challenge wall, which acts as a per-IP rate limiter without out-
      # right denial. Legitimate clients always send a User-Agent.
      - name: empty-ua
        user_agent_regex: ^$
        action: CHALLENGE

      # Allow search engine crawlers (Google, Bing, Apple, DDG, etc.)
      - import: (data)/crawlers/_allow-good.yaml

      # Allow social media / embed crawlers (fixes OG previews!)
      - name: facebook-crawler
        user_agent_regex: "facebookexternalhit|facebookcatalog|Facebot"
        action: ALLOW

      - name: twitter-crawler
        user_agent_regex: "Twitterbot"
        action: ALLOW

      - name: discord-crawler
        user_agent_regex: "Discordbot"
        action: ALLOW

      - name: telegram-crawler
        user_agent_regex: "TelegramBot"
        action: ALLOW

      - name: slack-crawler
        user_agent_regex: "Slackbot|Slack-ImgProxy"
        action: ALLOW

      - name: linkedin-crawler
        user_agent_regex: "LinkedInBot"
        action: ALLOW

      - name: whatsapp-crawler
        user_agent_regex: "WhatsApp"
        action: ALLOW

      - name: signal-preview
        user_agent_regex: "Signal"
        action: ALLOW

      - name: reddit-crawler
        user_agent_regex: "Redditbot"
        action: ALLOW

      - name: mastodon-preview
        user_agent_regex: "Mastodon|Pleroma|Akkoma|Misskey"
        action: ALLOW

      # Allow well-known paths (robots.txt, favicon, etc.)
      - import: (data)/common/keep-internet-working.yaml

      # Allow MediaWiki API (programmatic access)
      - name: mediawiki-api
        path_regex: "^/api\\.php"
        action: ALLOW

      - name: mediawiki-rest-api
        path_regex: "^/rest\\.php"
        action: ALLOW

      # Challenge Firefox AI previews
      - import: (data)/clients/x-firefox-ai.yaml

      # Default: challenge everyone else (difficulty set via env var)
