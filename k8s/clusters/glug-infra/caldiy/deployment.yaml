---
# deployment.yaml — Cal.diy (stateless; state lives in shared CNPG Postgres).
#
# Image is built by .github/workflows/caldiy-build.yml (no upstream Docker
# Hub tags exist for calcom/cal.diy) and pushed to ghcr.io/tellmey18/cal-diy.
# Bump the tag here after each CI run — see the workflow's job summary.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caldiy
  namespace: caldiy
  labels:
    app.kubernetes.io/name: caldiy
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: caldiy
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: caldiy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: caldiy
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: caldiy
    spec:
      # Run on c3po, NOT kenobi.
      #   - kenobi is the sole control-plane/etcd node with only 2 cores and
      #     sat at ~80% CPU; Next.js SSR there was slow enough that the
      #     liveness probe timed out and kubelet SIGKILLed the container
      #     (exit 137, reason "Error" — a probe kill, not an OOM).
      #   - c3po has 8 cores and is ~1% busy, AND hosts the CNPG Postgres
      #     primary, so Cal sits next to its own database.
      # This adds no new single point of failure: Cal already depends on
      # c3po for Postgres, so c3po going down takes Cal down either way.
      tolerations:
        - key: node-role.glug.infra/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      # Hard pin, not a preference: a soft (preferred) affinity lost to the
      # scheduler's image-locality score and kept landing back on kenobi.
      #
      # chopper, not c3po: c3po hosts the Postgres primary but is already
      # 94% memory-REQUESTED (~435Mi schedulable free), so Cal cannot fit
      # there — the scheduler rejected it with "Insufficient memory".
      # chopper is ~14% CPU / ~44% memory requested, so it has headroom in
      # both. Cal reaches Postgres cross-node either way (it did from
      # kenobi too), so this costs nothing in DB locality.
      nodeSelector:
        kubernetes.io/hostname: chopper
      containers:
        - name: caldiy
          image: ghcr.io/tellmey18/cal-diy:build-2
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - secretRef:
                name: caldiy-credentials

          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_WEBAPP_URL
              value: "https://date.tellmey.fyi"
            - name: NEXTAUTH_URL
              value: "https://date.tellmey.fyi/api/auth"
            - name: CALCOM_TELEMETRY_DISABLED
              value: "1"

          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              # Steady-state RSS was ~880Mi against the old 1Gi ceiling,
              # leaving no headroom for SSR spikes. c3po has 8Gi.
              memory: 2Gi

          # Cal is a heavy Next.js app: a cold SSR render of /auth/login can
          # take well over 5s. The old 5s timeouts were what turned slowness
          # into a restart loop (36 restarts). Give it room to be slow
          # without declaring it dead.
          startupProbe:
            httpGet:
              path: /auth/login
              port: 3000
            timeoutSeconds: 10
            failureThreshold: 60
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            timeoutSeconds: 10
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /auth/login
              port: 3000
            timeoutSeconds: 15
            initialDelaySeconds: 60
            periodSeconds: 30
            # ~3min of sustained failure before a kill, so a slow render or
            # a brief DB blip can't restart the pod.
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: caldiy-svc
  namespace: caldiy
spec:
  selector:
    app.kubernetes.io/name: caldiy
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
