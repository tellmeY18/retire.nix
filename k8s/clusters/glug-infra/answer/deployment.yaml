---
# deployment.yaml — Apache Answer (stateless).
#
# Custom image includes the S3 storage plugin. All persistent data
# lives in PostgreSQL (CNPG) and RustFS (S3). The /data volume is
# an emptyDir — only used for runtime cache and i18n bundles.
#
# After initial setup, config.yaml is mounted from the ConfigMap.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: answer
  namespace: answer
  labels:
    app.kubernetes.io/name: answer
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: answer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: answer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: answer
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: answer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: answer
          image: ghcr.io/tellmey18/answer:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          envFrom:
            - secretRef:
                name: answer-credentials

          volumeMounts:
            # Runtime data directory (emptyDir — ephemeral).
            - name: data
              mountPath: /data
            # Config from ConfigMap (overrides any /data/conf/config.yaml).
            - name: config
              mountPath: /data/conf/config.yaml
              subPath: config.yaml
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false # Answer writes to /data at runtime
            capabilities:
              drop:
                - ALL

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: data
          emptyDir: {}
        - name: config
          configMap:
            name: answer-config
---
apiVersion: v1
kind: Service
metadata:
  name: answer-svc
  namespace: answer
spec:
  selector:
    app.kubernetes.io/name: answer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
