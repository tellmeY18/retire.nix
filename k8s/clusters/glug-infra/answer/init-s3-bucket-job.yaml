---
# init-s3-bucket-job.yaml — One-time Job to create the 'answer' bucket in RustFS.
#
# Run ONCE before deploying Answer:
#   kubectl apply -f k8s/clusters/glug-infra/answer/init-s3-bucket-job.yaml
#
# After the Job succeeds, delete it:
#   kubectl delete -f k8s/clusters/glug-infra/answer/init-s3-bucket-job.yaml
#
# Uses the RustFS root credentials (from rustfs-credentials Secret) to
# create the bucket + a dedicated access key for Answer.
apiVersion: batch/v1
kind: Job
metadata:
  name: answer-init-s3
  namespace: rustfs-clusters
  labels:
    app.kubernetes.io/part-of: answer
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: answer-init-s3
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-bucket
          image: minio/mc:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "Configuring mc alias for RustFS..."
              mc alias set rustfs \
                http://rustfs-storage-io.rustfs-clusters.svc:9000 \
                "$ROOT_ACCESS_KEY" "$ROOT_SECRET_KEY"

              echo "Creating 'answer' bucket (idempotent)..."
              mc mb --ignore-existing rustfs/answer

              echo "Setting bucket policy to allow authenticated read/write..."
              mc anonymous set none rustfs/answer

              # Create a dedicated access policy for the answer service account.
              cat > /tmp/answer-policy.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [
                  {
                    "Effect": "Allow",
                    "Action": [
                      "s3:GetObject",
                      "s3:PutObject",
                      "s3:DeleteObject",
                      "s3:ListBucket",
                      "s3:GetBucketLocation"
                    ],
                    "Resource": [
                      "arn:aws:s3:::answer",
                      "arn:aws:s3:::answer/*"
                    ]
                  }
                ]
              }
              EOF

              echo "Creating IAM policy 'answer-rw'..."
              mc admin policy create rustfs answer-rw /tmp/answer-policy.json 2>/dev/null || \
                mc admin policy info rustfs answer-rw

              echo "Creating service account for Answer..."
              # This creates a new access key pair or reuses existing.
              mc admin user add rustfs \
                "abcf8820d0f20c307ae8c9a9082cc66e" \
                "6f57214889dae0f8be243c99d6b572644d674ed8967a2771dd68eec25b39589a" 2>/dev/null || true

              mc admin policy attach rustfs answer-rw --user abcf8820d0f20c307ae8c9a9082cc66e 2>/dev/null || true

              echo "✓ RustFS bucket 'answer' ready with dedicated credentials."
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: accesskey
            - name: ROOT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-credentials
                  key: secretkey
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
