---
# init-db-job.yaml — One-time Job to create the 'answer' database + user in CNPG.
#
# Run ONCE before deploying Answer:
#   kubectl apply -f k8s/clusters/glug-infra/answer/init-db-job.yaml
#
# After the Job succeeds (check with `kubectl get jobs -n cnpg-clusters`),
# you can delete it:
#   kubectl delete -f k8s/clusters/glug-infra/answer/init-db-job.yaml
#
# The Job connects to the CNPG cluster's -rw service using the superuser
# credentials (operator-managed Secret: postgres-cluster-superuser).
apiVersion: batch/v1
kind: Job
metadata:
  name: answer-init-db
  namespace: cnpg-clusters
  labels:
    app.kubernetes.io/part-of: answer
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: answer-init-db
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init-db
          image: alpine:3.21
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache postgresql-client >/dev/null 2>&1
              echo "Creating database 'answer' and user 'answer'..."

              psql "$PGURI" <<-'SQL'
                -- Create the answer user (idempotent).
                DO $$
                BEGIN
                  IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'answer') THEN
                    CREATE ROLE answer WITH LOGIN PASSWORD 'afa14b2df6f9aabe7e10e057b3d81dcb5d5200d14b02557f';
                  END IF;
                END
                $$;

                -- Create the answer database (idempotent).
                SELECT 'CREATE DATABASE answer OWNER answer'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'answer')\gexec

                -- Grant privileges.
                GRANT ALL PRIVILEGES ON DATABASE answer TO answer;
              SQL

              echo "✓ Database 'answer' and user 'answer' created successfully."
          env:
            - name: PGURI
              valueFrom:
                secretKeyRef:
                  name: postgres-cluster-superuser
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
