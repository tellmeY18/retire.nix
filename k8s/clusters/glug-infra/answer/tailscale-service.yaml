---
# Tailscale LoadBalancer — exposes Answer on the tailnet.
# Access at: answer.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: answer-tailscale
  namespace: answer
  annotations:
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: answer-svc
      port:
        number: 80
  tls:
    - hosts:
        - answer
