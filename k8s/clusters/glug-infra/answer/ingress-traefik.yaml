---
# Traefik IngressRoute for Apache Answer.
# Public URL: https://ask.kenobi.win
# TLS: Let's Encrypt via Traefik ACME.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: answer-traefik
  namespace: answer
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`ask.kenobi.win`)
      kind: Rule
      services:
        - name: answer-svc
          port: 80
  tls:
    certResolver: letsencrypt
---
# HTTP → HTTPS redirect for Answer.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: answer-traefik-redirect
  namespace: answer
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`ask.kenobi.win`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: traefik-system
      services:
        - name: answer-svc
          port: 80
