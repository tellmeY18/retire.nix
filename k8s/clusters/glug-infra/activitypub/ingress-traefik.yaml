---
# Route ActivityPub paths to the AP service (higher priority than Ghost catch-all).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: activitypub-traefik
  namespace: ghost
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`tellmey.fyi`) && PathPrefix(`/.ghost/activitypub`)
      kind: Rule
      priority: 100
      services:
        - name: activitypub-svc
          port: 8080
    - match: Host(`tellmey.fyi`) && Path(`/.well-known/webfinger`)
      kind: Rule
      priority: 100
      services:
        - name: activitypub-svc
          port: 8080
    - match: Host(`tellmey.fyi`) && Path(`/.well-known/nodeinfo`)
      kind: Rule
      priority: 100
      services:
        - name: activitypub-svc
          port: 8080
  tls:
    certResolver: letsencrypt
