---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pubsub-ap
  namespace: ghost
  labels:
    app.kubernetes.io/name: pubsub-ap
    app.kubernetes.io/part-of: ghost-activitypub
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pubsub-ap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pubsub-ap
        app.kubernetes.io/part-of: ghost-activitypub
    spec:
      containers:
        - name: pubsub
          image: gcr.io/google.com/cloudsdktool/google-cloud-cli:499.0.0-emulators
          command:
            - /bin/bash
            - -c
            - |
              gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=activitypub &
              PUBSUB_PID=$!
              # Wait for emulator to be ready
              for i in $(seq 1 30); do
                if curl -s http://localhost:8085 > /dev/null 2>&1; then break; fi
                sleep 1
              done
              # Create topics and subscriptions
              export PUBSUB_EMULATOR_HOST=localhost:8085
              # Topics
              curl -s -X PUT http://localhost:8085/v1/projects/activitypub/topics/fedify-topic
              curl -s -X PUT http://localhost:8085/v1/projects/activitypub/topics/fedify-retry-topic
              curl -s -X PUT http://localhost:8085/v1/projects/activitypub/topics/ghost-topic
              # Subscriptions with push config
              curl -s -X PUT http://localhost:8085/v1/projects/activitypub/subscriptions/fedify-subscription \
                -H "Content-Type: application/json" \
                -d '{"topic":"projects/activitypub/topics/fedify-topic","pushConfig":{"pushEndpoint":"http://activitypub-svc.ghost.svc:8080/.ghost/activitypub/pubsub/fedify/push"}}'
              curl -s -X PUT http://localhost:8085/v1/projects/activitypub/subscriptions/fedify-subscription-retry \
                -H "Content-Type: application/json" \
                -d '{"topic":"projects/activitypub/topics/fedify-retry-topic","pushConfig":{"pushEndpoint":"http://activitypub-svc.ghost.svc:8080/.ghost/activitypub/pubsub/fedify/push"}}'
              curl -s -X PUT http://localhost:8085/v1/projects/activitypub/subscriptions/ghost-subscription \
                -H "Content-Type: application/json" \
                -d '{"topic":"projects/activitypub/topics/ghost-topic","pushConfig":{"pushEndpoint":"http://activitypub-svc.ghost.svc:8080/.ghost/activitypub/pubsub/ghost/push"}}'
              echo "Pub/Sub emulator ready with all topics and subscriptions"
              wait $PUBSUB_PID
          ports:
            - name: pubsub
              containerPort: 8085
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: pubsub-ap
  namespace: ghost
spec:
  selector:
    app.kubernetes.io/name: pubsub-ap
  ports:
    - name: pubsub
      port: 8085
      targetPort: 8085
