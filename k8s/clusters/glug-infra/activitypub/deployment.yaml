---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: activitypub
  namespace: ghost
  labels:
    app.kubernetes.io/name: activitypub
    app.kubernetes.io/component: federation
    app.kubernetes.io/part-of: ghost-activitypub
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: activitypub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activitypub
        app.kubernetes.io/component: federation
        app.kubernetes.io/part-of: ghost-activitypub
    spec:
      tolerations:
        - key: node-role.glug.infra/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node-role.glug.infra/storage
                    operator: In
                    values:
                      - "true"
      containers:
        - name: activitypub
          image: ghcr.io/tellmey18/activitypub:build-1
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: activitypub-credentials
          env:
            - name: NODE_ENV
              value: "development"
            - name: MYSQL_HOST
              value: "proxysql-ghost.mysql-ghost.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: "activitypub"
            - name: S3_ENDPOINT
              value: "http://rustfs-storage-io.rustfs-clusters.svc:9000"
            - name: S3_BUCKET_NAME
              value: "activitypub"
            - name: S3_PUBLIC_HOSTING_URL
              value: "https://s3.tellmey.fyi/activitypub"
            - name: S3_REGION
              value: "us-east-1"
            # Fedify KV store: uses MySQL by default (no FEDIFY_KV_STORE_TYPE set)
            # Redis Cluster mode is hardcoded upstream — standalone Valkey won't work.
            - name: USE_MQ
              value: "true"
            - name: MQ_PUBSUB_PROJECT_ID
              value: "activitypub"
            - name: MQ_PUBSUB_HOST
              value: "pubsub-ap.ghost.svc:8085"
            - name: PUBSUB_EMULATOR_HOST
              value: "pubsub-ap.ghost.svc:8085"
            - name: GCP_PROJECT_ID
              value: "activitypub"
            - name: MQ_PUBSUB_TOPIC_NAME
              value: "fedify-topic"
            - name: MQ_PUBSUB_RETRY_TOPIC_NAME
              value: "fedify-retry-topic"
            - name: MQ_PUBSUB_USE_RETRY_TOPIC
              value: "true"
            - name: MQ_PUBSUB_MAX_DELIVERY_ATTEMPTS
              value: "5"
            - name: MQ_PUBSUB_GHOST_TOPIC_NAME
              value: "ghost-topic"
            - name: FEDIFY_PUSH_ENDPOINT
              value: "http://activitypub-svc.ghost.svc:8080/.ghost/activitypub/pubsub/fedify/push"
            - name: FEDIFY_RETRY_PUSH_ENDPOINT
              value: "http://activitypub-svc.ghost.svc:8080/.ghost/activitypub/pubsub/fedify/push"
            - name: GHOST_PUSH_ENDPOINT
              value: "http://activitypub-svc.ghost.svc:8080/.ghost/activitypub/pubsub/ghost/push"
            - name: FEDIFY_TOPIC_NAME
              value: "fedify-topic"
            - name: FEDIFY_SUBSCRIPTION_NAME
              value: "fedify-subscription"
            - name: FEDIFY_RETRY_TOPIC_NAME
              value: "fedify-retry-topic"
            - name: FEDIFY_RETRY_SUBSCRIPTION_NAME
              value: "fedify-subscription-retry"
            - name: GHOST_TOPIC_NAME
              value: "ghost-topic"
            - name: GHOST_SUBSCRIPTION_NAME
              value: "ghost-subscription"
            - name: ALLOW_PRIVATE_ADDRESS
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: activitypub-svc
  namespace: ghost
spec:
  selector:
    app.kubernetes.io/name: activitypub
  ports:
    - name: http
      port: 8080
      targetPort: 8080
