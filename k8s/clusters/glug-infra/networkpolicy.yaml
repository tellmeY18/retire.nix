---
# networkpolicy.yaml — Default-deny + explicit allow NetworkPolicies for the
# cnpg-clusters namespace.
#
# Defense in depth: even though the cluster is reachable only over the
# tailnet, NetworkPolicies prevent an accidentally-exposed pod (e.g. a
# misconfigured debug Deployment in this namespace) from contacting the
# database without an explicit allow rule.
#
# k3s ships kube-router alongside flannel specifically for NetworkPolicy
# enforcement. These rules ARE actively enforced — they are not documentary.
#
# Four rules:
#   1. Default-deny ingress for the namespace.
#   2. Allow ingress to the PgBouncer pods on 5432 from:
#        - the Tailscale operator's ts-proxy pods (namespace: tailscale).
#        - other pods in cnpg-clusters (so the CNPG operator's probes /
#          backup pods can connect).
#      And on 9127 (PgBouncer exporter metrics) from:
#        - Prometheus (namespace: monitoring) via PodMonitor.
#   3. Allow ingress to the CNPG instance pods on 5432 from PgBouncer pods
#      AND from the CNPG operator namespace (cnpg-system), on 9187
#      (CNPG metrics) from the monitoring namespace (Prometheus scrape),
#      and on 8000 (instance manager health/status) from the operator
#      namespace.
#   4. Allow egress from PgBouncer pods to the postgres-cluster-rw Service
#      and to the Kubernetes API (for auth-query lookups).
#
# Label reference (from `kubectl get pods --show-labels`):
#   Postgres instances:  cnpg.io/cluster=postgres-cluster
#   PgBouncer poolers:   cnpg.io/poolerName=postgres-cluster-pooler-rw
#
# IMPORTANT: The CNPG Cluster object is named `postgres-cluster`
# (Helm release `postgres` + chart `cluster`). All label selectors in
# this file MUST use `postgres-cluster`, not `postgres`.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cnpg-clusters
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {} # all pods
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pooler-ingress
  namespace: cnpg-clusters
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      cnpg.io/poolerName: postgres-cluster-pooler-rw
  policyTypes:
    - Ingress
  ingress:
    # Rule 1: Client SQL traffic (5432) from tailscale and intra-namespace.
    - from:
        # Tailscale ts-proxy pods (the LoadBalancer-mode operator targets).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
        # Other pods in this namespace (CNPG operator probes, backup jobs).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-clusters
      ports:
        - protocol: TCP
          port: 5432
    # Rule 2: Prometheus scrapes PgBouncer exporter metrics on port 9127
    # via PodMonitor. Only the monitoring namespace needs access.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9127 # PgBouncer exporter metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  namespace: cnpg-clusters
  labels:
    app.kubernetes.io/part-of: cloudnative-pg
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      # CNPG Cluster name = <helm-release>-<chart> = postgres-cluster.
      cnpg.io/cluster: postgres-cluster
  policyTypes:
    - Ingress
  ingress:
    # Rule 1: SQL traffic (5432) + metrics (9187) from authorised sources.
    - from:
        # PgBouncer pods (the only intended SQL clients of the primary).
        - podSelector:
            matchLabels:
              cnpg.io/poolerName: postgres-cluster-pooler-rw
        # CNPG operator namespace — operator probes, status reconciliation,
        # backup jobs, and WAL archiving coordination.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        # Replica ↔ primary streaming replication is intra-namespace; allow
        # CNPG instance pods to reach each other on the replication port.
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
        # VMAgent (victoria-metrics-k8s-stack) scrapes CNPG instance and
        # PgBouncer metrics on port 9187 via VMPodScrape.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # Changala app connects directly to postgres-cluster-rw:5432.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: changala
        # Apache Answer connects directly to postgres-cluster-rw:5432.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: answer
      ports:
        - protocol: TCP
          port: 5432 # Postgres
        - protocol: TCP
          port: 9187 # CNPG metrics (PodMonitor scrape)
    # Rule 2: Instance manager health/status endpoint (8000).
    # The CNPG operator polls this port to extract instance status, trigger
    # fencing, and coordinate switchovers. Without this rule the operator
    # reports "Instance Status Extraction Error: HTTP communication issue".
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
        # Instance pods also expose :8000 to each other for the pg_rewind
        # and fence-lifting protocol during automated failover.
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres-cluster
      ports:
        - protocol: TCP
          port: 8000 # CNPG instance manager
