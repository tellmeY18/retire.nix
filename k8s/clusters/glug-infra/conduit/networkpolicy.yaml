---
# Default deny ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: conduit
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# Allow ingress to Tuwunel from Traefik + Tailscale proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-conduit-ingress
  namespace: conduit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: conduit
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8008
          protocol: TCP
---
# Allow egress: federation (HTTPS), RustFS S3, DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-conduit-egress
  namespace: conduit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: conduit
  policyTypes:
    - Egress
  egress:
    # DNS
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # RustFS S3
    - ports:
        - port: 9000
          protocol: TCP
    # Federation — HTTPS to other Matrix servers
    - ports:
        - port: 443
          protocol: TCP
        - port: 8448
          protocol: TCP
