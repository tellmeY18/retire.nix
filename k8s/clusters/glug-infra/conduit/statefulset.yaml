---
# statefulset.yaml — Conduit Matrix homeserver.
#
# Conduit uses RocksDB for its database, which requires
# persistent local storage. PVC is backed by zfs-localpv
# (restricted to storage nodes via StorageClass topology).
#
# Media files (user uploads) are stored in RustFS S3.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: conduit
  namespace: conduit
  labels:
    app.kubernetes.io/name: conduit
    app.kubernetes.io/component: homeserver
    app.kubernetes.io/part-of: conduit
spec:
  replicas: 1
  serviceName: conduit-svc
  selector:
    matchLabels:
      app.kubernetes.io/name: conduit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conduit
        app.kubernetes.io/component: homeserver
        app.kubernetes.io/part-of: conduit
    spec:
      tolerations:
        - key: node-role.glug.infra/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: conduit
          image: docker.io/matrixconduit/matrix-conduit:latest
          ports:
            - name: matrix
              containerPort: 6167
              protocol: TCP

          envFrom:
            - secretRef:
                name: conduit-credentials

          env:
            # Config via env only (no config file needed)
            - name: CONDUIT_CONFIG
              value: ""

            # Server identity
            - name: CONDUIT_SERVER_NAME
              value: "chat.tellmey.fyi"
            - name: CONDUIT_ADDRESS
              value: "0.0.0.0"
            - name: CONDUIT_PORT
              value: "6167"

            # Database (RocksDB on PVC)
            - name: CONDUIT_DATABASE_BACKEND
              value: "rocksdb"
            - name: CONDUIT_DATABASE_PATH
              value: "/var/lib/matrix-conduit/"
            - name: CONDUIT_DB_CACHE_CAPACITY_MB
              value: "300.0"

            # Registration & access — admin-only via token from credentials Secret
            - name: CONDUIT_ALLOW_REGISTRATION
              value: "false"
            - name: CONDUIT_ALLOW_FEDERATION
              value: "true"
            - name: CONDUIT_ALLOW_ENCRYPTION
              value: "true"
            - name: CONDUIT_ALLOW_ROOM_CREATION
              value: "true"
            - name: CONDUIT_ALLOW_UNSTABLE_ROOM_VERSIONS
              value: "false"
            - name: CONDUIT_DEFAULT_ROOM_VERSION
              value: '"10"'

            # Federation — well-known delegation
            - name: CONDUIT_WELL_KNOWN_SERVER
              value: "chat.tellmey.fyi:443"
            - name: CONDUIT_WELL_KNOWN_CLIENT
              value: "https://chat.tellmey.fyi"

            # Federation key trust
            - name: CONDUIT_TRUSTED_SERVERS
              value: '["matrix.org"]'

            # Performance
            - name: CONDUIT_MAX_REQUEST_SIZE
              value: "20000000"
            - name: CONDUIT_MAX_CONCURRENT_REQUESTS
              value: "100"

            # S3 media backend (RustFS)
            - name: CONDUIT_GLOBAL_MEDIA_BACKEND
              value: "s3"
            - name: CONDUIT_GLOBAL_MEDIA_ENDPOINT
              value: "http://rustfs-storage-io.rustfs-clusters.svc:9000"
            - name: CONDUIT_GLOBAL_MEDIA_BUCKET
              value: "conduit"
            - name: CONDUIT_GLOBAL_MEDIA_REGION
              value: "us-east-1"

          volumeMounts:
            - name: data
              mountPath: /var/lib/matrix-conduit/

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          livenessProbe:
            tcpSocket:
              port: 6167
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 6167
            initialDelaySeconds: 15
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: zfs-localpv
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: conduit-svc
  namespace: conduit
spec:
  selector:
    app.kubernetes.io/name: conduit
  ports:
    - name: matrix
      port: 6167
      targetPort: 6167
      protocol: TCP
