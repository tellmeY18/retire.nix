---
# statefulset.yaml — Tuwunel Matrix homeserver.
#
# Replaces the original Conduit deployment. Tuwunel is the Construct
# fork of Conduit / conduwuit with MSC3967 support and many fixes.
#
# RocksDB database on zfs-localpv PVC (pinned to storage nodes).
# Media stored on local filesystem (under database_path/media/).
# TODO: configure S3 storage provider via ConfigMap once Tuwunel's
# nested TOML env var syntax supports the storage_provider section.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: conduit
  namespace: conduit
  labels:
    app.kubernetes.io/name: conduit
    app.kubernetes.io/component: homeserver
    app.kubernetes.io/part-of: conduit
spec:
  replicas: 1
  serviceName: conduit-svc
  selector:
    matchLabels:
      app.kubernetes.io/name: conduit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: conduit
        app.kubernetes.io/component: homeserver
        app.kubernetes.io/part-of: conduit
    spec:
      tolerations:
        - key: node-role.glug.infra/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: tuwunel
          image: ghcr.io/matrix-construct/tuwunel:latest
          ports:
            - name: matrix
              containerPort: 8008
              protocol: TCP

          env:
            # Server identity
            - name: CONDUIT_SERVER_NAME
              value: "chat.tellmey.fyi"
            - name: CONDUIT_ADDRESS
              value: "0.0.0.0"
            - name: CONDUIT_PORT
              value: "8008"

            # Database (RocksDB on PVC)
            - name: CONDUIT_DATABASE_PATH
              value: "/var/lib/matrix-conduit/"

            # Registration & access
            - name: CONDUIT_ALLOW_REGISTRATION
              value: "false"
            - name: CONDUIT_ALLOW_FEDERATION
              value: "true"
            - name: CONDUIT_ALLOW_ENCRYPTION
              value: "true"
            - name: CONDUIT_ALLOW_ROOM_CREATION
              value: "true"
            - name: CONDUIT_DEFAULT_ROOM_VERSION
              value: '"10"'

            # Federation — well-known delegation (TUWUNEL_ prefix
            # for nested TOML: [global.well_known])
            - name: TUWUNEL_WELL_KNOWN__CLIENT
              value: "https://chat.tellmey.fyi"
            - name: TUWUNEL_WELL_KNOWN__SERVER
              value: "chat.tellmey.fyi:443"

            # Federation key trust
            - name: CONDUIT_TRUSTED_SERVERS
              value: '["matrix.org"]'

            # Performance
            - name: CONDUIT_MAX_REQUEST_SIZE
              value: "20000000"

            # Registration token (from existing sops-encrypted secret)
            - name: TUWUNEL_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: conduit-credentials
                  key: CONDUIT_REGISTRATION_TOKEN

          volumeMounts:
            - name: data
              mountPath: /var/lib/matrix-conduit/

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL

          livenessProbe:
            tcpSocket:
              port: 8008
            initialDelaySeconds: 30
            periodSeconds: 30

          readinessProbe:
            httpGet:
              path: /_matrix/client/versions
              port: 8008
            initialDelaySeconds: 15
            periodSeconds: 10

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: zfs-localpv
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: conduit-svc
  namespace: conduit
spec:
  selector:
    app.kubernetes.io/name: conduit
  ports:
    - name: matrix
      port: 8008
      targetPort: 8008
      protocol: TCP
