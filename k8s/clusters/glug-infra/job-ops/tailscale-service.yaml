---
# Tailscale — exposes JobOps on the tailnet only (no public funnel).
# Tailnet URL: https://job-ops.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: job-ops-tailscale
  namespace: job-ops
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: job-ops-svc
      port:
        number: 3001
  tls:
    - hosts:
        - job-ops
