# NOTE: This Job references a "postgres-superuser" secret which must exist in
# the attic namespace. Since Kubernetes does not allow cross-namespace secret
# references, copy it from cnpg-clusters before running the Job:
#
#   kubectl get secret postgres-cluster-superuser -n cnpg-clusters -o json \
#     | jq 'del(.metadata.namespace, .metadata.resourceVersion, .metadata.uid, .metadata.creationTimestamp)' \
#     | jq '.metadata.namespace = "attic"' \
#     | jq '.metadata.name = "postgres-superuser"' \
#     | kubectl apply -f -
#
# Alternatively, create a sops-encrypted copy of the superuser credentials
# in this directory and reference that instead.
apiVersion: batch/v1
kind: Job
metadata:
  name: attic-db-init
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: db-init
    app.kubernetes.io/part-of: nix-infra
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
        app.kubernetes.io/component: db-init
        app.kubernetes.io/part-of: nix-infra
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-init
          image: postgres:17-alpine
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              echo "Initializing Attic database and user..."

              # Connect as superuser to the default 'postgres' database
              export PGHOST="postgres-cluster-rw.cnpg-clusters.svc"
              export PGPORT="5432"
              export PGDATABASE="postgres"

              # Create the attic role if it doesn't exist, or update password
              psql <<EOF
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'attic') THEN
                  CREATE ROLE attic WITH LOGIN PASSWORD '${ATTIC_DB_PASSWORD}';
                  RAISE NOTICE 'Created role attic';
                ELSE
                  ALTER ROLE attic WITH PASSWORD '${ATTIC_DB_PASSWORD}';
                  RAISE NOTICE 'Updated password for role attic';
                END IF;
              END
              \$\$;
              EOF

              # Create the database if it doesn't exist
              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'attic'" | grep -q 1; then
                psql -c "CREATE DATABASE attic OWNER attic;"
                echo "Created database attic"
              else
                echo "Database attic already exists"
              fi

              # Ensure privileges
              psql -c "GRANT ALL PRIVILEGES ON DATABASE attic TO attic;"
              echo "Done — Attic database is ready."
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-superuser
                  key: password
            - name: ATTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: attic-credentials
                  key: ATTIC_DB_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
