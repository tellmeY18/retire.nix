---
# gc-cronjob.yaml — Weekly garbage collection for the Attic binary cache.
#
# Attic's server-side `default-retention-period` (config.yaml, 14 days) only
# marks paths as eligible; actual pruning is done by atticd itself running in
# `garbage-collector-once` mode. GC is NOT a client API call — the previous
# design (hand-crafted `{"scope":"delete"}` JWT + `attic gc`) was invalid on
# both sides: the claim schema was wrong for Attic authorization, and the
# client has no gc command. This job never succeeded.
#
# This job renders the same server.toml as the deployment (DB + S3 creds from
# the attic-credentials secret) and runs the GC pass directly against
# PostgreSQL/R2. No tokens involved.
#
# Schedule: 6 AM UTC every Sunday — outside working hours.
# Retention: 14 days (set in config.yaml).
# Steady state: ~2 weekly CI runs' worth of data, safely under R2's 10GB free tier.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: attic-gc
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: gc
    app.kubernetes.io/part-of: nix-infra
spec:
  schedule: "0 6 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  # Keep failed Jobs around long enough to actually diagnose them (≥7 days;
  # see ttlSecondsAfterFinished below which enforces the time-based cleanup).
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      # 7 days — a failed weekend run must still be inspectable the next week.
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Same config-render pattern as the atticd deployment.
            - name: render-config
              # Pinned digest — `latest` can silently change server/schema
              # version on restart. Same digest as deployment.yaml; update
              # both together.
              image: ghcr.io/zhaofengli/attic@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
              command: ["sh", "-c"]
              args:
                - |
                  sed \
                    -e "s|\${ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64}|$ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64|g" \
                    -e "s|\${ATTIC_DB_PASSWORD}|$ATTIC_DB_PASSWORD|g" \
                    /etc/attic-template/server.toml > /etc/attic/server.toml
              envFrom:
                - secretRef:
                    name: attic-credentials
              volumeMounts:
                - name: config-template
                  mountPath: /etc/attic-template
                  readOnly: true
                - name: config-rendered
                  mountPath: /etc/attic
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  cpu: 100m
                  memory: 32Mi
          containers:
            - name: attic-gc
              image: ghcr.io/zhaofengli/attic@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
              command: ["atticd"]
              args:
                - "--config"
                - "/etc/attic/server.toml"
                - "--mode"
                - "garbage-collector-once"
              envFrom:
                - secretRef:
                    name: attic-credentials
              volumeMounts:
                - name: config-rendered
                  mountPath: /etc/attic
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
          volumes:
            - name: config-template
              configMap:
                name: attic-config
            - name: config-rendered
              emptyDir:
                sizeLimit: 1Mi
