---
# gc-cronjob.yaml — Weekly garbage collection for the Attic binary cache.
#
# Attic's server-side `default-retention-period` marks paths as eligible
# for deletion, but the actual pruning requires a client-side `attic gc`
# call. This CronJob connects to the local atticd, generates a short-lived
# JWT from the shared HS256 secret, and runs GC on the `system` cache.
#
# Schedule: 6 AM UTC every Sunday — outside working hours.
# Retention: 14 days (set in config.yaml).
# Steady state: ~2 weekly CI runs' worth of data, safely under R2's 10GB free tier.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: attic-gc
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: gc
    app.kubernetes.io/part-of: nix-infra
spec:
  schedule: "0 6 * * 0"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: attic-gc
              image: ghcr.io/zhaofengli/attic:latest
              command:
                - sh
                - -c
                - |
                  set -euo pipefail

                  # Decode the HS256 signing secret
                  HS256_SECRET=$(echo "$ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64" | base64 -d)

                  # Build a short-lived JWT with delete scope
                  b64url() { echo -n "$1" | base64 -w0 | tr '+/' '-_' | tr -d '='; }
                  NOW=$(date +%s)
                  HEADER='{"alg":"HS256","typ":"JWT"}'
                  PAYLOAD='{"sub":"gc-bot","scope":"delete","iat":'"$NOW"',"exp":'"$((NOW + 3600))"'}'
                  HEADER_B64=$(b64url "$HEADER")
                  PAYLOAD_B64=$(b64url "$PAYLOAD")
                  SIG_INPUT="$HEADER_B64.$PAYLOAD_B64"
                  SIG=$(echo -n "$SIG_INPUT" | openssl dgst -sha256 -hmac "$HS256_SECRET" -binary | base64 -w0 | tr '+/' '-_' | tr -d '=')
                  JWT="$HEADER_B64.$PAYLOAD_B64.$SIG"

                  # Login and run GC
                  attic login gc-bot "http://attic-svc.attic.svc:8080" "$JWT"
                  attic gc system
              envFrom:
                - secretRef:
                    name: attic-credentials
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                capabilities:
                  drop:
                    - ALL
                seccompProfile:
                  type: RuntimeDefault
