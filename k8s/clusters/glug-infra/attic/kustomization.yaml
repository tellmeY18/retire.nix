apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config.yaml
  # credentials-secret.enc.yaml is sops-encrypted — applied separately:
  #   sops --decrypt credentials-secret.enc.yaml | kubectl apply -f -
  # db-init-job.yaml is a one-time setup job (already completed).
  # Re-running it fails because it expects a cross-namespace secret.
  # Only apply manually if re-initializing the database.
  #
  # db-migrations-job.yaml is also applied manually — a Job spec is
  # immutable, so including it here would break `kubectl apply -k` on the
  # second run. It MUST be run before rolling the Deployment whenever the
  # attic image digest changes, because the Deployment runs
  # `--mode api-server` and therefore no longer migrates on startup.
  # See the header of that file for the exact sequence.
  - deployment.yaml
  - tailscale-service.yaml
  - ingress-traefik.yaml
  - gc-cronjob.yaml
