---
# hpa.yaml — HorizontalPodAutoscaler for Attic.
# Scales 1→4 replicas based on CPU utilization.
# CI pushes cause CPU spikes; HPA adds pods during bulk uploads.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: attic
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/part-of: nix-infra
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: attic
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
