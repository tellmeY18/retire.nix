---
# ingress-traefik.yaml — Expose Attic publicly via Traefik (replaces the
# Tailscale Funnel, which is bandwidth-limited and times out on large
# binary-cache pushes from CI).
#
# Public URL: https://cache.tellmey.fyi  → direct HTTPS to the kenobi OCI VM
# (68.233.115.209), no Tailscale edge relay. TLS via Let's Encrypt (ACME).
#
# Security: writes require a valid Attic JWT (sops `attic_token`); reads are
# public (cache is_public=true). Traefik only provides the public ingress
# path — auth is still enforced by Attic.
#
# DNS required: cache.tellmey.fyi  A  68.233.115.209
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: attic-traefik
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache-ingress
    app.kubernetes.io/part-of: nix-infra
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cache.tellmey.fyi`)
      kind: Rule
      services:
        - name: attic-svc
          port: 8080
  tls:
    certResolver: letsencrypt
---
# HTTP → HTTPS redirect for Attic.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: attic-traefik-redirect
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/part-of: nix-infra
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`cache.tellmey.fyi`)
      kind: Rule
      middlewares:
        - name: redirect-to-https
          namespace: traefik-system
      services:
        - name: attic-svc
          port: 8080
