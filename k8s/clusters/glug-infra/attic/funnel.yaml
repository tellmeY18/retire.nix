---
# attic-funnel.yaml — Expose Attic to the public internet via Tailscale Funnel.
#
# This allows CI (GitHub Actions) to push binaries to Attic without needing
# a Tailscale node in the runner. Standard HTTPS, no WireGuard required.
#
# Traffic path:
#   CI runner (GitHub Actions)
#     → https://attic-push.<tailnet>.ts.net  (Tailscale Funnel, TLS terminated)
#     → ts-proxy pod                          (Ingress-managed)
#     → attic-svc ClusterIP                   (port 8080)
#     → Attic pods                            (port 8080, API)
#
# Security: writes require a valid JWT token (in sops). Reads are public
# (cache is configured with is_public=true). The Funnel only adds a public
# ingress path — auth is still enforced by Attic itself.
#
# Prerequisites:
#   - Tailscale Kubernetes operator installed
#   - Tailscale ACL: Funnel enabled for tag:k8s
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attic-funnel
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache-funnel
    app.kubernetes.io/part-of: nix-infra
  annotations:
    tailscale.com/funnel: "true"
    tailscale.com/tags: "tag:k8s"
spec:
  defaultBackend:
    service:
      name: attic-svc
      port:
        number: 8080
  ingressClassName: tailscale
  tls:
    - hosts:
        - attic-push
