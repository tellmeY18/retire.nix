apiVersion: v1
kind: ConfigMap
metadata:
  name: attic-config
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
data:
  server.toml: |
    # Attic server configuration
    # See: https://github.com/zhaofengli/attic

    listen = "[::]:8080"

    # Disable proof-of-possession for simpler CI integration
    require-proof-of-possession = false

    # Database connection
    [database]
    url = "postgresql://attic:${ATTIC_DB_PASSWORD}@postgres-cluster-pooler-rw.cnpg-clusters.svc:5432/attic"

    # S3-compatible object storage (RustFS)
    [storage]
    type = "s3"
    endpoint = "http://rustfs-storage-io.rustfs-clusters.svc:9000"
    bucket = "attic"
    region = "us-east-1"

    # Content-addressed chunking for deduplication.
    # Tuned for THROUGHPUT over a high-latency homelab S3 (RustFS): each chunk
    # is a separate S3 PUT + DB insert, so the stock 64KB-average chunking made
    # a 4MB path ~64 round-trips (~30KB/s). Larger chunks (1MB avg) + a 1MB
    # "store whole" threshold cut round-trips ~16x at a small dedup-granularity
    # cost.
    [chunking]
    nar-size-threshold = 1048576
    min-size = 262144
    avg-size = 1048576
    max-size = 4194304

    # Compression
    [compression]
    type = "zstd"

    # Garbage collection
    [garbage-collection]
    default-retention-period = "6 months"

    # JWT signing
    [jwt.signing]
    token-hs256-secret-base64 = "${ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64}"
