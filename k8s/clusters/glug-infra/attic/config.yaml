apiVersion: v1
kind: ConfigMap
metadata:
  name: attic-config
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
data:
  server.toml: |
    # Attic server configuration
    # See: https://github.com/zhaofengli/attic

    [listen]
    address = "0.0.0.0:8080"

    # JWT token signing — uses HS256 secret from environment variable
    [token]
    hs256-secret-base64 = "${ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64}"

    # Database connection — password injected via environment variable
    [database]
    url = "postgresql://attic:${ATTIC_DB_PASSWORD}@postgres-cluster-pooler-rw.cnpg-clusters.svc:5432/attic"

    # S3-compatible object storage (RustFS)
    [storage]
    type = "s3"

    [storage.s3]
    endpoint = "http://rustfs-storage-io.rustfs-clusters.svc:9000"
    bucket = "attic"
    region = "us-east-1"
    force-path-style = true
    # Credentials read from AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY env vars

    # Content-addressed chunking for deduplication
    [chunking]
    nar-size-threshold = 65536
    min-size = 16384
    avg-size = 65536
    max-size = 262144

    # Compression algorithm
    [compression]
    type = "zstd"

    # Garbage collection
    [garbage-collection]
    default-retention-period = "6 months"

    # Disable proof-of-possession for simpler CI integration
    # (clients don't need to prove they have the NAR before uploading)
    [security]
    require-proof-of-possession = false
