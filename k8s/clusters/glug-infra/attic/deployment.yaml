apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: nix-infra
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-config
          image: ghcr.io/zhaofengli/attic:latest
          command: ["sh", "-c"]
          args:
            - |
              sed \
                -e "s|\${ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64}|$ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64|g" \
                -e "s|\${ATTIC_DB_PASSWORD}|$ATTIC_DB_PASSWORD|g" \
                /etc/attic-template/server.toml > /etc/attic/server.toml
          envFrom:
            - secretRef:
                name: attic-credentials
          volumeMounts:
            - name: config-template
              mountPath: /etc/attic-template
              readOnly: true
            - name: config-rendered
              mountPath: /etc/attic
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: atticd
          image: ghcr.io/zhaofengli/attic:latest
          command: ["atticd"]
          args: ["--config", "/etc/attic/server.toml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: attic-credentials
          volumeMounts:
            - name: config-rendered
              mountPath: /etc/attic
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config-template
          configMap:
            name: attic-config
        - name: config-rendered
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: attic-svc
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: attic
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
