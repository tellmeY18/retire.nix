apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
spec:
  # Attic is stateless (state in PostgreSQL + S3). Single replica reduces
  # resource pressure on kenobi when CI is idle. HPA manages scaling:
  # min 1, max 4 based on CPU.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: nix-infra
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # All Attic pods on kenobi — our beefiest machine (compute powerhouse).
      # No topology spread needed; kenobi has the resources for it.
      nodeSelector:
        kubernetes.io/hostname: kenobi
      initContainers:
        - name: render-config
          # Pinned digest — `latest` can silently change server/client/schema
          # version on any pod restart. Same digest in gc-cronjob.yaml;
          # update both together.
          image: ghcr.io/zhaofengli/attic@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
          command: ["sh", "-c"]
          args:
            - |
              sed \
                -e "s|\${ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64}|$ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64|g" \
                -e "s|\${ATTIC_DB_PASSWORD}|$ATTIC_DB_PASSWORD|g" \
                /etc/attic-template/server.toml > /etc/attic/server.toml
          envFrom:
            - secretRef:
                name: attic-credentials
          volumeMounts:
            - name: config-template
              mountPath: /etc/attic-template
              readOnly: true
            - name: config-rendered
              mountPath: /etc/attic
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: atticd
          image: ghcr.io/zhaofengli/attic@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
          command: ["atticd"]
          args: ["--config", "/etc/attic/server.toml"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: attic-credentials
          volumeMounts:
            - name: config-rendered
              mountPath: /etc/attic
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 768Mi
            limits:
              # CI pushes entire NixOS closures (hundreds of paths).
              # Attic buffers chunks in memory for dedup before writing
              # to S3. 512Mi OOMKills during bulk pushes.
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config-template
          configMap:
            name: attic-config
        - name: config-rendered
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: attic-svc
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: attic
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# PodDisruptionBudget — ensure at least 1 Attic pod stays up during
# voluntary disruptions (node drain, rolling updates, etc.).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: attic
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/part-of: nix-infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
