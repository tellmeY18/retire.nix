apiVersion: apps/v1
kind: Deployment
metadata:
  name: attic
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
spec:
  # Attic is stateless (state in PostgreSQL + S3). Six replicas spread
  # across chopper + c3po (8-core boxes, <5% CPU used — compute was never
  # the bottleneck). Each replica carries its own internal SQLx DB pool
  # (~10 conns, hardcoded upstream, not a k8s resource limit), so replicas
  # scale DB throughput directly — they connect to Postgres
  # (max_connections=100) directly, not the PgBouncer pooler. Bumped from
  # 4->6 (40->60 conns) after CI push bursts saturated the 4-replica pool
  # ("Connection pool timed out" -> 500s on reads/writes) while Postgres
  # itself sat under 30 total connections — i.e. per-pod SQLx pool
  # exhaustion, not a Postgres or node capacity problem.
  #
  # The 4->6 bump treated a symptom. The two actual causes were:
  #   1. Every replica ran in the default `monolithic` mode, which also
  #      spawns a periodic garbage collector AND runs DB migrations at
  #      startup. Six replicas therefore meant six background GC loops
  #      (12h interval) and a six-way migration race against one database.
  #      Fixed by `--mode api-server` below.
  #   2. Multi-chunk NARs were reassembled in-process, holding a DB
  #      connection for the entire multi-minute stream. Fixed by disabling
  #      chunking in config.yaml so NARs are served as 307 redirects to
  #      presigned R2 URLs.
  # With both fixed, connections are held for milliseconds rather than
  # minutes, so 6 replicas is now generous — revisit dropping back to 4
  # once the change has soaked.
  #
  # Do NOT reintroduce an HPA — it pinned itself to max under any push
  # load and starved the node without fixing the actual (DB-pool) bottleneck.
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: attic
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: nix-infra
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # Run on the storage nodes (chopper, c3po — 8 cores each, lightly
      # loaded) and keep OFF kenobi: it has 2 cores and is the only etcd
      # voter, so a push-load burst there starves the control plane.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [chopper, c3po]
        podAntiAffinity:
          # Spread replicas across the two nodes (soft — still schedules
          # if one node is down).
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: attic
                topologyKey: kubernetes.io/hostname
      tolerations:
        - key: node-role.glug.infra/storage
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: node-role.glug.infra/storage-only
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      initContainers:
        - name: render-config
          # Pinned digest — `latest` can silently change server/client/schema
          # version on any pod restart. Same digest in gc-cronjob.yaml;
          # update both together.
          image: ghcr.io/zhaofengli/attic@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
          command: ["sh", "-c"]
          args:
            - |
              sed \
                -e "s|\${ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64}|$ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64|g" \
                -e "s|\${ATTIC_DB_PASSWORD}|$ATTIC_DB_PASSWORD|g" \
                /etc/attic-template/server.toml > /etc/attic/server.toml
          envFrom:
            - secretRef:
                name: attic-credentials
          volumeMounts:
            - name: config-template
              mountPath: /etc/attic-template
              readOnly: true
            - name: config-rendered
              mountPath: /etc/attic
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: atticd
          image: ghcr.io/zhaofengli/attic@sha256:18574aba70fc89d2b695273fbe2e7b2f8ad7e8e786b4cc535124fbe14bada1d0
          command: ["atticd"]
          # --mode api-server: serve the HTTP API ONLY.
          #
          # The default (`monolithic`) additionally runs DB migrations at
          # startup and spawns a periodic garbage-collection loop
          # (server/src/main.rs). With 6 replicas that produced 6 competing
          # GC loops plus a 6-way migration race against one Postgres — GC's
          # bulk mark/delete transactions starved `get_nar` of connections
          # and returned 500s after a 30s pool timeout.
          #
          # Consequence: migrations are NOT run here. After bumping the
          # image digest you MUST run db-migrations-job.yaml first, or the
          # new pods will run against an unmigrated schema. See that file.
          args: ["--config", "/etc/attic/server.toml", "--mode", "api-server"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: attic-credentials
          volumeMounts:
            - name: config-rendered
              mountPath: /etc/attic
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              # chopper/c3po are 8-core nodes under 10% requested — honest
              # requests are affordable here.
              cpu: 500m
              memory: 768Mi
            limits:
              # CI pushes entire NixOS closures (hundreds of paths).
              # Attic buffers chunks in memory for dedup before writing
              # to S3. 512Mi OOMKills during bulk pushes.
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config-template
          configMap:
            name: attic-config
        - name: config-rendered
          emptyDir:
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: attic-svc
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: attic
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
# PodDisruptionBudget — ensure at least 1 Attic pod stays up during
# voluntary disruptions (node drain, rolling updates, etc.).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: attic
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/part-of: nix-infra
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: attic
