# PLACEHOLDER — encrypt this file with sops before committing:
#   sops --encrypt --in-place k8s/clusters/glug-infra/attic/credentials-secret.enc.yaml
#
# Generate the JWT signing key with:
#   openssl rand -base64 64
#
# Get RustFS credentials from the rustfs-credentials secret:
#   kubectl get secret rustfs-credentials -n rustfs-clusters -o jsonpath='{.data.accesskey}' | base64 -d
#   kubectl get secret rustfs-credentials -n rustfs-clusters -o jsonpath='{.data.secretkey}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: attic-credentials
  namespace: attic
  labels:
    app.kubernetes.io/name: attic
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: nix-infra
type: Opaque
stringData:
  ATTIC_DB_PASSWORD: "CHANGEME"
  ATTIC_SERVER_TOKEN_HS256_SECRET_BASE64: "CHANGEME-generate-with-openssl-rand-base64-64"
  AWS_ACCESS_KEY_ID: "CHANGEME"
  AWS_SECRET_ACCESS_KEY: "CHANGEME"
