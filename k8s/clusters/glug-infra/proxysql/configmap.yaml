---
# configmap.yaml — ProxySQL non-sensitive configuration reference.
#
# The ACTUAL ProxySQL config (containing passwords) lives in the
# sops-encrypted Secret `proxysql-config-secret.enc.yaml`.
# This file exists only as documentation of the config structure.
#
# Hostgroup 10 = WRITER (primary PXC on chopper, durable ZFS storage)
# Hostgroup 20 = READER (RAM replica on kenobi, sub-ms latency)
#
# To edit the live config:
#   sops k8s/clusters/glug-infra/proxysql/proxysql-config-secret.enc.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxysql-config-docs
  namespace: proxysql
  labels:
    app: proxysql
data:
  README: |
    The ProxySQL config is in Secret/proxysql-config (sops-encrypted).
    Edit with: sops clusters/glug-infra/proxysql/proxysql-config-secret.enc.yaml
    Apply with: sops --decrypt ... | kubectl apply -f -

    IMPORTANT: Monitor is DISABLED (mysql-monitor_enabled=false) because
    the monitor user credentials don't match after DB user table import.
    ProxySQL trusts both backends are online without health checking.
    To re-enable: fix monitor user password on both MySQL instances,
    update monitor_password in the config, set monitor_enabled=true.
