---
# kustomization.yaml — kustomize entry point for the ProxySQL deployment.
#
# `kubectl apply -k k8s/clusters/glug-infra/proxysql`
#
# Deploys a standalone ProxySQL instance on kenobi that routes:
#   - SELECT queries → RAM replica (local, sub-ms latency)
#   - DML/DDL/transactions → primary PXC cluster (chopper, durable)
#   - Failover: if primary is unreachable, all traffic → RAM node
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: proxysql

labels:
  - pairs:
      app.kubernetes.io/part-of: proxysql
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - namespace.yaml
  - networkpolicy.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - tailscale-service.yaml
  # proxysql-config-secret.enc.yaml is sops-encrypted; applied separately:
  #   sops --decrypt proxysql-config-secret.enc.yaml | kubectl apply -f -
