---
# deployment.yaml — Standalone ProxySQL on kenobi (aarch64).
#
# Co-located with the RAM replica for minimal read latency.
# Uses the official multi-arch ProxySQL 3.0.8 image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxysql
  namespace: proxysql
  labels:
    app: proxysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxysql
  template:
    metadata:
      labels:
        app: proxysql
    spec:
      # Schedule on kenobi — co-located with RAM replica for read latency.
      nodeSelector:
        kubernetes.io/hostname: kenobi

      containers:
        - name: proxysql
          image: proxysql/proxysql:3.0.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
            - name: admin
              containerPort: 6032
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/proxysql.cnf
              subPath: proxysql.cnf
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 5
            periodSeconds: 5

      volumes:
        - name: config
          secret:
            secretName: proxysql-config
