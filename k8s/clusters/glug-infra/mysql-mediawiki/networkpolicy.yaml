---
# networkpolicy.yaml — NetworkPolicies for the mysql-mediawiki namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: mysql-mediawiki
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mysql-mediawiki-ingress
  namespace: mysql-mediawiki
spec:
  podSelector:
    matchLabels:
      app: mysql-mediawiki
  policyTypes:
    - Ingress
  ingress:
    - from:
        # MediaWiki pods (web + maintenance jobs).
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mediawiki
        # Monitoring scrapes metrics.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
        # Intra-namespace (backup CronJob, debug pods).
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 3306
