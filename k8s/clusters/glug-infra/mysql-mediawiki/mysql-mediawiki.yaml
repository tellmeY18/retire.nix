---
# mysql-mediawiki.yaml — Standalone Percona Server 8.0 for MediaWiki.
#
# Single replica pinned to kenobi, data on hostPath /var/lib/mysql-mediawiki
# (renamed from /var/lib/pxc-ram; created by hosts/kenobi/parts/storage.nix).
# Sole read-write backend for MediaWiki. Not HA — protected by the hourly S3
# backup CronJob. Renamed from the old `mysql-ram` StatefulSet.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-mediawiki
  namespace: mysql-mediawiki
  labels:
    app: mysql-mediawiki
    app.kubernetes.io/name: percona-server
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: mediawiki
spec:
  serviceName: mysql-mediawiki
  replicas: 1
  selector:
    matchLabels:
      app: mysql-mediawiki
  template:
    metadata:
      labels:
        app: mysql-mediawiki
        app.kubernetes.io/name: percona-server
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: mysql-mediawiki
    spec:
      nodeSelector:
        kubernetes.io/hostname: kenobi
      securityContext:
        fsGroup: 1001
      containers:
        - name: mysql
          image: percona/percona-server:8.0.45
          imagePullPolicy: IfNotPresent
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"
          volumeMounts:
            - name: datadir
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/my.cnf.d/my.cnf
              subPath: my.cnf
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.15.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9104
          args:
            - "--mysqld.address=localhost:3306"
            - "--mysqld.username=root"
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-mediawiki-root
                  key: password
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            tcpSocket:
              port: 9104
            initialDelaySeconds: 15
          readinessProbe:
            tcpSocket:
              port: 9104
            initialDelaySeconds: 5
        - name: prewarm
          image: percona/percona-server:8.0.45
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL to be ready..."
              for i in $(seq 1 60); do
                if mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent 2>/dev/null; then
                  echo "MySQL is up, prewarming user tables into buffer pool..."
                  mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" -N -e "
                    SELECT CONCAT('SELECT COUNT(*) FROM \`', table_schema, '\`.\`', table_name, '\`;')
                    FROM information_schema.tables
                    WHERE table_schema NOT IN ('information_schema','performance_schema','sys','mysql')
                      AND table_type = 'BASE TABLE';
                  " 2>/dev/null | mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" 2>/dev/null
                  echo "Buffer pool prewarmed. Sleeping."
                  break
                fi
                sleep 2
              done
              exec sleep infinity
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-mediawiki-root
                  key: password
                  optional: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
      volumes:
        - name: datadir
          hostPath:
            path: /var/lib/mysql-mediawiki
            type: Directory
        - name: config
          configMap:
            name: mysql-mediawiki-config
---
# Headless Service (DNS: mysql-mediawiki-0.mysql-mediawiki.mysql-mediawiki.svc)
apiVersion: v1
kind: Service
metadata:
  name: mysql-mediawiki
  namespace: mysql-mediawiki
  labels:
    app: mysql-mediawiki
spec:
  clusterIP: None
  selector:
    app: mysql-mediawiki
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
# Stable ClusterIP Service — MediaWiki connects here:
#   mysql-mediawiki-db.mysql-mediawiki.svc.cluster.local:3306
apiVersion: v1
kind: Service
metadata:
  name: mysql-mediawiki-db
  namespace: mysql-mediawiki
  labels:
    app: mysql-mediawiki
spec:
  type: ClusterIP
  selector:
    app: mysql-mediawiki
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
