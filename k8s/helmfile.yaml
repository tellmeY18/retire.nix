---
# helmfile.yaml — Helm releases for the glug-infra k3s cluster.
#
# Run from the repo root:
#   helmfile sync  --file k8s/helmfile.yaml   # install / upgrade
#   helmfile diff  --file k8s/helmfile.yaml   # preview changes
#
# Prerequisites:
#   helm-secrets and helm-diff are Nix-managed via wrapHelm in dev-k8s.nix.
#   No manual `helm plugin install` step needed.
#
# Layered model:
#   1. cnpg/cloudnative-pg → the operator (CRDs + controller + webhooks).
#   2. cnpg/cluster        → one release per Postgres cluster, renders the
#                             Cluster + ScheduledBackup + Pooler CRs from
#                             values files in apps/<release>/.
#
# Adding a second Postgres cluster (e.g. for analytics):
#   - Create k8s/apps/analytics/{values,secrets}.yaml.
#   - Add another release block below with `name: analytics`.
#   - `just k8s::apply`.
#
# Version policy:
#   - Always pin chart versions explicitly. Never use "*" or floating tags.
#   - Cross-check the latest at:
#       https://cloudnative-pg.github.io/charts/index.yaml
#   - When bumping, read the chart CHANGELOG for breaking changes.

repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts

helmDefaults:
  wait: true
  timeout: 600
  # Atomic install: roll back automatically on failed upgrade. Combined with
  # `wait: true` above, a failed `helmfile sync` leaves the cluster in the
  # last-known-good state rather than half-upgraded.
  atomic: true
  # Verify TLS on all chart pulls.
  verify: false # cnpg charts are unsigned upstream; flip when they sign.

releases:
  # ---------------------------------------------------------------------------
  # 1. kube-prometheus-stack (Prometheus, Alertmanager, Grafana, CRDs).
  # ---------------------------------------------------------------------------
  # Must be installed BEFORE any release that creates PodMonitor or
  # PrometheusRule CRs (i.e. the CNPG operator and cluster charts). Without
  # the CRDs in place, `helm install` fails with:
  #   "no matches for kind PodMonitor in version monitoring.coreos.com/v1"
  #
  # Chart 84.4.0 ships prometheus-operator 0.82.x, Prometheus 3.x,
  # Alertmanager 0.28.x, and Grafana 8.x.
  #
  # The namespace `monitoring` is created by kustomize (with PSA labels)
  # before helmfile runs — hence `createNamespace: false`.
  - name: kube-prometheus-stack
    namespace: monitoring
    createNamespace: false
    chart: prometheus-community/kube-prometheus-stack
    version: "84.4.0"
    values:
      - apps/kube-prometheus-stack/values.yaml
    secrets:
      - apps/kube-prometheus-stack/secrets.yaml

  # ---------------------------------------------------------------------------
  # 2. CNPG operator (CRDs + controller + admission webhooks).
  # ---------------------------------------------------------------------------
  # Chart 0.28.0 ships CNPG operator 1.28.x. The operator runs in
  # `cnpg-system`; CRDs are cluster-scoped.
  - name: cloudnative-pg
    namespace: cnpg-system
    createNamespace: true
    chart: cnpg/cloudnative-pg
    version: "0.28.0"
    # PodMonitor CRDs must exist before the operator chart tries to create
    # its PodMonitor resource.
    needs:
      - monitoring/kube-prometheus-stack
    values:
      - apps/cnpg-operator/values.yaml
    secrets:
      - apps/cnpg-operator/secrets.yaml

  # ---------------------------------------------------------------------------
  # 3. Postgres cluster — `Cluster` + `ScheduledBackup` + `Pooler`.
  # ---------------------------------------------------------------------------
  # Chart 0.6.0 maps cleanly onto operator 1.28.x. Renders all CRs from the
  # values file. The release name `postgres` is what every generated object
  # is prefixed with (Cluster/postgres, Service/postgres-rw,
  # Secret/postgres-app, etc.) — picked to be cluster-scoped, not
  # host-scoped, so the workload identity does not change as nodes come
  # and go.
  - name: postgres
    namespace: cnpg-clusters
    createNamespace: false # namespace is created by kustomize (PSA labels)
    chart: cnpg/cluster
    version: "0.6.0"
    # Apply only after the operator + CRDs are in place, and after
    # kube-prometheus-stack provides PodMonitor/PrometheusRule CRDs.
    needs:
      - cnpg-system/cloudnative-pg
      - monitoring/kube-prometheus-stack
    values:
      - apps/postgres/values.yaml
    secrets:
      - apps/postgres/secrets.yaml
