---
# helmfile.yaml — Helm releases for the glug-infra k3s cluster.
#
# Run from the repo root:
#   helmfile sync  --file k8s/helmfile.yaml   # install / upgrade
#   helmfile diff  --file k8s/helmfile.yaml   # preview changes
#
# Prerequisites:
#   helm-secrets and helm-diff are Nix-managed via wrapHelm in
#   dev-k8s.nix. No manual `helm plugin install` step needed.
#
# Layered model:
#   1. vm/victoria-metrics-k8s-stack → the monitoring stack (VMSingle,
#                                       VMAgent, VMAlert, VMAlertmanager,
#                                       Grafana, node-exporter, kube-state-metrics,
#                                       VictoriaMetrics Operator + CRDs).
#   2. cnpg/cloudnative-pg → the operator (CRDs + controller + webhooks).
#   3. cnpg/cluster        → one release per Postgres cluster.
#
# Adding a second Postgres cluster (e.g. for analytics):
#   - Create k8s/apps/analytics/{values,secrets}.yaml.
#   - Add another release block below with `name: analytics`.
#   - `just k8s::apply`.
#
# Version policy:
#   - Always pin chart versions explicitly. Never use "*" or floating tags.
#   - When bumping, read the chart CHANGELOG for breaking changes.

repositories:
  - name: vm
    url: https://victoriametrics.github.io/helm-charts
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts
  - name: traefik
    url: https://traefik.github.io/charts
helmDefaults:
  wait: true
  timeout: 600
  # Atomic install: roll back automatically on failed upgrade. Combined with
  # `wait: true` above, a failed `helmfile sync` leaves the cluster in the
  # last-known-good state rather than half-upgraded.
  atomic: true
  # Verify TLS on all chart pulls.
  verify: false # upstream charts are unsigned; flip when they sign.

releases:
  # ---------------------------------------------------------------------------
  # 1. victoria-metrics-k8s-stack (VMSingle, VMAgent, VMAlert, VMAlertmanager,
  #    Grafana, node-exporter, kube-state-metrics, VM Operator + CRDs).
  # ---------------------------------------------------------------------------
  # Must be installed BEFORE any release that creates VMPodScrape, VMRule,
  # VMServiceScrape CRs. Without the CRDs in place, `helm install` fails.
  #
  # The namespace `monitoring` is created by kustomize (with PSA labels)
  # before helmfile runs — hence `createNamespace: false`.
  - name: victoria-metrics-k8s-stack
    namespace: monitoring
    createNamespace: false
    chart: vm/victoria-metrics-k8s-stack
    version: "0.78.0"
    values:
      - apps/victoria-metrics-k8s-stack/values.yaml
    secrets:
      - apps/victoria-metrics-k8s-stack/secrets.yaml

  # ---------------------------------------------------------------------------
  # 2. CNPG operator (CRDs + controller + admission webhooks).
  # ---------------------------------------------------------------------------
  # Chart 0.28.0 ships CNPG operator 1.28.x. The operator runs in
  # `cnpg-system`; CRDs are cluster-scoped.
  - name: cloudnative-pg
    namespace: cnpg-system
    createNamespace: true
    chart: cnpg/cloudnative-pg
    version: "0.28.2"
    # VM Operator CRDs must exist before the operator chart tries to create
    # any monitoring resources (though we've disabled PodMonitor creation).
    needs:
      - monitoring/victoria-metrics-k8s-stack
    values:
      - apps/cnpg-operator/values.yaml
    secrets:
      - apps/cnpg-operator/secrets.yaml

  # ---------------------------------------------------------------------------
  # 3. Postgres cluster — `Cluster` + `ScheduledBackup` + `Pooler`.
  # ---------------------------------------------------------------------------
  # Chart 0.6.0 maps cleanly onto operator 1.28.x. Renders all CRs from the
  # values file.
  - name: postgres
    namespace: cnpg-clusters
    createNamespace: false # namespace is created by kustomize (PSA labels)
    chart: cnpg/cluster
    version: "0.6.1"
    # Apply only after the operator + CRDs are in place.
    needs:
      - cnpg-system/cloudnative-pg
      - monitoring/victoria-metrics-k8s-stack
    values:
      - apps/postgres/values.yaml
    secrets:
      - apps/postgres/secrets.yaml


  # ---------------------------------------------------------------------------
  # 9. Traefik ingress controller.
  # ---------------------------------------------------------------------------
  # Public-facing reverse proxy running on compute nodes (hostNetwork).
  # Handles TLS termination via Let’s Encrypt ACME HTTP-01 challenge.
  # Routes: tellmey.fyi (Ghost), wiki.fosscell.org (MediaWiki), ask.kenobi.win (Answer)
  - name: traefik
    namespace: traefik-system
    createNamespace: false # namespace created by kustomize (PSA labels)
    chart: traefik/traefik
    version: "40.2.0"
    values:
      - apps/traefik/values.yaml
