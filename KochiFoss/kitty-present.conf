# kitty-present.conf — presentation-mode kitty config
# Launched via: just present
#
# Uses a large monospace font optimised for stage visibility.
# Dark background matches the presenterm theme.

# ─── Font ──────────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        20.0

# Disable ligatures for maximum clarity at a distance
disable_ligatures always

# ─── Window ───────────────────────────────────────────────────────────────
# Start maximised / full-screen for presenting
remember_window_size no
initial_window_width  160c
initial_window_height 50c

# No distractions — keep macOS title bar for fullscreen toggle (Cmd+Ctrl+F)
hide_window_decorations no
window_padding_width 4

# ─── Colors ───────────────────────────────────────────────────────────────
# Match the presenterm dark theme
background #040312
foreground #e6e6e6

# ─── Behaviour ────────────────────────────────────────────────────────────
# Allow presenterm to use the kitty graphics protocol + font size protocol
allow_remote_control yes

# No confirmation on close (presenterm exits cleanly)
confirm_os_window_close 0

# Scrollback not needed during slides
scrollback_lines 0
