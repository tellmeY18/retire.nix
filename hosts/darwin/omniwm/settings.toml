# OmniWM settings — managed by home-manager via mkOutOfStoreSymlink.
# This file was seeded from an OmniWM-exported config so the format
# matches what OmniWM expects.  Edit freely; changes are live-reloaded.
#
# To reset: `home-manager switch` recreates the symlink with force=true.
# The source lives at hosts/darwin/omniwm/settings.toml in the repo.

monitorBarOverrides = []
monitorDwindleOverrides = []
monitorNiriOverrides = []
monitorOrientationOverrides = []

[appearance]
mode = "dark"

[borders]
enabled = true
width = 4.0

[borders.color]
alpha = 1.0
blue = 1.0
green = 0.7
red = 0.5

[clipboard]
historyEnabled = true
maxItemBytes = 8388608
maxItems = 200
maxTotalBytes = 67108864

[dwindle]
defaultSplitRatio = 0.5
moveToRootStable = false
singleWindowAspectRatio = "fill"
smartSplit = true
splitWidthMultiplier = 1.0
useGlobalGaps = true

[focus]
followsMouse = false
followsWindowToMonitor = false
moveMouseToFocusedWindow = false
crossesMonitorAtEdge = true

[gaps]
size = 8.0

[gaps.outer]
bottom = 10.0
left = 10.0
right = 10.0
top = 52.0

[general]
animationsEnabled = true
defaultLayoutType = "niri"
hotkeysEnabled = true
ipcEnabled = true
preventSleepEnabled = false
updateChecksEnabled = false

[gestures]
fingerCount = 3
invertDirection = false
mouseResizeModifierKey = "option"
scrollEnabled = true
scrollModifierKey = "optionShift"
scrollSensitivity = 1.0
trackpadScrollStyle = "snap"

[mouseWarp]
axis = "horizontal"
margin = 1
monitorOrder = []

[niri]
alwaysCenterSingleColumn = true
centerFocusedColumn = "never"
columnWidthPresets = [0.3333333333333333, 0.5, 0.66]
infiniteLoop = false
maxVisibleColumns = 3
maxWindowsPerColumn = 0
singleWindowAspectRatio = "disabled"

[quakeTerminal]
animationDuration = 0.2
autoHide = true
enabled = true
heightPercent = 0.5
monitorMode = "focusedWindow"
opacity = 1.0
position = "center"
useCustomFrame = false
widthPercent = 0.7

[statusBar]
showAppNames = false
showWorkspaceName = true
useWorkspaceId = false

[workspaceBar]
backgroundOpacity = 0.85
deduplicateAppIcons = true
enabled = true
height = 32.0
hideEmptyWorkspaces = true
labelFontSize = 12.0
notchAware = true
position = "overlappingMenuBar"
reserveLayoutSpace = false
showFloatingWindows = false
showLabels = true
windowLevel = "popup"
xOffset = 0.0
yOffset = 0.0

[workspaceBar.accentColor]
alpha = 1.0
blue = -1.0
green = -1.0
red = -1.0

[workspaceBar.textColor]
alpha = 1.0
blue = -1.0
green = -1.0
red = -1.0

# ── App rules ────────────────────────────────────────────────────
[[appRules]]
bundleId = "com.apple.finder"
layout = "float"

[[appRules]]
bundleId = "com.apple.systempreferences"
layout = "float"

[[appRules]]
bundleId = "com.spotify.client"
minHeight = 600.0
minWidth = 800.0

[[appRules]]
bundleId = "com.hnc.Discord"
minHeight = 500.0
minWidth = 800.0

[[appRules]]
bundleId = "com.google.Chrome"
minHeight = 375.0
minWidth = 500.0

[[appRules]]
bundleId = "dev.zed.Zed"
minHeight = 240.0
minWidth = 360.0

[[appRules]]
bundleId = "com.mitchellh.ghostty"
minHeight = 48.0
minWidth = 90.0

[[appRules]]
bundleId = "com.apple.Safari"
minHeight = 220.0
minWidth = 574.0

# ── Hotkeys — migrated from AeroSpace ────────────────────────────
# Focus: Opt+HJKL (vim style)
[[hotkeys]]
binding = "Option+H"
id = "focus.left"

[[hotkeys]]
binding = "Option+J"
id = "focus.down"

[[hotkeys]]
binding = "Option+K"
id = "focus.up"

[[hotkeys]]
binding = "Option+L"
id = "focus.right"

# Move: Opt+Shift+HJKL
[[hotkeys]]
binding = "Option+Shift+H"
id = "move.left"

[[hotkeys]]
binding = "Option+Shift+J"
id = "move.down"

[[hotkeys]]
binding = "Option+Shift+K"
id = "move.up"

[[hotkeys]]
binding = "Option+Shift+L"
id = "move.right"

# Column width (was AeroSpace resize: Opt+-/=)
[[hotkeys]]
binding = "Option+-"
id = "cycleColumnWidthBackward"

[[hotkeys]]
binding = "Option+="
id = "cycleColumnWidthForward"

# Workspaces 1-9 on current monitor: Opt+1-9
[[hotkeys]]
binding = "Option+1"
id = "switchWorkspace.0"

[[hotkeys]]
binding = "Option+2"
id = "switchWorkspace.1"

[[hotkeys]]
binding = "Option+3"
id = "switchWorkspace.2"

[[hotkeys]]
binding = "Option+4"
id = "switchWorkspace.3"

[[hotkeys]]
binding = "Option+5"
id = "switchWorkspace.4"

[[hotkeys]]
binding = "Option+6"
id = "switchWorkspace.5"

[[hotkeys]]
binding = "Option+7"
id = "switchWorkspace.6"

[[hotkeys]]
binding = "Option+8"
id = "switchWorkspace.7"

[[hotkeys]]
binding = "Option+9"
id = "switchWorkspace.8"

# Move window to workspace: Opt+Shift+1-9
[[hotkeys]]
binding = "Option+Shift+1"
id = "moveToWorkspace.0"

[[hotkeys]]
binding = "Option+Shift+2"
id = "moveToWorkspace.1"

[[hotkeys]]
binding = "Option+Shift+3"
id = "moveToWorkspace.2"

[[hotkeys]]
binding = "Option+Shift+4"
id = "moveToWorkspace.3"

[[hotkeys]]
binding = "Option+Shift+5"
id = "moveToWorkspace.4"

[[hotkeys]]
binding = "Option+Shift+6"
id = "moveToWorkspace.5"

[[hotkeys]]
binding = "Option+Shift+7"
id = "moveToWorkspace.6"

[[hotkeys]]
binding = "Option+Shift+8"
id = "moveToWorkspace.7"

[[hotkeys]]
binding = "Option+Shift+9"
id = "moveToWorkspace.8"

# Back-and-forth: Opt+Tab
[[hotkeys]]
binding = "Option+Tab"
id = "workspaceBackAndForth"

# Fullscreen: Opt+Shift+F
[[hotkeys]]
binding = "Option+Shift+F"
id = "toggleFullscreen"

# Toggle floating: Opt+Shift+Space
[[hotkeys]]
binding = "Option+Shift+Space"
id = "toggleFocusedWindowFloating"

# Toggle layout (Niri ↔ Dwindle): Opt+Shift+L
[[hotkeys]]
binding = "Option+Shift+L"
id = "toggleWorkspaceLayout"

# Overview: Opt+Shift+O
[[hotkeys]]
binding = "Option+Shift+O"
id = "toggleOverview"

# Quake terminal: Opt+Return
[[hotkeys]]
binding = "Option+Return"
id = "toggleQuakeTerminal"

# Focus next monitor: Opt+Shift+Tab
[[hotkeys]]
binding = "Option+Shift+Tab"
id = "focusMonitorNext"

# ── Unassigned defaults (prevent OmniWM from re-adding them) ─────
# These are set to Unassigned so OmniWM doesn't fall back to defaults.
# Without them, startup would trigger a file-rewrite as OmniWM
# adds missing entries back in.

[[hotkeys]]
binding = "Unassigned"
id = "switchWorkspace.next"

[[hotkeys]]
